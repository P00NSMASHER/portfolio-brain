name: steps16-17-exact-main-acceptance

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/live_state_bridge.py"
      - "dashboard/command_center.py"
      - "governance/**"
      - "tests/test_command_center_live_state.py"
      - "tests/test_evidence_semantics.py"
      - "tests/test_governance_boundaries.py"
      - ".github/workflows/steps16-17-exact-main-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require exact current protected main
        run: |
          python - <<'PY'
          import json, os, urllib.request
          if os.environ.get("GITHUB_REF_NAME") != "main":
              raise SystemExit("STEPS_16_17_REQUIRE_MAIN")
          req=urllib.request.Request(
              "https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/branches/main",
              headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","User-Agent":"steps16-17-acceptance/1.0"},
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              current=json.load(r)["commit"]["sha"]
          if current != os.environ["GITHUB_SHA"]:
              raise SystemExit("STALE_MAIN_ACCEPTANCE")
          print("exact main:",current)
          PY
      - name: Validate authority matrix
        run: python -m governance.validate_boundaries
      - name: Run Step 16-17 focused regressions
        run: |
          python -m unittest discover -s tests -p "test_command_center_live_state.py" -v
          python -m unittest discover -s tests -p "test_evidence_semantics.py" -v
          python -m unittest discover -s tests -p "test_governance_boundaries.py" -v
      - name: Emit exact-main acceptance receipt
        run: |
          mkdir -p verification/out
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from dashboard.live_state_bridge import EVIDENCE_SEMANTICS
          from governance.validate_boundaries import validate_boundaries
          req=urllib.request.Request(
              "https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/branches/main",
              headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","User-Agent":"steps16-17-acceptance/1.0"},
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              current=json.load(r)["commit"]["sha"]
          if current != os.environ["GITHUB_SHA"]:
              raise SystemExit("MAIN_MOVED_DURING_ACCEPTANCE")
          gov=validate_boundaries()
          core={
            "schema_version":"1.0.0",
            "status":"PASS",
            "source_sha":current,
            "step16":{
              "heartbeat_semantics":EVIDENCE_SEMANTICS["heartbeat"],
              "notification_semantics":EVIDENCE_SEMANTICS["notification"],
              "pages_semantics":EVIDENCE_SEMANTICS["pages"],
              "technical_verification_credit":False,
              "market_verification_credit":False,
              "revenue_verification_credit":False,
              "restore_failures_blocked":True,
              "lineage_sequence_and_hash_exposed":True
            },
            "step17":{
              "authority_model":gov["authority_model"],
              "project_count":gov["projects"],
              "deny_by_default":True,
              "live_trading_prohibited":True,
              "high_risk_human_gates_preserved":True
            },
            "authority_granted":False
          }
          raw=json.dumps(core,sort_keys=True,separators=(",",":")).encode()
          core["receipt_hash"]="sha256:"+hashlib.sha256(raw).hexdigest()
          open("verification/out/steps16_17_exact_main_acceptance.json","w").write(json.dumps(core,indent=2,sort_keys=True)+"\n")
          print(json.dumps(core,sort_keys=True))
          PY
      - name: Upload acceptance receipt
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-steps16-17-exact-main-${{ github.run_id }}
          path: verification/out/steps16_17_exact_main_acceptance.json
          if-no-files-found: error
          retention-days: 30
