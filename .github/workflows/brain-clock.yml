name: brain-clock-v2
on:
  push:
    branches: [brain-clock-v2]
    paths: [clock/pulse.json]
permissions:
  contents: read
concurrency:
  group: brain-v2-clock
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - name: Resolve protected main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Validate immutable clock signal and dispatch protected main once
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/clock/pulse.json?ref=${GITHUB_SHA}" --jq .content | base64 -d | python -m brain.clock "$SOURCE_SHA" > /tmp/clock.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/brain-cycle.yml/dispatches" -f ref=main -f "inputs[clock_commit]=$GITHUB_SHA"
          echo "DISPATCH_REQUEST_ACCEPTED: execution success requires the separate actual core run"
      - name: Preserve clock provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brain-v2-clock-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/clock.json
          if-no-files-found: warn
          retention-days: 30
