name: portfolio-autonomous-scheduler

on:
  schedule:
    - cron: "23 * * * *"
    # Exact Step-23 soak window; real schedule events only, normal cadence remains unchanged.
    - cron: "44 19 1 10 *"
    - cron: "14 20 1 10 *"
    - cron: "44 20 1 10 *"
  repository_dispatch:
    types: ["portfolio_schedule"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: portfolio-scheduler
  cancel-in-progress: false
  queue: max

jobs:
  schedule:
    # Serialize the complete restore -> mutate -> upload transaction.
    concurrency:
      group: portfolio-state-writer-v1
      cancel-in-progress: false
      queue: max
    if: ${{ vars.PORTFOLIO_SCHEDULER_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_SCHEDULER_DISABLED: ${{ vars.PORTFOLIO_SCHEDULER_DISABLED }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check independent workload controls
        id: workload
        run: >-
          python -m workload_control.workload_gate preflight
          --workflow-id portfolio-autonomous-scheduler
          --job-id schedule
          --estimated-minutes 5
      - name: Execute exact Step 23 required handlers
        if: ${{ steps.workload.outputs.allowed == 'true' && github.event_name == 'schedule' && (github.event.schedule == '44 19 1 10 *' || github.event.schedule == '14 20 1 10 *' || github.event.schedule == '44 20 1 10 *') }}
        run: >-
          python -m scheduler.step8_acceptance
          --source-ref RTASK-4730DF8216170D0353B7
          --output scheduler/out/step23_handler_acceptance.json
      - name: Upload exact Step 23 handler evidence
        if: ${{ steps.workload.outputs.allowed == 'true' && github.event_name == 'schedule' && (github.event.schedule == '44 19 1 10 *' || github.event.schedule == '14 20 1 10 *' || github.event.schedule == '44 20 1 10 *') }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-step23-handler-acceptance
          path: scheduler/out/step23_handler_acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Restore canonical scheduler state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain scheduler --output scheduler/live/scheduler_state.json
      - name: Restore canonical Hunter state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain hunter --output hunting/live/hunter_state.json
      - name: Restore canonical Hunter proposal inbox
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain proposals --output hunting/live/hunter_proposal_state.json
      - name: Restore canonical Hunter proposal review state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain reviews --output hunting/live/hunter_proposal_review_state.json
      - name: Restore durable Hunter downstream lifecycle
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m hunting.lifecycle_artifact_state
          --output hunting/live/hunter_lifecycle_state.json
          --metadata-output hunting/live/hunter_lifecycle_restore_receipt.json
      - name: Restore canonical runtime state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain runtime --output runtime/live/runtime_state.json
      - name: Restore canonical agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain heartbeat --output agents/live/agent_heartbeat_state.json
      - name: Select bounded work
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m scheduler.autonomous_scheduler --state scheduler/live/scheduler_state.json --output-dir scheduler/out
      - name: Validate executor dependencies before queue mutation
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: |
          python -m scheduler.validate_scheduler
          python -m hunting.validate_hunter
          python -m adapters.validate_adapters
      - name: Execute bounded queued work
        id: execute
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m scheduler.work_executor
          --state scheduler/out/scheduler_state.json
          --runtime-state runtime/live/runtime_state.json
          --hunter-state hunting/live/hunter_state.json
          --output-dir scheduler/out
          --hunter-output-dir hunting/out
          --max-items 8
      - name: Reuse spare capacity for Hunter proposal continuation
        id: hunter_continuation
        if: ${{ steps.workload.outputs.allowed == 'true' && steps.execute.outputs.attempted_count != '8' }}
        run: >-
          python -m scheduler.same_cycle_continuation
          --scheduler-state scheduler/out/scheduler_state.json
          --runtime-state runtime/live/runtime_state.json
          --hunter-state hunting/out/hunter_state.json
          --hunter-state-fallback hunting/live/hunter_state.json
          --hunter-proposal-state hunting/out/hunter_proposal_state.json
          --hunter-proposal-state-fallback hunting/live/hunter_proposal_state.json
          --primary-receipts scheduler/out/execution_receipts.json
          --primary-executed scheduler/out/executed_work.json
          --primary-cycle-receipt scheduler/out/execution_cycle_receipt.json
          --output-dir scheduler/out
          --max-items 8
      - name: Persist Hunter proposal evidence reviews
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m hunting.proposal_review_state
          --state hunting/live/hunter_proposal_review_state.json
          --execution-receipts scheduler/out/execution_receipts.json
          --output hunting/out/hunter_proposal_review_state.json
          --report hunting/out/hunter_proposal_review_report.json
      - name: Validate Hunter proposal review state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -c "import json; from hunting.proposal_review_state import validate_state; validate_state(json.load(open('hunting/out/hunter_proposal_review_state.json')))"
      - name: Reconcile explicitly accepted Hunter work
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m hunting.downstream_lifecycle
          --state hunting/live/hunter_lifecycle_state.json
          --reviews hunting/out/hunter_proposal_review_state.json
          --approvals operator_console/OWNER_APPROVALS.json
          --base-sha "$GITHUB_SHA"
          --current-repository "$GITHUB_REPOSITORY"
          --source-branch "$GITHUB_REF_NAME"
          --reconcile-implementation
          --output-state hunting/out/hunter_lifecycle_state.json
          --report hunting/out/hunter_lifecycle_report.json
      - name: Validate Hunter downstream lifecycle state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -c "import json; from hunting.downstream_lifecycle import validate_state; validate_state(json.load(open('hunting/out/hunter_lifecycle_state.json')))"
      - name: Heartbeat Portfolio Manager
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m agents.heartbeat_state
          --state agents/live/agent_heartbeat_state.json
          --output agents/out/agent_heartbeat_state.json
          --agent-id AGT-PORTFOLIO-MANAGER
          --activity-kind SCHEDULER_CYCLE
          --source-workflow portfolio-autonomous-scheduler
          --source-run-id "${GITHUB_RUN_ID}"
      - name: Heartbeat agents that actually executed work
        if: ${{ steps.workload.outputs.allowed == 'true' && steps.execute.outputs.executed_count != '0' }}
        run: >-
          python -m agents.heartbeat_state
          --state agents/out/agent_heartbeat_state.json
          --output agents/out/agent_heartbeat_state.json
          --selected-work scheduler/out/executed_work.json
          --activity-kind WORK_EXECUTION
          --source-workflow portfolio-autonomous-scheduler
          --source-run-id "${GITHUB_RUN_ID}"
      - name: Validate persisted scheduler state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -c "import json; from scheduler.autonomous_scheduler import validate_state; validate_state(json.load(open('scheduler/out/scheduler_state.json')))"
      - name: Validate Hunter state when executed
        if: ${{ steps.workload.outputs.allowed == 'true' && hashFiles('hunting/out/hunter_state.json') != '' }}
        run: python -c "import json; from hunting.autonomous_hunter import validate_state; validate_state(json.load(open('hunting/out/hunter_state.json')))"
      - name: Upload sanitized scheduler continuation state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        id: journal_upload_scheduler
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-scheduler-state
          path: scheduler/out/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Hunter continuation state when work executed
        if: ${{ steps.workload.outputs.allowed == 'true' && hashFiles('hunting/out/hunter_state.json') != '' }}
        id: journal_upload_hunter
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hunter-state
          path: hunting/out/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Hunter proposal inbox when hunt work executed
        if: ${{ steps.workload.outputs.allowed == 'true' && hashFiles('hunting/out/hunter_proposal_state.json') != '' }}
        id: journal_upload_proposals
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hunter-proposal-state
          path: hunting/out/hunter_proposal_state.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Hunter proposal review continuation state
        if: ${{ steps.workload.outputs.allowed == 'true' && hashFiles('hunting/out/hunter_proposal_review_state.json') != '' }}
        id: journal_upload_reviews
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hunter-proposal-review-state
          path: |
            hunting/out/hunter_proposal_review_state.json
            hunting/out/hunter_proposal_review_report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload durable Hunter downstream lifecycle
        if: ${{ steps.workload.outputs.allowed == 'true' && hashFiles('hunting/out/hunter_lifecycle_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hunter-lifecycle-state
          path: |
            hunting/out/hunter_lifecycle_state.json
            hunting/out/hunter_lifecycle_report.json
            hunting/live/hunter_lifecycle_restore_receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        id: journal_upload_heartbeat
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agent-heartbeat-state
          path: agents/out/agent_heartbeat_state.json
          if-no-files-found: error
          retention-days: 30
      - name: Report governed no-work outcome
        if: ${{ always() && steps.workload.outputs.allowed != 'true' }}
        run: |
          echo "::error title=Portfolio scheduler skipped::Workload status: ${{ steps.workload.outputs.decision_status }}"
          exit 1
      - name: Capture immutable state transition event
        id: journal_event
        if: ${{ always() }}
        env:
          JOURNAL_PUBLISHED_DOMAINS: >-
            {"heartbeat": ${{ steps.journal_upload_heartbeat.outcome == 'success' }}, "hunter": ${{ steps.journal_upload_hunter.outcome == 'success' }}, "proposals": ${{ steps.journal_upload_proposals.outcome == 'success' }}, "reviews": ${{ steps.journal_upload_reviews.outcome == 'success' }}, "scheduler": ${{ steps.journal_upload_scheduler.outcome == 'success' }}}
        run: python -m state_journal.emitter --producer portfolio-autonomous-scheduler
      - name: Upload immutable state transition event
        if: ${{ always() && steps.journal_event.outputs.emitted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-event-v2-${{ github.run_id }}-portfolio-autonomous-scheduler-${{ github.sha }}-${{ github.run_attempt }}
          path: state_journal/out/event/event.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30