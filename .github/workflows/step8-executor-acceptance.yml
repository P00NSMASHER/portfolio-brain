name: step8-executor-acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "verification/STEP8_ACCEPTANCE_TRIGGER.json"
      - ".github/workflows/step8-executor-acceptance.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Open repair-evidence PR source ref"
        required: true
        type: string

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read

jobs:
  prove:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.body, 'STEP8_LIVE_ACCEPTANCE')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve exact live acceptance source and wait for protected evidence
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_REF: ${{ inputs.source_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.request
          event=os.environ["EVENT_NAME"]
          out=os.environ["GITHUB_OUTPUT"]
          if event=="workflow_dispatch":
              source=os.environ.get("MANUAL_SOURCE_REF","").strip()
              if not source:
                  raise SystemExit("manual source_ref missing")
          else:
              body=os.environ.get("PR_BODY","")
              match=re.search(r"REPAIR_SOURCE_REF:([A-Za-z0-9._:-]+)",body)
              if not match:
                  raise SystemExit("controlled acceptance PR source marker missing")
              source=match.group(1)
              sha=os.environ.get("PR_HEAD_SHA","")
              if not re.fullmatch(r"[0-9a-f]{40}",sha):
                  raise SystemExit("acceptance PR head SHA invalid")
              token=os.environ["GITHUB_TOKEN"]
              repo=os.environ["GITHUB_REPOSITORY"]
              headers={
                "Accept":"application/vnd.github+json",
                "Authorization":f"Bearer {token}",
                "X-GitHub-Api-Version":"2022-11-28",
                "User-Agent":"portfolio-step8-live-acceptance/1.0",
              }
              deadline=time.time()+240
              required={("validate",15368),("portfolio-phase1-gate",5121826)}
              while True:
                  req=urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100",
                      headers=headers,
                  )
                  with urllib.request.urlopen(req,timeout=30) as response:
                      rows=json.load(response).get("check_runs",[])
                  by={(r.get("name"),r.get("app",{}).get("id")):r for r in rows}
                  bad=[
                    (name,app,row.get("conclusion"))
                    for (name,app),row in by.items()
                    if (name,app) in required
                    and row.get("status")=="completed"
                    and row.get("conclusion") not in {"success",None}
                  ]
                  if bad:
                      raise SystemExit(f"required protected evidence failed: {bad!r}")
                  if all(
                      by.get(key,{}).get("status")=="completed"
                      and by.get(key,{}).get("conclusion")=="success"
                      for key in required
                  ):
                      break
                  if time.time()>=deadline:
                      raise SystemExit("timed out waiting for Foundation + hosted App 5121826")
                  time.sleep(10)
          with open(out,"a",encoding="utf-8") as fh:
              fh.write(f"source_ref={source}\n")
          print(json.dumps({"source_ref":source,"event":event},sort_keys=True))
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute real default REPAIR TEST VERIFICATION handlers
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          GITHUB_SHA="$MAIN_SHA" python -m scheduler.step8_acceptance             --source-ref "$SOURCE_REF"             --output scheduler/out/step8_acceptance.json
      - name: Preserve Step 8 acceptance receipt
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-step8-executor-acceptance-${{ github.run_id }}
          path: scheduler/out/step8_acceptance.json
          if-no-files-found: error
          retention-days: 30
