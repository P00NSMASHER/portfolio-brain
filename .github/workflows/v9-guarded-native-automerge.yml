name: v9-guarded-native-automerge

# Existing independent verifier completion is the only trigger.
# No Cron, pull_request_target, workflow_dispatch, or PR-source execution.
on:
  workflow_run:
    workflows: ["portfolio-independent-verifier"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: v9-guarded-native-automerge
  cancel-in-progress: false

jobs:
  enroll-eligible-only:
    if: >-
      ${{
        github.repository == 'P00NSMASHER/portfolio-brain' &&
        github.event.workflow_run.repository.full_name == 'P00NSMASHER/portfolio-brain' &&
        github.event.workflow_run.name == 'portfolio-independent-verifier' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout exact trusted main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin reviewed native merge policy and event runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object brain/v9/guarded_merge.py)" = "4369d2a9c784157ea83572eb9ebdf5cf6f1558e6"
          test "$(git hash-object brain/v9/guarded_merge_runner.py)" = "18d91e7d20d2ab0c64c65f6fe199052409d6ba71"
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independently admit at most three source-bound low-risk drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m brain.v9.guarded_merge_runner
