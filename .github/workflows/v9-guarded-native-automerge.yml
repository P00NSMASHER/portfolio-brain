name: v9-guarded-native-automerge

# Successful original Foundation CI is the ONLY trigger; the independent
# App 5121826 check must still be outstanding during enrollment. GitHub
# strictly enforces BOTH issuer-pinned checks at final merge.
# No Cron, pull_request_target, workflow_dispatch, or PR-source execution.
on:
  workflow_run:
    workflows: ["foundation-ci"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: v9-guarded-native-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  enroll-eligible-only:
    if: >-
      ${{
        github.repository == 'P00NSMASHER/portfolio-brain' &&
        github.event.workflow_run.repository.full_name == 'P00NSMASHER/portfolio-brain' &&
        github.event.workflow_run.name == 'foundation-ci' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == 'P00NSMASHER/portfolio-brain' &&
        github.event.workflow_run.head_branch != 'main' &&
        github.event.workflow_run.head_sha != github.sha
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      issues: read
    steps:
      - name: Checkout exact trusted main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin reviewed native merge policy and event runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object brain/v9/guarded_merge.py)" = "62c3d4346eefea2f10fc0759dd51a1738de49f1c"
          test "$(git hash-object brain/v9/guarded_merge_runner.py)" = "03b019cbcb1bd057e486456dff8ac8c40a6aa1ee"
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Admit only the exact successful Foundation candidate before second check
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDATION_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python -m brain.v9.guarded_merge_runner
      - name: Admit source-bound v10 bot repair to native protected auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          V11_EVENT_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: python -m brain.v11.verified_delivery
      - name: Build bounded verified-results and issue backlog report
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/brain-v11
          python -m brain.v11.results_dashboard \
            --expected-main "${{ github.sha }}" \
            --json /tmp/brain-v11/results.json \
            --html /tmp/brain-v11/results.html
      - name: Upload sampled no-secrets engineering evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brain-v11-results-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}
          path: /tmp/brain-v11/
          if-no-files-found: ignore
          retention-days: 7
