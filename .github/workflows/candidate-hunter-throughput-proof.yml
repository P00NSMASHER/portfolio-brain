name: candidate-hunter-throughput-proof

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scheduler/**"
      - "hunting/proposal_review_state.py"
      - "tests/test_same_cycle_continuation.py"
      - ".github/workflows/candidate-hunter-throughput-proof.yml"

permissions:
  contents: read
  actions: read

jobs:
  proof:
    if: ${{ github.event.pull_request.head.ref == 'upgrade/hunter-second-continuation-wave-20260928' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore audited durable inputs without leaking authorization on redirects
        run: |
          python - <<'PY'
          import os, zipfile
          from io import BytesIO
          from pathlib import Path
          import urllib.request
          from runtime.artifact_http import open_url

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          artifacts={
            'scheduler':10947200555,
            'proposals':10947145741,
            'reviews':10946532825,
            'hunter':10946314199,
            'runtime':10945879118,
          }
          root=Path('candidate-proof/input')
          for name,artifact_id in artifacts.items():
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip',
                  headers={
                    'Accept':'application/vnd.github+json',
                    'Authorization':f'Bearer {token}',
                    'X-GitHub-Api-Version':'2022-11-28',
                    'User-Agent':'portfolio-brain-candidate-proof/1.0',
                  },
                  method='GET',
              )
              with open_url(req,timeout=30) as response:
                  payload=response.read()
              target=root/name
              target.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(BytesIO(payload)) as zf:
                  zf.extractall(target)
          PY
      - name: Execute candidate residual-capacity proof
        id: candidate
        run: >-
          python -m scheduler.same_cycle_continuation
          --scheduler-state candidate-proof/input/scheduler/scheduler_state.json
          --runtime-state candidate-proof/input/runtime/runtime_state.json
          --hunter-state candidate-proof/input/hunter/hunter_state.json
          --hunter-proposal-state candidate-proof/input/proposals/hunter_proposal_state.json
          --primary-receipts candidate-proof/input/scheduler/execution_receipts.json
          --primary-executed candidate-proof/input/scheduler/executed_work.json
          --primary-cycle-receipt candidate-proof/input/scheduler/execution_cycle_receipt.json
          --output-dir candidate-proof/out
          --max-items 8
      - name: Persist exact-review provenance in isolated proof state
        run: >-
          python -m hunting.proposal_review_state
          --state candidate-proof/input/reviews/hunter_proposal_review_state.json
          --execution-receipts candidate-proof/out/execution_receipts.json
          --output candidate-proof/out/hunter_proposal_review_state.json
          --report candidate-proof/out/hunter_proposal_review_report.json
      - name: Verify candidate exact-run accounting and review lineage
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from operations.workflow_liveness import load_policy, verify_work_proof
          from hunting.proposal_review_state import validate_state as validate_review_state

          out=Path('candidate-proof/out')
          summary=json.loads((out/'execution_cycle_receipt.json').read_text())
          report=json.loads((out/'same_cycle_continuation_report.json').read_text())
          receipts=json.loads((out/'execution_receipts.json').read_text())
          review_state=json.loads((out/'hunter_proposal_review_state.json').read_text())
          review_report=json.loads((out/'hunter_proposal_review_report.json').read_text())
          validate_review_state(review_state)

          assert summary['attempted_count']==8, summary
          assert summary['completed_count']==8, summary
          assert summary['deferred_count']==0, summary
          assert summary['remaining_queued_count']==0, summary
          assert report['status']=='EXECUTED', report
          assert report['attempted_count']==1, report
          assert report['completed_count']==1, report
          assert report['deferred_count']==0, report
          assert report['unused_capacity']==0, report
          assert len(report['proposal_ids'])==1, report
          assert review_report['review_count']==17, review_report
          assert len(review_report['added_review_ids'])==1, review_report

          new_receipt=receipts[-1]
          assert new_receipt['result_kind']=='HUNTER_PROPOSAL_PUBLIC_EVIDENCE_REVIEW', new_receipt
          result=new_receipt['result']
          assert result['rights_state']=='UNKNOWN_REQUIRES_REVIEW', result
          assert result['reuse_authorized'] is False, result
          assert result['implementation_authorized'] is False, result
          assert result['code_execution_performed'] is False, result
          assert result['downstream_mutation_performed'] is False, result

          persisted=[r for r in review_state['reviews'] if r['source_execution_id']==new_receipt['execution_id']]
          assert len(persisted)==1, persisted
          review=persisted[0]
          assert review['source_execution_receipt_hash']==new_receipt['receipt_hash'], review
          assert review['revision']==result['revision'], review
          assert review['tree_sha']==result['tree_sha'], review

          target=next(row for row in load_policy()['targets'] if row['workflow_name']=='portfolio-autonomous-scheduler')
          proof=verify_work_proof(target,summary,run_id=int(os.environ['GITHUB_RUN_ID']))
          assert proof['status']=='VERIFIED_WORK', proof
          assert proof['metrics']=={'attempted':8,'completed':8,'deferred':0,'remaining_queued':0}, proof

          manifest={
            'schema_version':'1.0.0',
            'candidate_head':os.environ.get('GITHUB_SHA'),
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'audited_scheduler_run_id':36363972400,
            'audited_scheduler_artifact_id':10947200555,
            'audited_proposal_artifact_id':10947145741,
            'audited_review_artifact_id':10946532825,
            'audited_hunter_artifact_id':10946314199,
            'audited_runtime_artifact_id':10945879118,
            'execution_cycle_receipt_hash':summary['receipt_hash'],
            'attempted_count':summary['attempted_count'],
            'completed_count':summary['completed_count'],
            'deferred_count':summary['deferred_count'],
            'proposal_id':report['proposal_ids'][0],
            'new_execution_id':new_receipt['execution_id'],
            'new_execution_receipt_hash':new_receipt['receipt_hash'],
            'new_review_id':review['review_id'],
            'review_count_before':16,
            'review_count_in_isolated_proof':17,
            'production_backlog_claimed_improved':False,
            'authority_granted':False,
          }
          (out/'candidate_proof_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,sort_keys=True))
          PY
      - name: Upload durable candidate proof
        uses: actions/upload-artifact@v4
        with:
          name: candidate-hunter-throughput-proof-${{ github.event.pull_request.head.sha }}
          path: candidate-proof/out/
          if-no-files-found: error
          retention-days: 30
