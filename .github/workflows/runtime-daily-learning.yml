name: runtime-daily-learning

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "runtime/TRIGGER_DAILY_REASONING"

permissions:
  contents: read
  actions: read

jobs:
  daily:
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: daily
    secrets:
      portfolio_model_api_key: ${{ secrets.PORTFOLIO_MODEL_API_KEY }}
