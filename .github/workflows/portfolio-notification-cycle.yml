name: portfolio-notification-cycle
# Legacy validator reference only: notifications.artifact_state

on:
  schedule:
    - cron: "7 */6 * * *"
    # Three date-bounded Step-23 waves for 2026-10-04 UTC; normal cadence is unchanged.
    - cron: "37 22 4 10 *"
    - cron: "7 23 4 10 *"
    - cron: "37 23 4 10 *"
  repository_dispatch:
    types: ["portfolio_notify"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-notification
  cancel-in-progress: false
  queue: max

jobs:
  notify:
    # Serialize the complete restore -> mutate -> upload transaction.
    concurrency:
      group: portfolio-state-writer-v1
      cancel-in-progress: false
      queue: max
    if: ${{ vars.PORTFOLIO_NOTIFICATION_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PORTFOLIO_NOTIFICATION_DISABLED: ${{ vars.PORTFOLIO_NOTIFICATION_DISABLED }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check independent workload controls
        id: workload
        run: >-
          python -m workload_control.workload_gate preflight
          --workflow-id portfolio-notification-cycle
          --job-id notify
          --estimated-minutes 2
      - name: Restore canonical notification state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain notifications --output notifications/live/notification_state.json
      - name: Restore canonical scheduler state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain scheduler --output scheduler/live/scheduler_state.json
      - name: Build evidence-gated alerts
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m notifications.notification_engine
          --state notifications/live/notification_state.json
          --scheduler-state scheduler/live/scheduler_state.json
          --cost-state cost_governor/live/cost_state.json
          --output-dir notifications/out
      - name: Emit sanitized GitHub alerts
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m notifications.github_sink --alerts notifications/out/emitted_alerts.json
      - name: Validate persisted notification state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -c "import json; from notifications.notification_engine import validate_state; validate_state(json.load(open('notifications/out/notification_state.json')))"
      - name: Upload sanitized notification continuation state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        id: journal_upload_notifications
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-notification-state
          path: notifications/out/
          if-no-files-found: error
          retention-days: 30
      - name: Report governed no-work outcome
        if: ${{ always() && steps.workload.outputs.allowed != 'true' }}
        run: |
          echo "::error title=Portfolio notifications skipped::Workload status: ${{ steps.workload.outputs.decision_status }}"
          exit 1
      - name: Capture immutable state transition event
        id: journal_event
        if: ${{ always() }}
        env:
          JOURNAL_PUBLISHED_DOMAINS: >-
            {"notifications": ${{ steps.journal_upload_notifications.outcome == 'success' }}}
        run: python -m state_journal.emitter --producer portfolio-notification-cycle
      - name: Upload immutable state transition event
        if: ${{ always() && steps.journal_event.outputs.emitted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-event-v2-${{ github.run_id }}-portfolio-notification-cycle-${{ github.sha }}-${{ github.run_attempt }}
          path: state_journal/out/event/event.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
