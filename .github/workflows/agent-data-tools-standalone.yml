name: Agent Data Tools Standalone CI

on:
  push:
    branches:
      - agent-data-tools-standalone
    paths:
      - 'services/agent-data-tools-standalone/**'
      - '.github/workflows/agent-data-tools-standalone.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-data-tools-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent-data-tools-standalone/package.json
      - run: npm install
      - run: npm test
      - run: node --check src/x402.mjs
      - run: node --check src/data.mjs
      - run: node --check src/server.mjs
