name: x402 gateway CI

on:
  pull_request:
    paths:
      - 'software_factory/agent-data-tools-x402-gateway/**'
      - '.github/workflows/x402-gateway-ci.yml'
  push:
    branches:
      - 'feat/x402-unified-gateway'
    paths:
      - 'software_factory/agent-data-tools-x402-gateway/**'
      - '.github/workflows/x402-gateway-ci.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software_factory/agent-data-tools-x402-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check
      - run: npm test
