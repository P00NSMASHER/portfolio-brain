name: x402 gateway CI

on:
  pull_request:
    paths:
      - 'software_factory/agent-data-tools-x402-gateway/**'
      - '.github/workflows/x402-gateway-ci.yml'
  push:
    branches:
      - 'feat/x402-unified-gateway'
    paths:
      - 'software_factory/agent-data-tools-x402-gateway/**'
      - '.github/workflows/x402-gateway-ci.yml'

permissions:
  contents: read

concurrency:
  group: x402-gateway-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software_factory/agent-data-tools-x402-gateway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: npm run check
      - run: npm test
