name: model-value-proof

on:
  push:
    branches: ["main"]
    paths:
      - "value_proof/TRIGGER_END_TO_END_PROOF"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proof:
    concurrency:
      group: portfolio-state-writer-v1
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
      PORTFOLIO_MODEL_API_KEY: ${{ secrets.PORTFOLIO_MODEL_API_KEY }}
      PORTFOLIO_SPEND_DISABLED: ${{ vars.PORTFOLIO_SPEND_DISABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore latest cost-governor state
        run: python -m cost_governor.artifact_state --output cost_governor/live/cost_state.json

      - name: Reserve bounded value-proof compute
        id: cost
        run: >-
          python -m cost_governor.workflow_gate preflight
          --state cost_governor/live/cost_state.json
          --output-dir cost_governor/out
          --workflow-id model-value-proof
          --job-id proof
          --project-id PRJ-005
          --estimated-minutes 5
          --authority OBSERVE

      - name: Restore latest Hunter learning state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: |
          mkdir -p hunting/live
          python -m hunting.artifact_state --output hunting/live/hunter_state.json
          if [ ! -f hunting/live/hunter_state.json ]; then
            cp hunting/HUNTER_STATE_SEED.json hunting/live/hunter_state.json
          fi

      - name: Restore latest model feedback state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: |
          mkdir -p model_router/live
          python -m model_router.feedback_artifact_state --output model_router/live/model_feedback_state.json
          if [ ! -f model_router/live/model_feedback_state.json ]; then
            cp model_router/MODEL_FEEDBACK_STATE_SEED.json model_router/live/model_feedback_state.json
          fi

      - name: Restore latest learning observation state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: |
          mkdir -p learning/live
          python -m learning.artifact_state --output learning/live/learning_observation_state.json
          if [ ! -f learning/live/learning_observation_state.json ]; then
            cp learning/LIVE_OBSERVATION_STATE_SEED.json learning/live/learning_observation_state.json
          fi

      - name: Fetch exact-revision public evidence
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m value_proof.fetch_evidence
          --contract value_proof/MODEL_TASK_CONTRACT.json
          --output value_proof/out/evidence_pack.json

      - name: Execute governed Tier-2 builder model
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m value_proof.model_task
          --contract value_proof/MODEL_TASK_CONTRACT.json
          --evidence-pack value_proof/out/evidence_pack.json
          --cost-state cost_governor/out/cost_state.json
          --output-dir value_proof/out

      - name: Execute independent Tier-3 verifier
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m value_proof.verifier
          --task-contract value_proof/MODEL_TASK_CONTRACT.json
          --verifier-contract value_proof/VERIFIER_CONTRACT.json
          --evidence-pack value_proof/out/evidence_pack.json
          --builder-output value_proof/out/builder_output.json
          --builder-execution-receipt value_proof/out/model_task_execution_receipt.json
          --builder-provider-receipt value_proof/out/model_provider_receipt.json
          --cost-state cost_governor/out/cost_state.json
          --output-dir value_proof/out

      - name: Finalize verified technical value outcome
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m value_proof.end_to_end
          --task-contract value_proof/MODEL_TASK_CONTRACT.json
          --verifier-contract value_proof/VERIFIER_CONTRACT.json
          --evidence-pack value_proof/out/evidence_pack.json
          --builder-output value_proof/out/builder_output.json
          --builder-execution-receipt value_proof/out/model_task_execution_receipt.json
          --builder-provider-receipt value_proof/out/model_provider_receipt.json
          --deterministic-receipt value_proof/out/deterministic_verification_receipt.json
          --verifier-output value_proof/out/independent_verifier_output.json
          --verification-receipt value_proof/out/verification_receipt.json
          --verifier-provider-receipt value_proof/out/independent_verifier_provider_receipt.json
          --output value_proof/out/value_outcome.json

      - name: Apply VERIFIED outcome feedback
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m value_proof.feedback_loop
          --task-contract value_proof/MODEL_TASK_CONTRACT.json
          --verifier-contract value_proof/VERIFIER_CONTRACT.json
          --value-outcome value_proof/out/value_outcome.json
          --builder-provider-receipt value_proof/out/model_provider_receipt.json
          --verifier-provider-receipt value_proof/out/independent_verifier_provider_receipt.json
          --hunter-state hunting/live/hunter_state.json
          --model-feedback-state model_router/live/model_feedback_state.json
          --output-dir value_proof/out

      - name: Ingest VERIFIED outcome into continuous learning
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m learning.live_observations
          --state learning/live/learning_observation_state.json
          --task-contract value_proof/MODEL_TASK_CONTRACT.json
          --verifier-contract value_proof/VERIFIER_CONTRACT.json
          --value-outcome value_proof/out/value_outcome.json
          --feedback-receipt value_proof/out/feedback_loop_receipt.json
          --builder-provider-receipt value_proof/out/model_provider_receipt.json
          --verifier-provider-receipt value_proof/out/independent_verifier_provider_receipt.json
          --output value_proof/out/learning_observation_state.json

      - name: Validate learned feedback state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: |
          python -c "import json; from hunting.autonomous_hunter import validate_state; validate_state(json.load(open('value_proof/out/hunter_state.json')))"
          python -c "import json; from model_router.feedback_state import validate_state; validate_state(json.load(open('value_proof/out/model_feedback_state.json')))"
          python -c "import json; from learning.live_observations import validate_state; validate_state(json.load(open('value_proof/out/learning_observation_state.json')))"

      - name: Commit conservative value-proof job usage
        if: ${{ always() && steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m cost_governor.workflow_gate finalize
          --state cost_governor/out/cost_state.json
          --decision cost_governor/out/cost_decision.json
          --output cost_governor/out/cost_state.json

      - name: Upload model value proof receipts
        if: ${{ always() && steps.cost.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-model-value-proof
          path: value_proof/out/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload learned Hunter continuation state
        if: ${{ always() && steps.cost.outputs.allowed == 'true' && hashFiles('value_proof/out/hunter_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hunter-state
          path: value_proof/out/hunter_state.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload learned model feedback state
        if: ${{ always() && steps.cost.outputs.allowed == 'true' && hashFiles('value_proof/out/model_feedback_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-model-feedback-state
          path: value_proof/out/model_feedback_state.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload learned continuous-learning observations
        if: ${{ always() && steps.cost.outputs.allowed == 'true' && hashFiles('value_proof/out/learning_observation_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-learning-observation-state
          path: value_proof/out/learning_observation_state.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized cost-governor continuation state
        if: ${{ always() && hashFiles('cost_governor/out/cost_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cost-governor-state
          path: cost_governor/out/
          if-no-files-found: error
          retention-days: 30

      - name: Report governed no-work outcome
        if: ${{ always() && steps.cost.outputs.allowed != 'true' }}
        run: |
          echo "::error title=Model value proof blocked::Cost governor status: ${{ steps.cost.outputs.decision_status }}"
          exit 1
