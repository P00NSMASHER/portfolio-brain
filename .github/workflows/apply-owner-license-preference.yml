name: Apply owner license preference
on:
  push:
    branches: [license-advisory-20260928]
    paths:
      - operations/apply_owner_license_preference.py
      - .github/workflows/apply-owner-license-preference.yml
permissions:
  contents: write
concurrency:
  group: owner-license-advisory-migration
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/license-advisory-20260928' && github.event.head_commit.message == 'Prepare owner-requested license advisory change'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the owner-requested source changes
        run: |
          git merge-base --is-ancestor 82101ac8ce4589e2f1f1de208297e52caa3f17ea HEAD
          python operations/apply_owner_license_preference.py
          git rm operations/apply_owner_license_preference.py .github/workflows/apply-owner-license-preference.yml
          git add README.md .github/workflows/foundation-ci.yml hunting challenger transfer experiments tests
          git diff --cached --check
      - name: Validate actual candidate tree
        run: |
          python -m hunting.validate_license_admission
          python -m hunting.validate_hunter
          python -m experiments.validate_experiments
          python -m transfer.validate_transfer
          python -m challenger.validate_challenger
          python -m dashboard.validate_command_center
          python -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
      - name: Commit to the isolated request branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make Brain license checks advisory under explicit owner assumption'
          git push origin HEAD:refs/heads/license-advisory-20260928
          git rev-parse HEAD
