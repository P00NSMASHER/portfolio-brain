name: v8-scoped-repair-proposal

# Existing automatic Brain core is the only trigger. No new cron or PR secret path.
on:
  workflow_run:
    workflows: ["brain-cycle-v2"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: v8-capturebrief-source-bound-intent
  cancel-in-progress: false

jobs:
  propose-only:
    if: >-
      ${{ github.repository == 'P00NSMASHER/portfolio-brain' && github.event.workflow_run.repository.full_name == 'P00NSMASHER/portfolio-brain' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact protected current main, without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin independently reviewed core admission and scoped repair code
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object brain/v8/repair_core_origin.py)" = "0caf91b20aaad741f27f361f2963d5818d053aab"
          test "$(git hash-object brain/v8/repair_runtime.py)" = "a537388a556c2c5160850694525691acc1f9fae7"
          test "$(git hash-object brain/v8/target_readiness.py)" = "945224ab56b06921737dfb9a251e868076598da2"
          install -m 0500 brain/v8/repair_core_origin.py "$RUNNER_TEMP/v8-origin.py"
          install -m 0500 brain/v8/repair_runtime.py "$RUNNER_TEMP/v8-repair.py"
          install -m 0500 brain/v8/target_readiness.py "$RUNNER_TEMP/v8-target-source.py"
      - name: Authenticate original current-source automatic core before token mint
        env:
          GH_TOKEN: ${{ github.token }}
          BRAIN_RUN_ID: ${{ github.event.workflow_run.id }}
          BRAIN_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python -I "$RUNNER_TEMP/v8-origin.py"

      - name: Evaluate project-scoped candidate authority before token mint
        id: authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from governance.validate_boundaries import candidate_pr_authority
          from brain.v8.target_readiness import EXPECTED_TARGET_HEAD

          receipt=candidate_pr_authority(
              "PRJ-004",
              "REPO-007",
              "v8-capturebrief-hosting-doc-" + EXPECTED_TARGET_HEAD[:12],
          )
          output=Path(os.environ["RUNNER_TEMP"])/"v8-authority.json"
          output.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as handle:
              handle.write("allowed="+str(receipt["token_mint_allowed"]).lower()+"\n")
          print("V8_AUTHORITY:",receipt["reason"],"token_mint_allowed:",receipt["token_mint_allowed"])
          PY
      - name: Read protected CaptureBrief source before requesting a writer token
        id: target-source
        if: ${{ steps.authority.outputs.allowed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I "$RUNNER_TEMP/v8-target-source.py"
      - name: Mint one-CaptureBrief-repository short-lived draft-only contents token
        if: ${{ steps.authority.outputs.allowed == 'true' && steps.target-source.outputs.ready == 'true' }}
        id: runtime
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: '5352505'
          private-key: ${{ secrets.PORTFOLIO_RUNTIME_PRIVATE_KEY }}
          owner: P00NSMASHER
          repositories: capturebrief
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false
      - name: Reobserve canonical docs and create ONLY source-bound draft PR
        if: ${{ steps.authority.outputs.allowed == 'true' && steps.target-source.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ steps.runtime.outputs.token }}
          INSTALLATION_ID: ${{ steps.runtime.outputs.installation-id }}
          APP_SLUG: ${{ steps.runtime.outputs.app-slug }}
        run: python -I "$RUNNER_TEMP/v8-repair.py"
      - name: Preserve non-secret provider and repair reconciliation receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v8-source-bound-repair-${{ github.event.workflow_run.id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v8-origin.json
            ${{ runner.temp }}/v8-authority.json
            ${{ runner.temp }}/v8-target-preflight.json
            ${{ runner.temp }}/v8-capturebrief-repair.json
          if-no-files-found: warn
          retention-days: 30

  verified-results-after-core:
    # Existing successful genuine Brain cycles are the trigger. This read-only
    # job is separate from the CaptureBrief draft-only runtime credential.
    if: >-
      ${{
        github.repository == 'P00NSMASHER/portfolio-brain' &&
        github.event.workflow_run.repository.full_name == 'P00NSMASHER/portfolio-brain' &&
        github.event.workflow_run.name == 'brain-cycle-v2' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        (github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      deployments: read
    steps:
      - name: Checkout immutable trusted source with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile actual GitHub engineering outcomes after completed core
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/brain-v11-core
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m brain.v11.results_dashboard \
            --expected-main "${{ github.sha }}" \
            --json /tmp/brain-v11-core/results.json \
            --html /tmp/brain-v11-core/results.html
          test -s /tmp/brain-v11-core/results.json
          test -s /tmp/brain-v11-core/results.html
      - name: Archive newest source-bound engineering results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brain-v11-core-results-${{ github.event.workflow_run.id }}-${{ github.run_id }}
          path: /tmp/brain-v11-core/
          if-no-files-found: error
          retention-days: 3

  classify-original-failed-core:
    # Completed original failures only, never untrusted candidate PR source.
    # This cannot create PRs, merge code or mint runtime credentials.
    if: >-
      ${{
        github.repository == 'P00NSMASHER/portfolio-brain' &&
        github.event.workflow_run.repository.full_name == 'P00NSMASHER/portfolio-brain' &&
        github.event.workflow_run.name == 'brain-cycle-v2' &&
        (github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.conclusion == 'timed_out') &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        (github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout immutable trusted source with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independently authenticate original failed core without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_MAIN: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          mkdir -p /tmp/brain-v11-failure
          python -m brain.v11.failure_triage --source-sha "$EXPECTED_MAIN" --run-id "$ORIGINAL_RUN_ID" --output /tmp/brain-v11-failure/receipt.json
      - name: Match one preapproved exact-source repair recipe before requesting any token
        id: recipe
        run: |
          set -euo pipefail
          python -m brain.v11.approved_recipe_runner \
            --receipt /tmp/brain-v11-failure/receipt.json \
            --registry repair/V11_PREAPPROVED_SOURCE_RECIPES.json \
            --workspace . \
            --spec /tmp/brain-v11-failure/approved-spec.json \
            --decision /tmp/brain-v11-failure/recipe-decision.json \
            --reviewed-test /tmp/brain-v11-failure/approved-reviewed-test.json
          if test -s /tmp/brain-v11-failure/approved-spec.json; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint one-repository short-lived repair token only for an exact reviewed recipe
        id: repair-token
        if: ${{ steps.recipe.outputs.eligible == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: '5352505'
          private-key: ${{ secrets.PORTFOLIO_RUNTIME_PRIVATE_KEY }}
          owner: P00NSMASHER
          repositories: portfolio-brain
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          skip-token-revoke: false
      - name: Prove original RED and candidate GREEN offline before creating draft PR
        if: ${{ steps.recipe.outputs.eligible == 'true' }}
        env:
          PORTFOLIO_RUNTIME_TOKEN: ${{ steps.repair-token.outputs.token }}
        run: |
          set -euo pipefail
          python -m brain.v10 \
            --spec /tmp/brain-v11-failure/approved-spec.json \
            --workspace . \
            --receipt /tmp/brain-v11-failure/v10-redgreen.json \
            --reviewed-test /tmp/brain-v11-failure/approved-reviewed-test.json \
            --publish --intent /tmp/brain-v11-failure/external-write-intent.json
      - name: Preserve original failure evidence without secrets or false repair claims
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brain-v11-original-failure-${{ github.event.workflow_run.id }}-${{ github.run_id }}
          path: /tmp/brain-v11-failure/
          if-no-files-found: error
          retention-days: 7
