name: runtime-event-observe

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "runtime/TRIGGER_DAILY_REASONING"
      - ".github/triggers/hunter-autonomous-now.txt"
      - ".github/workflows/hunter-autonomous-cycle.yml"
      - "value_proof/TRIGGER_END_TO_END_PROOF"
      - "value_proof/TRIGGER_VERIFIED_FEEDBACK_BOOTSTRAP"
      - "learning/TRIGGER_VERIFIED_OUTCOME_BOOTSTRAP"
      - ".github/workflows/model-value-proof.yml"
      - ".github/workflows/verified-feedback-bootstrap.yml"
      - ".github/workflows/continuous-learning-bootstrap.yml"
      - ".github/triggers/scheduler-now.txt"
      - ".github/workflows/portfolio-autonomous-scheduler.yml"
      - "dashboard/**"
      - "tests/**"
      - "operator_console/**"
      - "cost_governor/**"
      - "operations/COMMAND_CENTER_REFRESH_REQUEST.json"
      - "operations/TRIGGER_WORKFLOW_LIVENESS"
      - ".github/workflows/portfolio-cost-watchdog.yml"
      - ".github/workflows/command-center-pages.yml"
      - ".github/workflows/foundation-ci.yml"
      - ".github/workflows/runtime-event-observe.yml"
  repository_dispatch:
    types: ["portfolio_observe"]
  workflow_dispatch:
    inputs:
      repository_id:
        description: "Registered repository id to observe"
        required: false
        default: "REPO-008"

permissions:
  contents: read
  actions: read

jobs:
  observe:
    concurrency:
      group: runtime-event-observe-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: observe
      target_repository_id: ${{ github.event.client_payload.repository_id || inputs.repository_id || 'REPO-008' }}
