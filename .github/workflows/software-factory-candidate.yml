name: software-factory-candidate

on:
  workflow_call:
    inputs:
      packet_path:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: portfolio-software-factory
  cancel-in-progress: false
  queue: max

jobs:
  execute-candidate-action:
    # Serialize the complete restore -> mutate -> upload transaction.
    concurrency:
      group: portfolio-state-writer-v1
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_FACTORY_PACKET: ${{ inputs.packet_path }}
      PORTFOLIO_FACTORY_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check independent workload controls
        id: workload
        run: >-
          python -m workload_control.workload_gate preflight
          --workflow-id software-factory-candidate
          --job-id execute-candidate-action
          --estimated-minutes 5
      - name: Restore latest agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m agents.artifact_state --output agents/live/agent_heartbeat_state.json
      - name: Execute bounded candidate action
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m software_factory.github_executor
      - name: Heartbeat Engineer
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m agents.heartbeat_state
          --state agents/live/agent_heartbeat_state.json
          --output agents/out/agent_heartbeat_state.json
          --agent-id AGT-ENGINEER
          --activity-kind SOFTWARE_FACTORY_ACTION
          --source-workflow software-factory-candidate
          --source-run-id "${GITHUB_RUN_ID}"
      - name: Upload sanitized agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        id: journal_upload_heartbeat
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agent-heartbeat-state
          path: agents/out/agent_heartbeat_state.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when workload admission blocks
        if: ${{ always() && steps.workload.outputs.allowed != 'true' }}
        run: exit 3
      - name: Capture immutable state transition event
        id: journal_event
        if: ${{ always() && vars.PORTFOLIO_STATE_JOURNAL_ENABLED == 'true' }}
        env:
          JOURNAL_PUBLISHED_DOMAINS: >-
            {"heartbeat": ${{ steps.journal_upload_heartbeat.outcome == 'success' }}}
        run: python -m state_journal.emitter --producer software-factory-candidate
      - name: Upload immutable state transition event
        if: ${{ always() && steps.journal_event.outputs.emitted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-event-v2-${{ github.run_id }}-software-factory-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: state_journal/out/event/event.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
