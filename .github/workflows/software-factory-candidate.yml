name: software-factory-candidate

on:
  workflow_call:
    inputs:
      packet_path:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: portfolio-state-writer-v1
  cancel-in-progress: false
  queue: max

jobs:
  execute-candidate-action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_FACTORY_PACKET: ${{ inputs.packet_path }}
      PORTFOLIO_FACTORY_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check independent workload controls
        id: workload
        run: >-
          python -m workload_control.workload_gate preflight
          --workflow-id software-factory-candidate
          --job-id execute-candidate-action
          --estimated-minutes 5
      - name: Restore latest agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m agents.artifact_state --output agents/live/agent_heartbeat_state.json
      - name: Execute bounded candidate action
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m software_factory.github_executor
      - name: Heartbeat Engineer
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m agents.heartbeat_state
          --state agents/live/agent_heartbeat_state.json
          --output agents/out/agent_heartbeat_state.json
          --agent-id AGT-ENGINEER
          --activity-kind SOFTWARE_FACTORY_ACTION
          --source-workflow software-factory-candidate
          --source-run-id "${GITHUB_RUN_ID}"
      - name: Upload sanitized agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agent-heartbeat-state
          path: agents/out/agent_heartbeat_state.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when workload admission blocks
        if: ${{ always() && steps.workload.outputs.allowed != 'true' }}
        run: exit 3
