name: runtime-worker

on:
  workflow_call:
    secrets:
      portfolio_model_api_key:
        required: false
    inputs:
      mode:
        required: true
        type: string
      target_repository_id:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-cost-governed-autonomy
  cancel-in-progress: false

jobs:
  runtime:
    if: ${{ vars.PORTFOLIO_RUNTIME_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_RUNTIME_DISABLED: ${{ vars.PORTFOLIO_RUNTIME_DISABLED }}
      PORTFOLIO_SPEND_DISABLED: ${{ vars.PORTFOLIO_SPEND_DISABLED }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RUNTIME_MODE: ${{ inputs.mode }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      PORTFOLIO_MODEL_API_KEY: ${{ secrets.portfolio_model_api_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest cost-governor state
        run: python -m cost_governor.artifact_state --output cost_governor/live/cost_state.json
      - name: Reserve bounded runtime compute
        id: cost
        run: >-
          python -m cost_governor.workflow_gate preflight
          --state cost_governor/live/cost_state.json
          --output-dir cost_governor/out
          --workflow-id runtime-worker
          --job-id runtime
          --project-id PRJ-000
          --estimated-minutes 5
          --authority OBSERVE
      - name: Restore latest runtime state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -m runtime.artifact_state --output runtime/live/runtime_state.json
      - name: Restore latest agent heartbeat state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -m agents.artifact_state --output agents/live/agent_heartbeat_state.json
      - name: Execute deterministic runtime cycle
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m runtime.continuous_runtime
          --mode "$RUNTIME_MODE"
          --state-path runtime/live/runtime_state.json
          --output-dir runtime/out
          ${TARGET_REPOSITORY_ID:+--target-repository-id "$TARGET_REPOSITORY_ID"}
      - name: Heartbeat Data Steward
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m agents.heartbeat_state
          --state agents/live/agent_heartbeat_state.json
          --output agents/out/agent_heartbeat_state.json
          --agent-id AGT-DATA-STEWARD
          --activity-kind RUNTIME_OBSERVATION
          --source-workflow runtime-worker
          --source-run-id "${GITHUB_RUN_ID}"
      - name: Run governed model-assisted analysis
        if: ${{ steps.cost.outputs.allowed == 'true' && (inputs.mode == 'daily' || inputs.mode == 'weekly') }}
        run: >-
          python -m runtime.model_analysis
          --mode "$RUNTIME_MODE"
          --runtime-out runtime/out
          --cost-state cost_governor/out/cost_state.json
          --output-dir runtime/out
      - name: Validate emitted runtime state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -c "import json; from runtime.state import validate_state; validate_state(json.load(open('runtime/out/runtime_state.json')))"
      - name: Commit conservative runtime compute usage
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m cost_governor.workflow_gate finalize
          --state cost_governor/out/cost_state.json
          --decision cost_governor/out/cost_decision.json
          --output cost_governor/out/cost_state.json
      - name: Upload sanitized runtime continuation state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-runtime-state
          path: runtime/out/
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized agent heartbeat state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agent-heartbeat-state
          path: agents/out/agent_heartbeat_state.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized cost-governor continuation state
        if: ${{ always() && hashFiles('cost_governor/out/cost_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cost-governor-state
          path: cost_governor/out/
          if-no-files-found: error
          retention-days: 30
      - name: Report governed no-work outcome
        if: ${{ always() && steps.cost.outputs.allowed != 'true' }}
        run: |
          echo "::notice title=Portfolio runtime skipped::Cost governor status: ${{ steps.cost.outputs.decision_status }}"
          echo "Runtime work was skipped because the cost governor did not grant a reservation." >> "$GITHUB_STEP_SUMMARY"
