name: runtime-worker

on:
  workflow_call:
    secrets:
      portfolio_model_api_key:
        required: false
    inputs:
      mode:
        required: true
        type: string
      target_repository_id:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ (inputs.mode == 'daily' || inputs.mode == 'weekly') && 'portfolio-cost-governed-autonomy' || format('portfolio-runtime-{0}', inputs.mode) }}
  cancel-in-progress: false
  queue: max

jobs:
  runtime:
    if: ${{ vars.PORTFOLIO_RUNTIME_DISABLED != 'true' }}
    # Every mode persists the same runtime state. Serialize its full transaction
    # while retaining the separate workflow-level paid-admission lock above.
    concurrency:
      group: portfolio-state-writer-v1
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_RUNTIME_DISABLED: ${{ vars.PORTFOLIO_RUNTIME_DISABLED }}
      PORTFOLIO_SPEND_DISABLED: ${{ vars.PORTFOLIO_SPEND_DISABLED }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RUNTIME_MODE: ${{ inputs.mode }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      PORTFOLIO_MODEL_API_KEY: ${{ secrets.portfolio_model_api_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check non-paid runtime workload controls
        id: workload
        if: ${{ inputs.mode == 'observe' || inputs.mode == 'sync' }}
        run: >-
          python -m workload_control.workload_gate preflight
          --workflow-id runtime-worker
          --job-id "runtime-${RUNTIME_MODE}"
          --estimated-minutes 5

      - name: Restore canonical cost-governor state
        if: ${{ inputs.mode == 'daily' || inputs.mode == 'weekly' }}
        run: python -m state_journal.production_reader --domain cost --output cost_governor/live/cost_state.json

      - name: Reserve bounded paid runtime compute
        id: cost
        if: ${{ inputs.mode == 'daily' || inputs.mode == 'weekly' }}
        run: >-
          python -m cost_governor.workflow_gate preflight
          --state cost_governor/live/cost_state.json
          --output-dir cost_governor/out
          --workflow-id runtime-worker
          --job-id "runtime-${RUNTIME_MODE}"
          --project-id PRJ-000
          --estimated-minutes 5
          --authority OBSERVE

      - name: Resolve runtime admission
        id: admission
        shell: bash
        run: |
          if [[ "$RUNTIME_MODE" == "observe" || "$RUNTIME_MODE" == "sync" ]]; then
            echo "allowed=${{ steps.workload.outputs.allowed }}" >> "$GITHUB_OUTPUT"
            echo "decision_status=${{ steps.workload.outputs.decision_status }}" >> "$GITHUB_OUTPUT"
            echo "admission_domain=WORKLOAD" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNTIME_MODE" == "daily" || "$RUNTIME_MODE" == "weekly" ]]; then
            echo "allowed=${{ steps.cost.outputs.allowed }}" >> "$GITHUB_OUTPUT"
            echo "decision_status=${{ steps.cost.outputs.decision_status }}" >> "$GITHUB_OUTPUT"
            echo "admission_domain=COST_WRAPPER" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "decision_status=UNSUPPORTED_RUNTIME_MODE" >> "$GITHUB_OUTPUT"
            echo "admission_domain=NONE" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject stale queued main observation
        if: ${{ steps.admission.outputs.allowed == 'true' && inputs.mode == 'observe' && inputs.target_repository_id == 'REPO-008' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/P00NSMASHER/portfolio-brain/branches/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "portfolio-runtime-stale-main-guard/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response)["commit"]["sha"]
          if current != os.environ["GITHUB_SHA"]:
              raise SystemExit(
                  "STALE_MAIN_OBSERVATION: queued source "
                  + os.environ["GITHUB_SHA"]
                  + " is no longer current main "
                  + current
              )
          PY

      - name: Restore canonical runtime state
        if: ${{ steps.admission.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain runtime --output runtime/live/runtime_state.json

      - name: Restore durable project forwarding state
        if: ${{ steps.admission.outputs.allowed == 'true' }}
        run: >-
          python -m runtime.forwarding_artifact_state
          --output runtime/live/project_forwarding_state.json
          --metadata-output runtime/out/project_forwarding_restore.json

      - name: Restore provider-health observability only
        if: ${{ steps.admission.outputs.allowed == 'true' }}
        run: >-
          python -m runtime.artifact_state
          --output runtime/out/non_authoritative_runtime_restore.json
          --provider-health-output runtime/out/provider_health.json

      - name: Restore canonical agent heartbeat state
        if: ${{ steps.admission.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain heartbeat --output agents/live/agent_heartbeat_state.json

      - name: Restore canonical model feedback state
        if: ${{ steps.admission.outputs.allowed == 'true' && (inputs.mode == 'daily' || inputs.mode == 'weekly') }}
        run: python -m state_journal.production_reader --domain model_feedback --output model_router/live/model_feedback_state.json

      - name: Restore canonical learning observations
        if: ${{ steps.admission.outputs.allowed == 'true' && (inputs.mode == 'daily' || inputs.mode == 'weekly') }}
        run: python -m state_journal.production_reader --domain learning --output learning/live/learning_observation_state.json

      - name: Execute deterministic runtime cycle
        if: ${{ steps.admission.outputs.allowed == 'true' }}
        run: >-
          python -m runtime.continuous_runtime
          --mode "$RUNTIME_MODE"
          --state-path runtime/live/runtime_state.json
          --output-dir runtime/out
          ${TARGET_REPOSITORY_ID:+--target-repository-id "$TARGET_REPOSITORY_ID"}

      - name: Observe constrained ABVM automation health and progress
        if: ${{ steps.admission.outputs.allowed == 'true' && (inputs.mode == 'sync' || (inputs.mode == 'observe' && inputs.target_repository_id == 'REPO-003')) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m adapters.abvm_health --output runtime/out/abvm_health_progress_evidence.json

      - name: Heartbeat Data Steward
        if: ${{ steps.admission.outputs.allowed == 'true' }}
        run: >-
          python -m agents.heartbeat_state
          --state agents/live/agent_heartbeat_state.json
          --output agents/out/agent_heartbeat_state.json
          --agent-id AGT-DATA-STEWARD
          --activity-kind RUNTIME_OBSERVATION
          --source-workflow runtime-worker
          --source-run-id "${GITHUB_RUN_ID}"

      - name: Run governed model-assisted analysis
        if: ${{ steps.admission.outputs.allowed == 'true' && (inputs.mode == 'daily' || inputs.mode == 'weekly') }}
        run: >-
          python -m runtime.model_analysis
          --mode "$RUNTIME_MODE"
          --runtime-out runtime/out
          --cost-state cost_governor/out/cost_state.json
          --output-dir runtime/out

      - name: Validate emitted runtime state
        if: ${{ steps.admission.outputs.allowed == 'true' }}
        run: python -c "import json; from runtime.state import validate_state; validate_state(json.load(open('runtime/out/runtime_state.json')))"

      - name: Commit conservative paid runtime compute usage
        if: ${{ always() && steps.cost.outputs.allowed == 'true' && (inputs.mode == 'daily' || inputs.mode == 'weekly') }}
        run: >-
          python -m cost_governor.workflow_gate finalize
          --state cost_governor/out/cost_state.json
          --decision cost_governor/out/cost_decision.json
          --output cost_governor/out/cost_state.json

      - name: Upload sanitized runtime continuation state
        if: ${{ steps.admission.outputs.allowed == 'true' }}
        id: journal_upload_runtime
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-runtime-state
          path: runtime/out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload durable project forwarding state
        if: ${{ steps.admission.outputs.allowed == 'true' && hashFiles('runtime/out/project_forwarding_state.json') != '' }}
        id: journal_upload_project_forwarding
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-project-forwarding-state
          path: runtime/out/project_forwarding_state.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized agent heartbeat state
        if: ${{ steps.admission.outputs.allowed == 'true' }}
        id: journal_upload_heartbeat
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agent-heartbeat-state
          path: agents/out/agent_heartbeat_state.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized cost-governor continuation state
        if: ${{ always() && (inputs.mode == 'daily' || inputs.mode == 'weekly') && hashFiles('cost_governor/out/cost_state.json') != '' }}
        id: journal_upload_cost
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cost-governor-state
          path: cost_governor/out/
          if-no-files-found: error
          retention-days: 30

      - name: Report governed no-work outcome
        if: ${{ always() && steps.admission.outputs.allowed != 'true' }}
        run: |
          echo "::error title=Portfolio runtime blocked::Admission domain: ${{ steps.admission.outputs.admission_domain }}; status: ${{ steps.admission.outputs.decision_status }}"
          echo "Runtime work did not execute because its mode-specific admission gate blocked." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Capture immutable state transition event
        id: journal_event
        if: ${{ always() }}
        env:
          JOURNAL_PUBLISHED_DOMAINS: >-
            {"cost": ${{ steps.journal_upload_cost.outcome == 'success' }}, "heartbeat": ${{ steps.journal_upload_heartbeat.outcome == 'success' }}, "runtime": ${{ steps.journal_upload_runtime.outcome == 'success' }}}
        run: python -m state_journal.emitter --producer runtime-worker
      - name: Upload immutable state transition event
        if: ${{ always() && steps.journal_event.outputs.emitted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-event-v2-${{ github.run_id }}-runtime-worker-${{ github.sha }}-${{ github.run_attempt }}
          path: state_journal/out/event/event.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30