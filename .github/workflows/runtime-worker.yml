name: runtime-worker

on:
  workflow_call:
    secrets:
      portfolio_model_api_key:
        required: false
    inputs:
      mode:
        required: true
        type: string
      target_repository_id:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ (inputs.mode == 'daily' || inputs.mode == 'weekly') && 'portfolio-paid-cost-ledger' || format('portfolio-runtime-{0}', inputs.mode) }}
  cancel-in-progress: false

jobs:
  runtime:
    if: ${{ vars.PORTFOLIO_RUNTIME_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_RUNTIME_DISABLED: ${{ vars.PORTFOLIO_RUNTIME_DISABLED }}
      PORTFOLIO_SPEND_DISABLED: ${{ vars.PORTFOLIO_SPEND_DISABLED }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RUNTIME_MODE: ${{ inputs.mode }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      PORTFOLIO_MODEL_API_KEY: ${{ secrets.portfolio_model_api_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest cost-governor state
        run: |
          mkdir -p cost_governor/out
          python -m cost_governor.artifact_state --output cost_governor/live/cost_state.json
          cp cost_governor/live/cost_state.json cost_governor/out/cost_state.json
      - name: Restore latest runtime state
        run: >-
          python -m runtime.artifact_state
          --output runtime/live/runtime_state.json
          --provider-health-output runtime/out/provider_health.json
      - name: Restore latest agent heartbeat state
        run: python -m agents.artifact_state --output agents/live/agent_heartbeat_state.json
      - name: Restore verified model feedback state
        if: ${{ (inputs.mode == 'daily' || inputs.mode == 'weekly') }}
        run: |
          mkdir -p model_router/live
          python -m model_router.feedback_artifact_state --output model_router/live/model_feedback_state.json
          if [ ! -f model_router/live/model_feedback_state.json ]; then
            cp model_router/MODEL_FEEDBACK_STATE_SEED.json model_router/live/model_feedback_state.json
          fi
      - name: Restore durable learning observations
        if: ${{ (inputs.mode == 'daily' || inputs.mode == 'weekly') }}
        run: |
          mkdir -p learning/live
          python -m learning.artifact_state --output learning/live/learning_observation_state.json
          if [ ! -f learning/live/learning_observation_state.json ]; then
            cp learning/LIVE_OBSERVATION_STATE_SEED.json learning/live/learning_observation_state.json
          fi
      - name: Execute deterministic runtime cycle
        run: >-
          python -m runtime.continuous_runtime
          --mode "$RUNTIME_MODE"
          --state-path runtime/live/runtime_state.json
          --output-dir runtime/out
          ${TARGET_REPOSITORY_ID:+--target-repository-id "$TARGET_REPOSITORY_ID"}
      - name: Heartbeat Data Steward
        run: >-
          python -m agents.heartbeat_state
          --state agents/live/agent_heartbeat_state.json
          --output agents/out/agent_heartbeat_state.json
          --agent-id AGT-DATA-STEWARD
          --activity-kind RUNTIME_OBSERVATION
          --source-workflow runtime-worker
          --source-run-id "${GITHUB_RUN_ID}"
      - name: Run governed model-assisted analysis
        if: ${{ (inputs.mode == 'daily' || inputs.mode == 'weekly') }}
        run: >-
          python -m runtime.model_analysis
          --mode "$RUNTIME_MODE"
          --runtime-out runtime/out
          --cost-state cost_governor/out/cost_state.json
          --output-dir runtime/out
      - name: Validate emitted runtime state
        run: python -c "import json; from runtime.state import validate_state; validate_state(json.load(open('runtime/out/runtime_state.json')))"
      - name: Upload sanitized runtime continuation state
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-runtime-state
          path: runtime/out/
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized agent heartbeat state
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agent-heartbeat-state
          path: agents/out/agent_heartbeat_state.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized cost-governor continuation state
        if: ${{ always() && (inputs.mode == 'daily' || inputs.mode == 'weekly') && hashFiles('cost_governor/out/cost_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cost-governor-state
          path: cost_governor/out/
          if-no-files-found: error
          retention-days: 30