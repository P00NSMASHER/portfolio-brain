name: portfolio-state-checkpoint-candidate

on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "state_journal/TRIGGER_CHECKPOINT_ARCHIVE"
  workflow_run:
    workflows:
      - portfolio-state-reducer
      - command-center-pages
      - foundation-ci
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-state-checkpoint-candidate
  cancel-in-progress: false

jobs:
  checkpoint:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.name == 'portfolio-state-reducer' &&
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download triggering reducer blocking receipt
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: portfolio-state-reducer-receipt-${{ github.event.workflow_run.id }}-*
          path: state_journal/out/triggering-reducer
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Classify checkpoint trigger
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = os.environ["EVENT_NAME"] != "workflow_run"
          force = False
          if not required:
              expected_reason = "Journal capacity exceeded; do not drop evidence"
              receipts = sorted(Path("state_journal/out/triggering-reducer").rglob("receipt.json"))
              for path in receipts:
                  try:
                      receipt = json.loads(path.read_text())
                  except (OSError, json.JSONDecodeError):
                      continue
                  if (
                      receipt.get("status") == "BLOCKED"
                      and receipt.get("reason_type") == "JournalError"
                      and receipt.get("reason") == expected_reason
                  ):
                      required = True
                      force = True
                      break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checkpoint_required={'true' if required else 'false'}\n")
              output.write(f"checkpoint_force={'true' if force else 'false'}\n")
          PY

      - name: Detect existing checkpoint recovery candidate
        if: ${{ steps.trigger.outputs.checkpoint_required == 'true' }}
        id: incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          raw = subprocess.check_output(
              ["gh", "pr", "list", "--state", "open", "--limit", "100", "--json", "number,headRefName,headRefOid"],
              text=True,
              env=os.environ,
          )
          matches = [
              row for row in json.loads(raw)
              if str(row.get("headRefName", "")).startswith("factory/checkpoint-archive-")
          ]
          if len(matches) > 1:
              raise SystemExit(f"multiple open checkpoint recovery candidates: {len(matches)}")
          active = False
          if matches:
              candidate = matches[0]
              main_sha = subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/branches/main", "--jq", ".commit.sha"],
                  text=True,
                  env=os.environ,
              ).strip()
              compare = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/compare/{main_sha}...{candidate['headRefOid']}"],
                  text=True,
                  env=os.environ,
              ))
              if compare.get("merge_base_commit", {}).get("sha") != main_sha:
                  subprocess.check_call(
                      ["gh", "pr", "close", str(candidate["number"])],
                      env=os.environ,
                  )
                  print("stale_retired=true")
              else:
                  active = True
                  print("pr_number=" + str(candidate["number"]))
                  print("branch=" + candidate["headRefName"])
                  print("head_sha=" + candidate["headRefOid"])
          print("active=" + ("true" if active else "false"))
          PY
      - name: Generate validated checkpoint/archive candidate
        if: ${{ steps.trigger.outputs.checkpoint_required == 'true' && steps.incident.outputs.active != 'true' }}
        id: generate
        env:
          CHECKPOINT_FORCE: ${{ steps.trigger.outputs.checkpoint_force }}
        run: |
          set -euo pipefail
          if [ "$CHECKPOINT_FORCE" = "true" ]; then
            python -m state_journal.checkpoint_archive --force --output state_journal/out/checkpoint_archive_receipt.json
          else
            python -m state_journal.checkpoint_archive --output state_journal/out/checkpoint_archive_receipt.json
          fi
          if git diff --quiet -- state_journal; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open protected checkpoint archive pull request
        if: ${{ steps.generate.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="factory/checkpoint-archive-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add state_journal/ARCHIVE_MANIFEST.json                   state_journal/CHECKPOINT.json.gz                   state_journal/POLICY.json                   state_journal/archive/
          git commit -m "Archive canonical journal checkpoint"
          git push origin "$BRANCH"
          SEQUENCE="$(python - <<'PY'
          import json
          print(json.load(open("state_journal/ARCHIVE_MANIFEST.json"))["archived_sequence"])
          PY
          )"
          gh pr create             --base main             --head "$BRANCH"             --title "Archive canonical journal checkpoint sequence ${SEQUENCE}"             --body "Automated durable checkpoint/archive candidate. The full canonical snapshot and immutable lineage manifest are committed to protected Git history; CHECKPOINT.json.gz contains the exact archived projection. Merge only through required Foundation + portfolio-phase1-gate checks."
          echo "Checkpoint PR opened; trusted verification is dispatched by the finalizer."

      - name: Resolve and validate active checkpoint candidate
        if: ${{ steps.trigger.outputs.checkpoint_required == 'true' }}
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          pulls = json.loads(subprocess.check_output([
              "gh","pr","list","--state","open","--limit","100",
              "--json","number,headRefName,headRefOid,baseRefName,body"
          ], text=True, env=os.environ))
          matches = [p for p in pulls if str(p.get("headRefName","")).startswith("factory/checkpoint-archive-")]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one open checkpoint candidate, found {len(matches)}")
          pr = matches[0]
          if pr.get("baseRefName") != "main":
              raise SystemExit("checkpoint candidate base is not main")
          pr_detail = json.loads(subprocess.check_output([
              "gh","api",f"repos/{repo}/pulls/{pr['number']}"
          ], text=True, env=os.environ))
          if (pr_detail.get("user") or {}).get("login") != "github-actions[bot]":
              raise SystemExit("checkpoint candidate is not bot-authored")
          body = pr.get("body") or ""
          if not body.startswith("Automated durable checkpoint/archive candidate."):
              raise SystemExit("checkpoint candidate body marker missing")
          files = json.loads(subprocess.check_output([
              "gh","api",f"repos/{repo}/pulls/{pr['number']}/files","-f","per_page=100","--method","GET"
          ], text=True, env=os.environ))
          if not files or len(files) >= 100:
              raise SystemExit("checkpoint candidate file listing missing or exceeded bound")
          exact = {
              "state_journal/ARCHIVE_MANIFEST.json",
              "state_journal/CHECKPOINT.json.gz",
              "state_journal/POLICY.json",
          }
          for row in files:
              path = row.get("filename","")
              status = row.get("status")
              archive = path.startswith("state_journal/archive/") and (
                  path.endswith(".json.gz") or path.endswith(".manifest.json")
              )
              if status not in {"added","modified"} or not (path in exact or archive):
                  raise SystemExit("checkpoint candidate escaped protected path allowlist: " + path)
          print("pr_number=" + str(pr["number"]))
          print("branch=" + pr["headRefName"])
          print("head_sha=" + pr["headRefOid"])
          PY

      - name: Dispatch Foundation verification when needed
        if: ${{ steps.trigger.outputs.checkpoint_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_BRANCH: ${{ steps.candidate.outputs.branch }}
          CHECKPOINT_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          NEEDS="$(python - <<'PY'
          import json, os, subprocess
          rows=json.loads(subprocess.check_output([
              "gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['CHECKPOINT_SHA']}/check-runs"
          ], text=True, env=os.environ)).get("check_runs", [])
          trusted=[r for r in rows if r.get("name")=="validate" and r.get("app",{}).get("id")==15368]
          trusted.sort(key=lambda r:r.get("id",0))
          latest=trusted[-1] if trusted else None
          print("false" if latest and (latest.get("status")!="completed" or latest.get("conclusion")=="success") else "true")
          PY
          )"
          if [ "$NEEDS" = "true" ]; then
            gh workflow run foundation-ci.yml --ref "$CHECKPOINT_BRANCH"
          fi

      - name: Wait for trusted exact-head verification
        if: ${{ steps.trigger.outputs.checkpoint_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            RESULT="$(python - <<'PY'
          import json, os, subprocess
          rows=json.loads(subprocess.check_output([
              "gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['CHECKPOINT_SHA']}/check-runs"
          ], text=True, env=os.environ)).get("check_runs", [])
          def latest(name, app_id):
              found=[r for r in rows if r.get("name")==name and r.get("app",{}).get("id")==app_id]
              found.sort(key=lambda r:r.get("id",0))
              return found[-1] if found else None
          foundation=latest("validate",15368)
          independent=latest("portfolio-phase1-gate",5121826)
          for row in (foundation, independent):
              if row and row.get("status")=="completed" and row.get("conclusion") != "success":
                  print("FAILED")
                  raise SystemExit(0)
          if foundation and independent and all(
              row.get("status")=="completed" and row.get("conclusion")=="success"
              for row in (foundation, independent)
          ):
              print("PASS")
          else:
              print("WAIT")
          PY
            )"
            if [ "$RESULT" = "PASS" ]; then
              exit 0
            fi
            if [ "$RESULT" = "FAILED" ]; then
              echo "Trusted checkpoint verification failed." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for trusted checkpoint verification." >&2
          exit 1

      - name: Merge verified checkpoint candidate through branch protection
        if: ${{ steps.trigger.outputs.checkpoint_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          CHECKPOINT_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          MERGE_BASE="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${MAIN_SHA}...${CHECKPOINT_SHA}" --jq .merge_base_commit.sha)"
          test "$MERGE_BASE" = "$MAIN_SHA"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge \
            -f sha="$CHECKPOINT_SHA" > state_journal/out/checkpoint_merge.json
          python - <<'PY'
          import json
          doc=json.load(open("state_journal/out/checkpoint_merge.json"))
          if doc.get("merged") is not True:
              raise SystemExit("checkpoint protected merge did not complete")
          PY
      - name: Preserve checkpoint candidate receipt
        if: ${{ always() && steps.trigger.outputs.checkpoint_required == 'true' && steps.incident.outputs.active != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-checkpoint-candidate-${{ github.run_id }}
          path: state_journal/out/checkpoint_archive_receipt.json
          if-no-files-found: error
          retention-days: 30

  acceptance-progress:
    # Observe existing schedules; no new cadence, model calls, or mutations.
    if: >-
      ${{
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.head_branch == 'main' &&
         (github.event.workflow_run.event == 'schedule' ||
          (github.event.workflow_run.name == 'foundation-ci' &&
           github.event.workflow_run.conclusion == 'success')))
      }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Observe exact-main final upgrade evidence
        run: python -m acceptance.observe_final_upgrades
      - name: Preserve progress and blocking evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-final-upgrade-progress-${{ github.run_id }}
          path: acceptance/out/
          if-no-files-found: error
          retention-days: 30
