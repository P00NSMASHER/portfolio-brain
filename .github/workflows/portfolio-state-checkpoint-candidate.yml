name: portfolio-state-checkpoint-candidate

on:
  schedule:
    - cron: "19 4 * * 0"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "state_journal/TRIGGER_CHECKPOINT_ARCHIVE"
  workflow_run:
    workflows:
      - portfolio-state-reducer
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-state-checkpoint-candidate
  cancel-in-progress: false

jobs:
  checkpoint:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download triggering reducer blocking receipt
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: portfolio-state-reducer-receipt-${{ github.event.workflow_run.id }}-*
          path: state_journal/out/triggering-reducer
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Classify checkpoint trigger
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = os.environ["EVENT_NAME"] != "workflow_run"
          if not required:
              expected_reason = "Journal capacity exceeded; do not drop evidence"
              receipts = sorted(Path("state_journal/out/triggering-reducer").rglob("receipt.json"))
              for path in receipts:
                  try:
                      receipt = json.loads(path.read_text())
                  except (OSError, json.JSONDecodeError):
                      continue
                  if (
                      receipt.get("status") == "BLOCKED"
                      and receipt.get("reason_type") == "JournalError"
                      and receipt.get("reason") == expected_reason
                  ):
                      required = True
                      break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checkpoint_required={'true' if required else 'false'}\n")
          PY

      - name: Detect existing checkpoint recovery candidate
        if: ${{ steps.trigger.outputs.checkpoint_required == 'true' }}
        id: incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          raw = subprocess.check_output(
              ["gh", "pr", "list", "--state", "open", "--limit", "100", "--json", "number,headRefName"],
              text=True,
              env=os.environ,
          )
          matches = [
              row for row in json.loads(raw)
              if str(row.get("headRefName", "")).startswith("factory/checkpoint-archive-")
          ]
          print("active=" + ("true" if matches else "false"))
          if matches:
              print("pr_number=" + str(sorted(matches, key=lambda row: row["number"])[0]["number"]))
          PY

      - name: Generate validated checkpoint/archive candidate
        if: ${{ steps.trigger.outputs.checkpoint_required == 'true' && steps.incident.outputs.active != 'true' }}
        id: generate
        run: |
          set -euo pipefail
          python -m state_journal.checkpoint_archive             --output state_journal/out/checkpoint_archive_receipt.json
          if git diff --quiet -- state_journal; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open protected checkpoint archive pull request
        if: ${{ steps.generate.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="factory/checkpoint-archive-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add state_journal/ARCHIVE_MANIFEST.json                   state_journal/CHECKPOINT.json.gz                   state_journal/POLICY.json                   state_journal/archive/
          git commit -m "Archive canonical journal checkpoint"
          git push origin "$BRANCH"
          SEQUENCE="$(python - <<'PY'
          import json
          print(json.load(open("state_journal/ARCHIVE_MANIFEST.json"))["archived_sequence"])
          PY
          )"
          gh pr create             --base main             --head "$BRANCH"             --title "Archive canonical journal checkpoint sequence ${SEQUENCE}"             --body "Automated durable checkpoint/archive candidate. The full canonical snapshot and immutable lineage manifest are committed to protected Git history; CHECKPOINT.json.gz contains the exact archived projection. Merge only through required Foundation + portfolio-phase1-gate checks."

      - name: Preserve checkpoint candidate receipt
        if: ${{ always() && steps.trigger.outputs.checkpoint_required == 'true' && steps.incident.outputs.active != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-checkpoint-candidate-${{ github.run_id }}
          path: state_journal/out/checkpoint_archive_receipt.json
          if-no-files-found: error
          retention-days: 30
