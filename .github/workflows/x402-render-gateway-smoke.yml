name: x402 Render Gateway Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'x402-render-gateway/**'
      - 'render.yaml'
      - '.github/workflows/x402-render-gateway-smoke.yml'
  push:
    branches:
      - x402-render-gateway
    paths:
      - 'x402-render-gateway/**'
      - 'render.yaml'
      - '.github/workflows/x402-render-gateway-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x402-render-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check server.js

      - name: Verify Netlify function adapter
        run: |
          node --input-type=module <<'NODE'
          import handler from './netlify/functions/gateway.mjs';

          const base = 'https://agent-data-tools-x402.netlify.app';
          const call = (path, init = {}) => handler(new Request(base + path, init));

          const health = await call('/healthz');
          if (health.status !== 200) throw new Error('healthz status');
          const healthBody = await health.json();
          if (healthBody.ok !== true || healthBody.routes !== 8) throw new Error('healthz body');

          const manifest = await call('/.well-known/agent.json');
          const manifestBody = await manifest.json();
          if (manifest.status !== 200 || manifestBody.version !== '1.3' || manifestBody.intents?.length !== 8) {
            throw new Error('agent manifest');
          }

          const discovery = await call('/.well-known/x402');
          const discoveryBody = await discovery.json();
          if (discovery.status !== 200 || discoveryBody.resources?.length !== 8) throw new Error('discovery');
          if (!discoveryBody.resources.every((resource) =>
            resource.resource.startsWith(base + '/api/') &&
            resource.accepts?.[0]?.network === 'eip155:8453' &&
            resource.accepts?.[0]?.extra?.name === 'USD Coin'
          )) throw new Error('discovery payment metadata');

          const unpaid = await call('/api/pa-entity-one?q=OpenAI');
          const unpaidBody = await unpaid.json();
          if (unpaid.status !== 402 || !unpaid.headers.get('payment-required')) throw new Error('402 challenge headers');
          if (unpaidBody.accepts?.[0]?.amount !== '1000' || unpaidBody.accepts?.[0]?.extra?.version !== '2') {
            throw new Error('402 challenge body');
          }

          const options = await call('/api/pa-entity-one?q=OpenAI', { method: 'OPTIONS' });
          if (options.status !== 204) throw new Error('OPTIONS');
          NODE

      - name: Start gateway
        run: |
          PORT=10000 node server.js > /tmp/x402-gateway.log 2>&1 &
          echo $! > /tmp/x402-gateway.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:10000/health >/tmp/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/x402-gateway.log
          exit 1

      - name: Verify discovery surfaces
        run: |
          curl --fail --silent http://127.0.0.1:10000/openapi.json > /tmp/openapi.json
          curl --fail --silent http://127.0.0.1:10000/.well-known/x402 > /tmp/x402.json
          curl --fail --silent http://127.0.0.1:10000/.well-known/agent.json > /tmp/agent.json
          curl --fail --silent http://127.0.0.1:10000/healthz > /tmp/healthz.json
          node -e "const f=require('fs'); const o=JSON.parse(f.readFileSync('/tmp/openapi.json')); const x=JSON.parse(f.readFileSync('/tmp/x402.json')); const a=JSON.parse(f.readFileSync('/tmp/agent.json')); const h=JSON.parse(f.readFileSync('/tmp/healthz.json')); if(Object.keys(o.paths||{}).length!==8) process.exit(1); if((x.resources||[]).length!==8) process.exit(1); if(!(x.resources||[]).every(r=>Array.isArray(r.accepts)&&r.accepts[0]?.network==='eip155:8453'&&r.accepts[0]?.extra?.name==='USD Coin')) process.exit(1); if(a.version!=='1.3'||(a.intents||[]).length!==8) process.exit(1); if(h.ok!==true||h.routes!==8) process.exit(1);"

      - name: Verify unpaid x402 challenge
        run: |
          curl --silent --dump-header /tmp/headers.txt --output /tmp/body.json --write-out '%{http_code}' 'http://127.0.0.1:10000/api/pa-entity-one?q=OpenAI' > /tmp/status.txt
          test "$(cat /tmp/status.txt)" = "402"
          grep -qi '^payment-required:' /tmp/headers.txt
          node -e "const f=require('fs'); const b=JSON.parse(f.readFileSync('/tmp/body.json')); if(b.x402Version!==2) process.exit(1); const a=b.accepts&&b.accepts[0]; if(!a||a.network!=='eip155:8453'||a.amount!=='1000'||a.extra?.name!=='USD Coin'||a.extra?.version!=='2') process.exit(1);"

      - name: Stop gateway
        if: always()
        run: |
          if [ -f /tmp/x402-gateway.pid ]; then
            kill "$(cat /tmp/x402-gateway.pid)" || true
          fi
