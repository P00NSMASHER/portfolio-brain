name: portfolio-state-reducer

on:
  schedule:
    - cron: "11 4 * * *"
    # One-shot scheduler re-registration canary; remove after proof.
    - cron: "30 15 6 10 *"
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/step2-canonical-ready.txt"
  workflow_run:
    workflows:
      - agent-heartbeat-sweep
      - command-center-pages
      - continuous-learning-bootstrap
      - hunter-autonomous-cycle
      - model-value-proof
      - operator-console
      - portfolio-autonomous-scheduler
      - portfolio-notification-cycle
      - runtime-daily-learning
      - runtime-event-observe
      - runtime-hourly-sync
      - runtime-weekly-synthesis
      - verified-feedback-bootstrap
    types: [completed]
  workflow_dispatch:
    inputs:
      initialize:
        description: "Initialize only from a reviewed, explicit checkpoint on main"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-state-reducer
  cancel-in-progress: false
  queue: max

jobs:
  schedule_canary:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 15 6 10 *' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prove native schedule delivery only
        env:
          EXPECTED_WORKFLOW: portfolio-state-reducer
          EXPECTED_CRON: "30 15 6 10 *"
          ACTUAL_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "schedule"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$ACTUAL_CRON" = "$EXPECTED_CRON"
          test "$GITHUB_WORKFLOW" = "$EXPECTED_WORKFLOW"
          printf 'READ_ONLY_SCHEDULE_CANARY workflow=%s run=%s sha=%s cron=%s\n' "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$ACTUAL_CRON"

  reduce:
    if: ${{ github.event_name != 'schedule' || github.event.schedule != '30 15 6 10 *' }}
    # Sole canonical writer: independent reducer lane lets it catch up while a
    # serialized producer waits at the stale-state barrier.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      INITIALIZE_JOURNAL: ${{ inputs.initialize }}
      TRIGGER_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay verified immutable producer events
        run: |
          if [ "$INITIALIZE_JOURNAL" = "true" ]; then
            python -m state_journal.github_reducer --initialize --checkpoint state_journal/CHECKPOINT.json.gz
          else
            python -m state_journal.github_reducer
          fi
      - name: Publish single reduced shadow snapshot
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-canonical-shadow-state
          path: state_journal/out/reducer/snapshot.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Preserve success or blocking evidence separately
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-reducer-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state_journal/out/reducer/receipt.json
            state_journal/out/reducer/legacy_parity.json
          if-no-files-found: error
          retention-days: 30
