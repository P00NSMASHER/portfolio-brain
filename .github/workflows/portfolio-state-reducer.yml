name: portfolio-state-reducer
run-name: ${{ inputs.prearm_id || (github.event_name == 'workflow_run' && github.event.action == 'in_progress' && format('writerbarrier-{0}-{1}-{2}', github.event.workflow_run.id, github.event.workflow_run.run_attempt, github.event.workflow_run.name)) || github.workflow }}

on:
  schedule:
    - cron: "11 4 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/step2-canonical-ready.txt"
  workflow_run:
    workflows:
      - agent-heartbeat-sweep
      - command-center-pages
      - continuous-learning-bootstrap
      - hunter-autonomous-cycle
      - model-value-proof
      - operator-console
      - portfolio-autonomous-scheduler
      - portfolio-cost-watchdog
      - portfolio-notification-cycle
      - runtime-daily-learning
      - runtime-event-observe
      - runtime-hourly-sync
      - runtime-weekly-synthesis
      - verified-feedback-bootstrap
    types: [in_progress, completed]
  workflow_dispatch:
    inputs:
      prearm_id:
        description: "Pre-arm correlation token; does not grant acceptance credit"
        required: false
        type: string
        default: ""
      initialize:
        description: "Initialize only from a reviewed, explicit checkpoint on main"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-state-reducer
  cancel-in-progress: false
  queue: max

jobs:
  reduce:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        github.event.action == 'completed' ||
        (
          github.event.action == 'in_progress' &&
          (
            github.event.workflow_run.name == 'runtime-hourly-sync' ||
            github.event.workflow_run.name == 'portfolio-autonomous-scheduler' ||
            github.event.workflow_run.name == 'hunter-autonomous-cycle' ||
            github.event.workflow_run.name == 'agent-heartbeat-sweep' ||
            github.event.workflow_run.name == 'portfolio-cost-watchdog' ||
            github.event.workflow_run.name == 'portfolio-notification-cycle' ||
            github.event.workflow_run.name == 'command-center-pages'
          ) &&
          !(
            github.event.workflow_run.event == 'workflow_dispatch' &&
            startsWith(github.event.workflow_run.display_title, 'prearm-')
          )
        )
      }}
    # Sole canonical writer: independent reducer lane lets it catch up while a
    # serialized producer waits at the stale-state barrier.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      INITIALIZE_JOURNAL: ${{ inputs.initialize }}
      TRIGGER_WORKFLOW_RUN_ID: ${{ github.event.action == 'completed' && github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay verified immutable producer events
        run: |
          if [ "$INITIALIZE_JOURNAL" = "true" ]; then
            python -m state_journal.github_reducer --initialize --checkpoint state_journal/CHECKPOINT.json.gz
          else
            python -m state_journal.github_reducer
          fi
      - name: Publish single reduced shadow snapshot
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-canonical-shadow-state
          path: state_journal/out/reducer/snapshot.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Preserve success or blocking evidence separately
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-reducer-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state_journal/out/reducer/receipt.json
            state_journal/out/reducer/legacy_parity.json
          if-no-files-found: error
          retention-days: 30
