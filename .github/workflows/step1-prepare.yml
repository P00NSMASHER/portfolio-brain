name: step1-isolated-state-consistency-proof

on:
  push:
    branches: ["repair/state-writer-step1-20260929"]
    paths:
      - ".step1/step1.patch.gz"
      - ".github/workflows/step1-prepare.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step1-isolated-preparation-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.ref == 'refs/heads/repair/state-writer-step1-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact patch and validate current repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/step1-proof
          python - <<'PY'
          import gzip, hashlib, json, os, pathlib, shlex, subprocess
          root = pathlib.Path.cwd()
          proof = pathlib.Path('/tmp/step1-proof')
          base = 'ef18025b90e2ca66cc185e11ba5e1cb998347ca1'
          branch = 'refs/heads/repair/state-writer-step1-20260929'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REF'] == branch
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          prep = {'.step1/step1.patch.gz', '.github/workflows/step1-prepare.yml'}
          assert set(git('diff', '--name-only', base, 'HEAD').splitlines()) == prep
          patch = gzip.decompress((root/'.step1/step1.patch.gz').read_bytes())
          assert len(patch) == 40628
          assert hashlib.sha256(patch).hexdigest() == 'fb730c5f1ea9a528265361279a19572859a9ddfdf3c36c6543ea5ed6fe53e8a9'
          (proof/'step1.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(proof/'step1.patch')], check=True)
          subprocess.run(['git', 'apply', str(proof/'step1.patch')], check=True)
          notification = root/'notifications/validate_notifications.py'
          old = 'req(cfg["concurrency_group"]=="portfolio-notification","notification concurrency lane drifted")'
          new = 'req(cfg["concurrency_group"]=="portfolio-state-writer-v1","notification shared state-writer lane drifted")'
          text = notification.read_text()
          assert text.count(old) == 1
          notification.write_text(text.replace(old, new))
          expected = {
              '.github/workflows/agent-heartbeat-sweep.yml',
              '.github/workflows/command-center-pages.yml',
              '.github/workflows/continuous-learning-bootstrap.yml',
              '.github/workflows/hunter-autonomous-cycle.yml',
              '.github/workflows/model-value-proof.yml',
              '.github/workflows/operator-console.yml',
              '.github/workflows/portfolio-autonomous-scheduler.yml',
              '.github/workflows/portfolio-notification-cycle.yml',
              '.github/workflows/runtime-event-observe.yml',
              '.github/workflows/runtime-worker.yml',
              '.github/workflows/software-factory-candidate.yml',
              '.github/workflows/verified-feedback-bootstrap.yml',
              'cost_governor/COST_GOVERNOR_POLICY.json',
              'cost_governor/cost_governor.py',
              'cost_governor/validate_cost_governor.py',
              'notifications/validate_notifications.py',
              'operations/validate_operating_mode.py',
              'operations/workflow_liveness.py',
              'runtime/validate_runtime.py',
              'tests/test_agent_heartbeat_state.py',
              'tests/test_artifact_state_integrity.py',
              'tests/test_cost_governor.py',
              'workload_control/WORKLOAD_POLICY.json',
              'workload_control/workload_gate.py',
          }
          assert set(git('diff', '--name-only').splitlines()) == expected
          subprocess.run(['git', 'diff', '--check'], check=True)
          original_restore = subprocess.check_output(['git', 'show', base+':runtime/artifact_restore.py'])
          assert (root/'runtime/artifact_restore.py').read_bytes() == original_restore
          commands = [line.split('run: ', 1)[1] for line in (root/'.github/workflows/foundation-ci.yml').read_text().splitlines() if line.startswith('        run: ')]
          assert len(commands) == 34, 'foundation inventory changed; reconcile explicitly'
          results = []
          for i, command in enumerate(commands, 1):
              args = shlex.split(command)
              assert args[0] == 'python'
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              log = f'validation-{i:02d}.log'
              (proof/log).write_text(result.stdout)
              results.append({'command': command, 'returncode': result.returncode, 'log': log, 'log_sha256': hashlib.sha256(result.stdout.encode()).hexdigest()})
              print(f'{i}/{len(commands)} exit={result.returncode} {command}', flush=True)
              if result.returncode:
                  print(result.stdout[-16000:], flush=True)
                  (proof/'failed-validation.json').write_text(json.dumps(results, indent=2)+'\n')
                  raise SystemExit(result.returncode)
          assert set(git('diff', '--name-only').splitlines()) == expected, 'validation changed tracked data'
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          tree = git('write-tree')
          entries = [{'path':p, 'mode':'100644', 'type':'blob', 'sha':git('hash-object', p)} for p in sorted(expected)]
          receipt = {
              'scope': 'STEP1_ONLY', 'base_sha': base, 'bootstrap_sha': os.environ['GITHUB_SHA'],
              'tested_tree': tree, 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'patch_sha256': hashlib.sha256(patch).hexdigest(), 'changed_paths': sorted(expected),
              'files_sha256': {p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in sorted(expected)},
              'tree_entries': entries, 'validation_commands': results, 'conflict_rejection_unchanged': True,
              'canonical_state_read_or_written': False, 'main_changed': False,
              'existing_forks_reconciled': False, 'live_recovery_verified': False,
              'independent_verification': False,
          }
          (proof/'receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          print('TESTED_TREE_ENTRIES='+json.dumps(entries), flush=True)
          print(results[-1]['command'], flush=True)
          print((proof/'validation-34.log').read_text()[-1200:], flush=True)
          # Store tested bytes under a neutral staging path. Only the authorized
          # connector will later install these blobs as executable workflows.
          for p in sorted(expected):
              target = root/'.step1/candidate'/p
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes((root/p).read_bytes())
          subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', '--', *sorted(expected)], check=True)
          subprocess.run(['git', 'add', '--', '.step1/candidate'], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == {'.step1/candidate/'+p for p in expected}
          PY
      - name: Retain tested blobs only on the isolated staging branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/repair/state-writer-step1-20260929
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage exact-tested Step 1 candidate bytes for connector installation'
          git rev-parse HEAD > /tmp/step1-proof/staging-commit.txt
          git push origin HEAD:refs/heads/repair/state-writer-step1-20260929
      - name: Retain isolated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step1-consistency-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/step1-proof/
          if-no-files-found: error
          retention-days: 30
