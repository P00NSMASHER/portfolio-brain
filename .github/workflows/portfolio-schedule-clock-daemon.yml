name: portfolio-schedule-clock-daemon

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/portfolio-schedule-clock-daemon.yml"
      - ".github/workflows/portfolio-schedule-clock-tick.yml"
      - "operations/schedule_clock.py"
      - "operations/reducer_wake.py"
      - "operations/SCHEDULE_CLOCK_POLICY.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: portfolio-schedule-clock-daemon
  cancel-in-progress: false

jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Queue one successor before entering the clock loop
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run portfolio-schedule-clock-daemon.yml --ref main
          echo "Queued successor generation before clock loop." >> "$GITHUB_STEP_SUMMARY"
      - name: Coordinate reducer wakes and authenticated ten-minute clock ticks while this remains exact main
        shell: bash
        run: |
          set -euo pipefail
          END=$(( $(date -u +%s) + 19800 ))
          NOW="$(date -u +%s)"
          NEXT_TICK=$(( ((NOW / 600) + 1) * 600 ))
          while [ "$(date -u +%s)" -lt "$END" ]; do
            CURRENT="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
            if [ "$CURRENT" != "$GITHUB_SHA" ]; then
              echo "Main moved to $CURRENT; yielding to queued current-main daemon." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            python -m operations.reducer_wake --output operations/out/reducer_wake.json

            NOW="$(date -u +%s)"
            if [ "$NOW" -ge "$NEXT_TICK" ]; then
              gh workflow run portfolio-schedule-clock-tick.yml --ref main \
                -f daemon_run_id="$GITHUB_RUN_ID" \
                -f daemon_run_attempt="$GITHUB_RUN_ATTEMPT" \
                -f tick_epoch="$NEXT_TICK"
              printf 'tick requested daemon=%s tick_epoch=%s at=%s\n' "$GITHUB_RUN_ID" "$NEXT_TICK" "$(date -u +%FT%TZ)"
              NEXT_TICK=$(( NEXT_TICK + 600 ))
            fi

            NOW="$(date -u +%s)"
            REMAIN=$(( NEXT_TICK - NOW ))
            if [ "$REMAIN" -le 0 ]; then
              SLEEP=5
            elif [ "$REMAIN" -lt 60 ]; then
              SLEEP="$REMAIN"
            else
              SLEEP=60
            fi
            if [ "$SLEEP" -lt 5 ]; then SLEEP=5; fi
            sleep "$SLEEP"
          done
