name: step22-finalize-resume

on:
  push:
    branches: ["repair/step22-check-selection-resume-20261001"]
    paths:
      - ".github/workflows/step22-finalize-resume.yml"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: portfolio-step22-finalize-resume-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for exact-head Foundation and hosted verifier
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from acceptance.step22_live_collect import select_trusted_check

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GITHUB_TOKEN"]
          head=os.environ["GITHUB_SHA"]
          deadline=time.monotonic()+1200
          def get(path):
              req=urllib.request.Request(
                  "https://api.github.com/repos/"+repo+path,
                  headers={
                      "Authorization":"Bearer "+token,
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"portfolio-step22-resume/1.0",
                  },
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          while time.monotonic()<deadline:
              checks=get("/commits/"+head+"/check-runs?per_page=100").get("check_runs",[])
              try:
                  foundation=select_trusted_check(checks,name="validate",app_id=15368,head_sha=head)
                  hosted=select_trusted_check(checks,name="portfolio-phase1-gate",app_id=5121826,head_sha=head)
              except RuntimeError:
                  time.sleep(10)
                  continue
              print(json.dumps({"foundation":foundation,"hosted":hosted},sort_keys=True))
              break
          else:
              raise SystemExit("STEP22_RESUME_TRUSTED_HEAD_CHECKS_TIMEOUT")
          PY

      - name: Bind resume inputs and exact protected main
        id: cfg
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          doc=json.load(open("acceptance/STEP22_RESUME.json",encoding="utf-8"))
          req=urllib.request.Request(
              "https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/branches/main",
              headers={
                  "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"portfolio-step22-resume/1.0",
              },
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              current=json.load(r)["commit"]["sha"]
          expected=doc["expected_protected_main_sha"]
          if current!=expected:
              raise SystemExit("STEP22_RESUME_MAIN_MOVED: expected "+expected+" observed "+current)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              for key in ("fingerprint","fault_receipt_hash","fault_detected_at","fault_base_sha","dispatch_run_id","dispatched_at"):
                  out.write(key+"="+str(doc[key])+"\n")
              out.write("repair_merge_sha="+doc["repair_merge_sha"]+"\n")
          print("protected repair main bound:", current)
          PY

      - name: Dispatch protected checkpoint/archive rollover
        id: checkpoint_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run portfolio-state-checkpoint-candidate.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "dispatched_at=$DISPATCHED_AT" >> "$GITHUB_OUTPUT"

      - name: Wait for checkpoint candidate and protected merge
        id: maintenance
        env:
          DISPATCHED_AT: ${{ steps.checkpoint_dispatch.outputs.dispatched_at }}
          REPAIR_MERGE_SHA: ${{ steps.cfg.outputs.repair_merge_sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GITHUB_TOKEN"]
          dispatched_at=os.environ["DISPATCHED_AT"]
          repair_merge=os.environ["REPAIR_MERGE_SHA"]
          deadline=time.monotonic()+2400

          def get(path):
              req=urllib.request.Request(
                  "https://api.github.com/repos/"+repo+path,
                  headers={
                      "Authorization":"Bearer "+token,
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"portfolio-step22-checkpoint-resume/1.0",
                  },
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          workflow_run=None
          while time.monotonic()<deadline:
              doc=get("/actions/workflows/portfolio-state-checkpoint-candidate.yml/runs?branch=main&event=workflow_dispatch&per_page=20")
              rows=[
                  row for row in doc.get("workflow_runs",[])
                  if row.get("head_sha")==repair_merge
                  and row.get("created_at","")>=dispatched_at
              ]
              rows.sort(key=lambda row:row["id"],reverse=True)
              if rows:
                  workflow_run=rows[0]
                  if workflow_run.get("status")=="completed":
                      if workflow_run.get("conclusion")!="success":
                          raise SystemExit("STEP22_CHECKPOINT_WORKFLOW_FAILED:"+str(workflow_run.get("conclusion")))
                      break
              time.sleep(5)
          else:
              raise SystemExit("STEP22_CHECKPOINT_WORKFLOW_TIMEOUT")

          run_id=workflow_run["id"]
          expected_branch="checkpoint/archive-"+str(run_id)
          maintenance_pr=None
          while time.monotonic()<deadline:
              pulls=get("/pulls?state=all&per_page=100&sort=created&direction=desc")
              matches=[
                  row for row in pulls
                  if row.get("head",{}).get("ref")==expected_branch
                  and row.get("base",{}).get("ref")=="main"
              ]
              if len(matches)>1:
                  raise SystemExit("STEP22_CHECKPOINT_PR_AMBIGUOUS")
              if matches:
                  maintenance_pr=matches[0]
                  if maintenance_pr.get("merged_at"):
                      break
              time.sleep(5)
          else:
              raise SystemExit("STEP22_CHECKPOINT_PR_MERGE_TIMEOUT")

          if maintenance_pr.get("base",{}).get("sha")!=repair_merge:
              raise SystemExit("STEP22_CHECKPOINT_PR_BASE_MISMATCH")
          merge_sha=maintenance_pr.get("merge_commit_sha")
          current=get("/branches/main")["commit"]["sha"]
          if current!=merge_sha:
              raise SystemExit("STEP22_CHECKPOINT_MERGE_NOT_EXACT_MAIN")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("workflow_run_id="+str(run_id)+"\n")
              out.write("pr_number="+str(maintenance_pr["number"])+"\n")
              out.write("merge_sha="+merge_sha+"\n")
          print(json.dumps({
              "workflow_run_id":run_id,
              "pr_number":maintenance_pr["number"],
              "merge_sha":merge_sha,
          },sort_keys=True))
          PY

      - name: Resume final Step 22 evidence collection
        run: >-
          python -m acceptance.step22_live_collect
          --fingerprint "${{ steps.cfg.outputs.fingerprint }}"
          --fault-receipt-hash "${{ steps.cfg.outputs.fault_receipt_hash }}"
          --fault-detected-at "${{ steps.cfg.outputs.fault_detected_at }}"
          --fault-base-sha "${{ steps.cfg.outputs.fault_base_sha }}"
          --dispatch-run-id "${{ steps.cfg.outputs.dispatch_run_id }}"
          --dispatched-at "${{ steps.cfg.outputs.dispatched_at }}"
          --maintenance-pr-number "${{ steps.maintenance.outputs.pr_number }}"
          --timeout-seconds 1500
          --output-meta acceptance/out/step22_resumed_meta.json
          --output-receipt acceptance/out/step22_resumed_receipt.json

      - name: Validate final Step 22 receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          from acceptance.final_acceptance import validate_step22
          cfg=json.load(open("acceptance/STEP22_RESUME.json",encoding="utf-8"))
          receipt=json.load(open("acceptance/out/step22_resumed_receipt.json",encoding="utf-8"))
          validate_step22(receipt)
          if receipt["repair_pr_number"] != cfg["repair_pr_number"]:
              raise SystemExit("STEP22_RESUME_REPAIR_PR_MISMATCH")
          if receipt["repair_head_sha"] != cfg["repair_candidate_head_sha"]:
              raise SystemExit("STEP22_RESUME_REPAIR_HEAD_MISMATCH")
          if receipt["repair_merge_sha"] != cfg["repair_merge_sha"]:
              raise SystemExit("STEP22_RESUME_REPAIR_MERGE_MISMATCH")
          print(json.dumps({"status":receipt["status"],"receipt_hash":receipt["receipt_hash"]},sort_keys=True))
          PY

      - name: Upload resumed Step 22 acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-step22-resumed-final-${{ github.run_id }}
          path: |
            acceptance/STEP22_RESUME.json
            acceptance/out/step22_resumed_meta.json
            acceptance/out/step22_resumed_receipt.json
          if-no-files-found: error
          retention-days: 30
