name: hunter-controlled-proof

on:
  push:
    branches: ["main"]
    paths:
      - "hunting/TRIGGER_CONTROLLED_PROOF"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-hunter-controlled-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Hunter calibration corpus
        run: python -m hunting.calibration --output hunting/out/calibration_report.json
      - name: Run live controlled Hunter proof
        run: python -m hunting.controlled_proof --output hunting/out/controlled_proof.json
      - name: Upload controlled Hunter proof
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hunter-controlled-proof
          path: |
            hunting/out/calibration_report.json
            hunting/out/controlled_proof.json
          if-no-files-found: error
          retention-days: 30
