name: step23-live-soak-observer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse the abandoned window
        run: |
          echo '::error::STEP23_ABANDONED_BY_OWNER. No replacement window is armed.'
          exit 1
