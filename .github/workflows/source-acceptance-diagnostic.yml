name: source-acceptance-prerequisite-diagnostic-NOT-CERTIFICATION

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - verification/source_acceptance_diagnostic.py
      - tests/test_source_acceptance_diagnostic.py
      - .github/workflows/source-acceptance-diagnostic.yml

# This diagnostic only reads original evidence via the built-in read-only token.
# No write rights, private App tokens, acceptance receipt or source merge.
permissions:
  actions: read
  contents: read

concurrency:
  group: source-acceptance-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read-only-diagnostic:
    if: >-
      github.repository == 'P00NSMASHER/portfolio-brain' &&
      github.event.pull_request.number == 812 &&
      github.event.pull_request.head.repo.full_name == 'P00NSMASHER/portfolio-brain' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact draft head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Require exact checked-out draft identity
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run isolated error-envelope regressions
        run: python -m unittest -v tests.test_source_acceptance_diagnostic

      - name: Diagnose old original source without any write authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m verification.source_acceptance_diagnostic \
            --source-sha "$SOURCE_SHA" --max-calls 256 \
            --output source-diagnostic-256.json
          # Retry only when the fixed read quota, not an evidence gate, blocked.
          python - <<'PY' > /tmp/diagnostic-retry
          import json
          report=json.load(open('source-diagnostic-256.json',encoding='utf-8'))
          print('yes' if report.get('error_code')=='API_CALL_BUDGET' else 'no')
          PY
          if [ "$(cat /tmp/diagnostic-retry)" = yes ]; then
            python -m verification.source_acceptance_diagnostic \
              --source-sha "$SOURCE_SHA" --max-calls 512 \
              --output source-diagnostic-512.json
          fi

      - name: Publish explicitly non-acceptance diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-source-diagnostic-NOT-CERTIFICATION-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: source-diagnostic-*.json
          if-no-files-found: warn
