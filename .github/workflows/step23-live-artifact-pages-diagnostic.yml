# diagnostic trigger v2
name: step23-live-artifact-pages-diagnostic

on:
  push:
    branches: ["diagnostic/step23-live-artifact-pages-b48e"]
    paths:
      - ".github/workflows/step23-live-artifact-pages-diagnostic.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect live repository artifact pagination
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GITHUB_TOKEN"]
          policy=json.load(open("state_journal/POLICY.json",encoding="utf-8"))
          boundary=datetime.fromisoformat(policy["artifact_scan_start"].replace("Z","+00:00"))

          def get(path):
              req=urllib.request.Request(
                  "https://api.github.com/repos/"+repo+path,
                  headers={
                      "Authorization":"Bearer "+token,
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"step23-artifact-page-diagnostic/1.0",
                  },
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          seen={}
          previous_created=None
          previous_unseen_oldest=None
          row_order=True
          page_envelope=True
          unseen_pages=0
          inversions=[]
          pages=[]
          complete=False
          for page in range(1,21):
              rows=get(f"/actions/artifacts?per_page=100&page={page}").get("artifacts",[])
              page_all=[]
              page_unseen=[]
              dup=0
              crossed=False
              for row in rows:
                  created=datetime.fromisoformat(row["created_at"].replace("Z","+00:00"))
                  page_all.append(created)
                  if previous_created is not None and created > previous_created:
                      row_order=False
                  previous_created=created
                  crossed |= created < boundary
                  prior=seen.get(row["id"])
                  if prior is not None:
                      if prior != row:
                          raise SystemExit("ARTIFACT_METADATA_CHANGED:"+str(row["id"]))
                      dup += 1
                  else:
                      seen[row["id"]]=row
                      page_unseen.append(created)
              inv=None
              if page_unseen:
                  unseen_pages += 1
                  newest=max(page_unseen); oldest=min(page_unseen)
                  if previous_unseen_oldest is not None and newest > previous_unseen_oldest:
                      page_envelope=False
                      inv={
                          "page":page,
                          "newest_unseen":newest.isoformat(),
                          "previous_unseen_oldest":previous_unseen_oldest.isoformat(),
                          "newest_unseen_ids":[
                              r["id"] for r in rows
                              if r["id"] in seen and datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))==newest
                          ][:10],
                      }
                      inversions.append(inv)
                  previous_unseen_oldest=oldest
              elif rows:
                  page_envelope=False
              pages.append({
                  "page":page,
                  "count":len(rows),
                  "duplicates":dup,
                  "unseen":len(page_unseen),
                  "raw_newest":max(page_all).isoformat() if page_all else None,
                  "raw_oldest":min(page_all).isoformat() if page_all else None,
                  "unseen_newest":max(page_unseen).isoformat() if page_unseen else None,
                  "unseen_oldest":min(page_unseen).isoformat() if page_unseen else None,
                  "crossed_boundary":crossed,
                  "inversion":inv,
              })
              if len(rows)<100 or (row_order and crossed):
                  complete=True
                  break

          result={
              "artifact_scan_start":policy["artifact_scan_start"],
              "pages_seen":len(pages),
              "unique_artifacts":len(seen),
              "row_order_proven":row_order,
              "page_envelope_proven":page_envelope,
              "unseen_pages":unseen_pages,
              "complete":complete,
              "ordering_proven":row_order or (len(pages)>=2 and unseen_pages>=2 and page_envelope),
              "inversions":inversions,
              "pages":pages,
          }
          print(json.dumps(result,indent=2,sort_keys=True))
          open("artifact_page_diagnostic.json","w",encoding="utf-8").write(json.dumps(result,indent=2,sort_keys=True)+"\n")
          PY

      - name: Estimate safe exact-fallback request budget
        run: PYTHONPATH=. python diagnostics/step23_request_budget_diagnostic.py

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: step23-live-artifact-pages-${{ github.run_id }}
          path: |
            artifact_page_diagnostic.json
            request_budget_diagnostic.json
          if-no-files-found: error
          retention-days: 7
