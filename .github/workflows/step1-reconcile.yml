name: step1-current-main-reconciliation
on:
  push:
    branches: ['repair/state-writer-step1-20260929']
    paths: ['.github/workflows/step1-reconcile.yml']
permissions:
  contents: write
concurrency:
  group: step1-isolated-reconciliation
  cancel-in-progress: false
  queue: max
jobs:
  reconcile:
    if: github.ref == 'refs/heads/repair/state-writer-step1-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pinned reconciliation with corrected strict group assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/step1-reconciled
          python - <<'PY'
          import pathlib,subprocess,textwrap
          # Reuse the exact previous isolated preparation script, not live code.
          ref='4b126f6d6691916c0fca5f685299ea9100dd41c1:.github/workflows/step1-reconcile.yml'
          source=subprocess.check_output(['git','show',ref],text=True)
          code=textwrap.dedent(source.split("          python - <<'PY'\n",1)[1].split('          PY\n',1)[0])
          needle="p.write_text(s)\np=root/'tests/test_artifact_state_integrity.py'"
          assert code.count(needle)==1
          correction="for group in groups:\n    s=s.replace('group: '+group,'group: portfolio-state-writer-v1')\n"
          code=code.replace(needle,correction+needle)
          target=pathlib.Path('/tmp/step1-reconciled/executed-reconciliation.py')
          target.write_text(code)
          exec(compile(code,str(target),'exec'),{'__name__':'__main__'})
          PY
      - name: Stage tested bytes on this branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/repair/state-writer-step1-20260929
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage reconciled exact-tested Step 1 bytes without changing live state'
          git rev-parse HEAD > /tmp/step1-reconciled/staging-commit.txt
          git push origin HEAD:refs/heads/repair/state-writer-step1-20260929
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step1-reconciled-proof-${{ github.run_id }}
          path: /tmp/step1-reconciled/
          if-no-files-found: error
          retention-days: 30
