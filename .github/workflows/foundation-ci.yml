name: foundation-ci

on:
  push:
    branches: ["main", "step*-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-brain-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deterministic Python
        run: python -m compileall -q registry events adapters truth tests
      - name: Validate foundation
        run: python tests/validate_foundation.py
      - name: Validate Step 2 registry
        run: python -m registry.validate_registry
      - name: Validate Step 4 adapters
        run: python -m adapters.validate_adapters
      - name: Validate Step 5 truth integration
        run: python -m truth.validate_truth_integration
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
