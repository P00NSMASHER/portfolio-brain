name: foundation-ci

on:
  push:
    branches: ["main", "step*-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-brain-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deterministic validators
        run: python -m py_compile tests/validate_foundation.py registry/validate_project.py tests/test_project_schema.py
      - name: Validate foundation
        run: python tests/validate_foundation.py
      - name: Run schema regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
