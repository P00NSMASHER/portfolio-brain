name: foundation-ci

on:
  push:
    branches: ["main", "step*-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-brain-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_artifact_id: ${{ steps.candidate_proof.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.candidate_proof.outputs.artifact-digest }}
      candidate_image_ref: ${{ steps.candidate_image.outputs.image_ref }}
      candidate_image_id: ${{ steps.candidate_image.outputs.image_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deterministic Python
        run: python -m compileall -q registry events adapters truth memory graph runtime hunting learning uncertainty experiments model_router agents allocator policy_replay attribution challenger software_factory repair transfer scheduler cost_governor workload_control commercial_evidence dashboard notifications hostile canary operations action_engine operator_console value_proof tests
      - name: Validate foundation
        run: python tests/validate_foundation.py
      - name: Validate Step 2 registry
        run: python -m registry.validate_registry
      - name: Validate Step 4 adapters
        run: python -m adapters.validate_adapters
      - name: Validate Step 5 truth integration
        run: python -m truth.validate_truth_integration
      - name: Validate Step 6 shared memory
        run: python -m memory.validate_value_memory
      - name: Validate Step 7 universal graph
        run: python -m graph.validate_graph
      - name: Validate Step 8 continuous runtime
        run: python -m runtime.validate_runtime
      - name: Validate Step 9 autonomous Hunter
        run: python -m hunting.validate_hunter
      - name: Validate owner license admission
        run: python -m hunting.validate_license_admission --output hunting/out/license_admission_receipt.json
      - name: Validate Step 10 continuous learning
        run: python -m learning.validate_learning
      - name: Validate Step 11 highest-value uncertainty
        run: python -m uncertainty.validate_uncertainty
      - name: Validate Step 12 experiment engine
        run: python -m experiments.validate_experiments
      - name: Validate Step 13 model router
        run: python -m model_router.validate_model_router
      - name: Validate candidate-specific model value task
        run: python -m value_proof.validate_value_proof
      - name: Validate Step 14 persistent agents
        run: python -m agents.validate_agents
      - name: Validate Step 15 portfolio allocator
        run: python -m allocator.validate_allocator
      - name: Validate historical policy replay
        run: python -m policy_replay.validate_policy_replay
      - name: Validate attribution engine
        run: python -m attribution.validate_attribution
      - name: Validate champion challenger pipeline
        run: python -m challenger.validate_challenger
      - name: Validate Step 16 software factory
        run: python -m software_factory.validate_factory
      - name: Validate Step 17 continuous repair
        run: python -m repair.validate_repair
      - name: Validate Step 18 cross-project transfer
        run: python -m transfer.validate_transfer
      - name: Validate Step 19 autonomous scheduler
        run: python -m scheduler.validate_scheduler
      - name: Validate Step 20 cost governor
        run: python -m cost_governor.validate_cost_governor
      - name: Validate Step 21 executive dashboard
        run: python -m dashboard.validate_dashboard
      - name: Validate read-only command center v2
        run: python -m dashboard.validate_command_center
      - name: Validate public command-center publication
        run: python -m dashboard.validate_publication
      - name: Validate Step 22 notification and escalation layer
        run: python -m notifications.validate_notifications
      - name: Validate Gmail action gateway
        run: python -m action_engine.validate_actions
      - name: Validate Step 23 hostile examination
        run: python -m hostile.validate_hostile_examination
      - name: Execute and validate Step 24 autonomous learning canary
        run: python -m canary.validate_canary --output-dir canary/out
      - name: Validate Step 25 final operating-mode release candidate
        run: python -m operations.validate_operating_mode
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Prepare isolated candidate test image
        id: candidate_image
        timeout-minutes: 1
        run: |
          docker pull python:3.12-slim
          image_id=$(docker image inspect python:3.12-slim --format '{{.Id}}')
          image_ref=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
      - name: Prove scheduler to candidate build on pinned real source
        run: python -m software_factory.validate_candidate_worker --image-id "${{ steps.candidate_image.outputs.image_id }}"
      - name: Upload candidate worker proof
        id: candidate_proof
        if: ${{ always() && hashFiles('candidate-worker-proof/pilot_receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-worker-proof-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: candidate-worker-proof/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Step 24 sanitized canary receipts
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-step24-canary-${{ github.sha }}
          path: canary/out/
          if-no-files-found: error
          retention-days: 30
      - name: Upload license admission controls
        uses: actions/upload-artifact@v4
        with:
          name: license-admission-${{ github.sha }}
          path: hunting/out/license_admission_receipt.json
          if-no-files-found: error
          retention-days: 30

  candidate-replay:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download this run's exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validate.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/candidate-build-input
          merge-multiple: true
      - name: Restore the exact producer test image
        env:
          IMAGE_REF: ${{ needs.validate.outputs.candidate_image_ref }}
          EXPECTED_IMAGE_ID: ${{ needs.validate.outputs.candidate_image_id }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"(?:docker\.io/library/)?python@sha256:[0-9a-f]{64}", os.environ["IMAGE_REF"])'
          docker pull "$IMAGE_REF"
          image_id=$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')
          test "$image_id" = "$EXPECTED_IMAGE_ID"
      - name: Replay the actual patch and prepare the factory review handoff
        env:
          IMAGE_ID: ${{ needs.validate.outputs.candidate_image_id }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCER_ARTIFACT_ID: ${{ needs.validate.outputs.candidate_artifact_id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ needs.validate.outputs.candidate_artifact_digest }}
          PROOF_INPUT: ${{ runner.temp }}/candidate-build-input
        run: >-
          python -m software_factory.validate_candidate_replay
          --proof-dir "$PROOF_INPUT"
          --image-id "$IMAGE_ID"
          --expected-worker-head "$EXPECTED_HEAD"
          --producer-artifact-id "$PRODUCER_ARTIFACT_ID"
          --producer-artifact-digest "$PRODUCER_ARTIFACT_DIGEST"
      - name: Upload replay and factory handoff proof
        if: ${{ always() && hashFiles('candidate-replay-proof/replay_job_receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-replay-proof-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: candidate-replay-proof/
          if-no-files-found: error
          retention-days: 30
