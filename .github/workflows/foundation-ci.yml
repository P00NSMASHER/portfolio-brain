name: foundation-ci

on:
  push:
    branches: ["main", "step*-*"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-brain-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deterministic Python
        run: python -m compileall -q registry events adapters truth memory graph runtime hunting learning uncertainty experiments model_router agents allocator policy_replay attribution challenger software_factory repair transfer scheduler cost_governor workload_control commercial_evidence dashboard notifications hostile canary operations action_engine operator_console value_proof governance tests
      - name: Validate foundation
        run: python tests/validate_foundation.py
      - name: Validate Step 2 registry
        run: python -m registry.validate_registry
      - name: Validate Step 4 adapters
        run: python -m adapters.validate_adapters
      - name: Validate remediation authority boundaries
        run: python -m governance.validate_boundaries
      - name: Validate Step 5 truth integration
        run: python -m truth.validate_truth_integration
      - name: Validate Step 6 shared memory
        run: python -m memory.validate_value_memory
      - name: Validate Step 7 universal graph
        run: python -m graph.validate_graph
      - name: Validate Step 8 continuous runtime
        run: python -m runtime.validate_runtime
      - name: Validate Step 9 autonomous Hunter
        run: python -m hunting.validate_hunter
      - name: Validate owner license admission
        run: python -m hunting.validate_license_admission --output hunting/out/license_admission_receipt.json
      - name: Validate Step 10 continuous learning
        run: python -m learning.validate_learning
      - name: Validate Step 11 highest-value uncertainty
        run: python -m uncertainty.validate_uncertainty
      - name: Validate Step 12 experiment engine
        run: python -m experiments.validate_experiments
      - name: Validate Step 13 model router
        run: python -m model_router.validate_model_router
      - name: Validate candidate-specific model value task
        run: python -m value_proof.validate_value_proof
      - name: Validate Step 14 persistent agents
        run: python -m agents.validate_agents
      - name: Validate Step 15 portfolio allocator
        run: python -m allocator.validate_allocator
      - name: Validate historical policy replay
        run: python -m policy_replay.validate_policy_replay
      - name: Validate attribution engine
        run: python -m attribution.validate_attribution
      - name: Validate champion challenger pipeline
        run: python -m challenger.validate_challenger
      - name: Validate Step 16 software factory
        run: python -m software_factory.validate_factory
      - name: Validate Step 17 continuous repair
        run: python -m repair.validate_repair
      - name: Validate Step 18 cross-project transfer
        run: python -m transfer.validate_transfer
      - name: Validate Step 19 autonomous scheduler
        run: python -m scheduler.validate_scheduler
      - name: Validate Step 20 cost governor
        run: python -m cost_governor.validate_cost_governor
      - name: Validate Step 21 executive dashboard
        run: python -m dashboard.validate_dashboard
      - name: Validate read-only command center v2
        run: python -m dashboard.validate_command_center
      - name: Validate public command-center publication
        run: python -m dashboard.validate_publication
      - name: Validate Step 22 notification and escalation layer
        run: python -m notifications.validate_notifications
      - name: Validate Gmail action gateway
        run: python -m action_engine.validate_actions
      - name: Validate Step 23 hostile examination
        run: python -m hostile.validate_hostile_examination
      - name: Execute and validate Step 24 autonomous learning canary
        run: python -m canary.validate_canary --output-dir canary/out
      - name: Validate Step 25 final operating-mode release candidate
        run: python -m operations.validate_operating_mode
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Exact-source Brain v2 preflight
        run: python -m brain preflight --output brain/out/preflight --expected-sha "$(git rev-parse HEAD)"
      - name: Upload Brain v2 deterministic preflight
        uses: actions/upload-artifact@v4
        with:
          name: brain-v2-preflight-${{ github.sha }}-${{ github.run_id }}
          path: brain/out/preflight/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Step 24 sanitized canary receipts
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-step24-canary-${{ github.sha }}
          path: canary/out/
          if-no-files-found: error
          retention-days: 30
      - name: Upload license admission controls
        uses: actions/upload-artifact@v4
        with:
          name: license-admission-${{ github.sha }}
          path: hunting/out/license_admission_receipt.json
          if-no-files-found: error
          retention-days: 30

  independent-terminal-replay:
    name: v8-sixhour-terminal-once
    needs: validate
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.repository == 'P00NSMASHER/portfolio-brain' && github.event.pull_request.number == 710 && github.event.pull_request.head.ref == 'feature/v8-authority-map-20261016' && github.event.pull_request.head.repo.full_name == 'P00NSMASHER/portfolio-brain' && contains(github.event.pull_request.body, 'V8_TERMINAL_ACCEPTANCE_ONESHOT_710') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout exact reviewed PR candidate without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin original independent offline acceptance collector
        run: |
          set -euo pipefail
          test "$(git hash-object soak_v3/terminal_acceptance_oneshot.py)" = "9973596fe860015a2f7d230922d03fea368f920e"
          install -m 0500 soak_v3/terminal_acceptance_oneshot.py "$RUNNER_TEMP/v8-terminal-acceptance.py"
      - name: Checkout immutable protected source without credentials
        uses: actions/checkout@v4
        with:
          ref: 98cce23ac031ccf9ffa7008a83e9a9b25571d568
          path: canonical
          persist-credentials: false
      - name: Checkout original published terminal state snapshot without credentials
        uses: actions/checkout@v4
        with:
          ref: 302a0b1b7f365f89ca320e6f516884ef4cb10c66
          path: terminal
          persist-credentials: false
      - name: Independently replay original GitHub census and immutable terminal SQLite
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -I "$RUNNER_TEMP/v8-terminal-acceptance.py"
      - name: Preserve original independent sanitized terminal replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: v8-terminal-original-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v8-independent-terminal-replay.json
          if-no-files-found: error
          retention-days: 30
