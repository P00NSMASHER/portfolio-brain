name: foundation-ci

on:
  push:
    branches: ["main", "step1-foundation-20260925"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-brain-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile tests/validate_foundation.py
      - name: Validate foundation
        run: python tests/validate_foundation.py
