name: step23-admin-zombie-cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step23-admin-zombie-cleanup.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: step23-admin-zombie-cleanup
  cancel-in-progress: false

jobs:
  delete-zombie:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_RUN_ID: "37655516971"
      EXPECTED_STALE_SHA: "18f3e3d5a9b3b8c9a3e64e118a7cd487a3551edb"
      EXPECTED_PATH: ".github/workflows/portfolio-state-reducer.yml"
    steps:
      - name: Mint short-lived independent verifier App token
        id: verifier-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: "5121826"
          private-key: ${{ secrets.PORTFOLIO_VERIFIER_PRIVATE_KEY }}
          owner: P00NSMASHER
          repositories: portfolio-brain

      - name: Delete exact jobless queued provider zombie
        shell: bash
        env:
          GH_TOKEN: ${{ steps.verifier-token.outputs.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = int(os.environ["TARGET_RUN_ID"])
          expected_sha = os.environ["EXPECTED_STALE_SHA"]
          expected_path = os.environ["EXPECTED_PATH"]
          api = "https://api.github.com/repos/" + repo

          def request(path, method="GET"):
              req = urllib.request.Request(
                  api + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "portfolio-step23-one-shot-zombie-cleanup/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, response.read(5_000_001)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(5_000_001)

          def get_json(path):
              status, raw = request(path)
              if status != 200:
                  raise SystemExit(f"unexpected GET status {status} for {path}")
              return json.loads(raw)

          main = get_json("/branches/main")
          if main.get("commit", {}).get("sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("cleanup push is not exact current main")

          run = get_json(f"/actions/runs/{target}")
          required = {
              "id": target,
              "head_branch": "main",
              "head_sha": expected_sha,
              "path": expected_path,
              "event": "workflow_run",
              "status": "queued",
          }
          for key, value in required.items():
              if run.get(key) != value:
                  raise SystemExit(f"target run identity/status changed: {key}")

          jobs = get_json(f"/actions/runs/{target}/jobs?filter=all&per_page=100")
          rows = jobs.get("jobs")
          total = jobs.get("total_count")
          if rows != [] or total != 0:
              raise SystemExit("target run has jobs and is not a deletable provider zombie")

          status, _ = request(f"/actions/runs/{target}", method="DELETE")
          if status != 204:
              raise SystemExit(f"repair credential could not delete exact zombie: {status}")

          status, _ = request(f"/actions/runs/{target}")
          if status != 404:
              raise SystemExit(f"deleted zombie remained visible: {status}")

          os.makedirs("operations/out", exist_ok=True)
          receipt = {
              "schema_version": "1.0.0",
              "status": "PASS",
              "target_run_id": target,
              "target_head_sha": expected_sha,
              "target_path": expected_path,
              "target_event": "workflow_run",
              "pre_delete_status": "queued",
              "pre_delete_job_count": 0,
              "delete_status": 204,
              "post_delete_status": 404,
              "executed_on_main_sha": os.environ["GITHUB_SHA"],
              "authority": "PORTFOLIO_VERIFIER_APP_TOKEN",
              "one_shot": True,
          }
          with open("operations/out/step23-admin-zombie-cleanup.json", "w", encoding="utf-8") as fh:
              json.dump(receipt, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Preserve one-shot cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: step23-admin-zombie-cleanup-${{ github.run_id }}
          path: operations/out/step23-admin-zombie-cleanup.json
          if-no-files-found: error
          retention-days: 30
