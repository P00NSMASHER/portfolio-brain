name: agent-heartbeat-merge-proof

on:
  push:
    branches: ["repair/agent-heartbeat-merge-20260928"]
    paths:
      - ".github/workflows/agent-heartbeat-merge-proof.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore and verify current main agent evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from agents.artifact_state import restore
          from agents.heartbeat_state import canon, validate_state
          from dashboard.operational_telemetry import NON_PRODUCTIVE_ACTIVITY_KINDS

          def time(value):
              return datetime.fromisoformat(value.replace("Z","+00:00")).astimezone(timezone.utc)

          out=Path("proof/restored_agent_heartbeat_state.json")
          meta=Path("proof/restore_metadata.json")
          out.parent.mkdir(parents=True,exist_ok=True)

          # Execute branch repair code against durable artifacts produced by main.
          os.environ["GITHUB_REF_NAME"]="main"
          status=restore(out,meta)
          state=json.loads(out.read_text())
          metadata=json.loads(meta.read_text())
          validate_state(state)

          stale_targets=[
              "AGT-ENGINEER",
              "AGT-TESTER",
              "AGT-AUDITOR",
              "AGT-RED-TEAM",
              "AGT-COMMERCIAL-ANALYST",
          ]
          recovered_after=time("2026-09-28T13:37:48.059190Z")
          for agent_id in stale_targets:
              latest=state["agents"][agent_id]["last_heartbeat_at"]
              assert latest is not None and time(latest)>=recovered_after, (agent_id,latest)

          latest_substantive={}
          latest_health={}
          for event in state["recent_events"]:
              if event["activity_kind"] in NON_PRODUCTIVE_ACTIVITY_KINDS:
                  latest_health[event["agent_id"]]=event
              else:
                  latest_substantive[event["agent_id"]]=event

          hunter=latest_substantive.get("AGT-HUNTER")
          assert hunter is not None
          assert hunter["activity_kind"]=="HUNTER_CYCLE"
          assert time(hunter["at"])>=time("2026-09-28T13:42:58.871951Z")

          for agent_id in stale_targets:
              health=latest_health.get(agent_id)
              assert health is not None and time(health["at"])>=recovered_after, (agent_id,health)

          canonical=canon(state).encode()
          receipt={
              "schema_version":"1.0.0",
              "proof_id":"agent-heartbeat-concurrent-merge-e2e-v1",
              "authority_class":"OBSERVE",
              "mutation_capability":"NONE",
              "source_branch":"main",
              "proof_code_sha":os.environ.get("GITHUB_SHA"),
              "proof_run_id":os.environ.get("GITHUB_RUN_ID"),
              "restore_status":status,
              "restore_metadata":metadata,
              "state_sequence":state["sequence"],
              "state_updated_at":state["updated_at"],
              "state_sha256":hashlib.sha256(canonical).hexdigest(),
              "recovered_stale_targets":{
                  agent_id:{
                      "last_heartbeat_at":state["agents"][agent_id]["last_heartbeat_at"],
                      "last_activity_kind":state["agents"][agent_id]["last_activity_kind"],
                      "latest_substantive":latest_substantive.get(agent_id),
                      "latest_health_check":latest_health.get(agent_id),
                  }
                  for agent_id in stale_targets
              },
              "hunter_latest_substantive":hunter,
          }
          Path("proof/merge_receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "restore_status":status,
              "sequence":state["sequence"],
              "recovered_targets":stale_targets,
              "hunter_substantive_at":hunter["at"],
              "source_artifact_ids":metadata.get("source_artifact_ids",[metadata.get("artifact_id")]),
              "source_sequences":metadata.get("source_sequences",[metadata.get("source_sequence")]),
          },sort_keys=True))
          PY
      - name: Upload immutable proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: agent-heartbeat-merge-proof-${{ github.run_id }}
          path: proof/
          if-no-files-found: error
          retention-days: 30
