name: v9 restricted token ruleset schema probe (read only)

on:
  push:
    branches: [review/v9-ruleset-visibility-20261020]

permissions:
  contents: read

jobs:
  original-token-ruleset-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Read only exact original restricted-token ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'v9-ruleset-visibility-readonly',
          }

          url='https://api.github.com/repos/P00NSMASHER/portfolio-brain/rulesets/24182301'
          req=urllib.request.Request(url, headers=headers, method='GET')
          with urllib.request.urlopen(req, timeout=12) as stream:
              rule=json.load(stream)

          types=[x.get('type') for x in rule.get('rules',[]) if type(x) is dict]
          bypass=rule.get('bypass_actors')
          cond=rule.get('conditions')
          ref=(cond or {}).get('ref_name') if type(cond) is dict else None
          print('REST_RULESET_VISIBILITY:',json.dumps({
              'http_success':True,
              'id_exact':rule.get('id')==24182301,
              'enforcement_active':rule.get('enforcement')=='active',
              'bypass_present':'bypass_actors' in rule,
              'bypass_type':type(bypass).__name__,
              'bypass_len':len(bypass) if type(bypass) is list else None,
              'conditions_present':type(cond) is dict,
              'ref_includes':ref.get('include') if type(ref) is dict else None,
              'ref_excludes':ref.get('exclude') if type(ref) is dict else None,
              'rule_types':types
          },sort_keys=True))
          # GraphQL schema introspection is a read-only request; report only
          # public type/field names, never response tokens/private records.
          payload=json.dumps({'query':'query { __type(name: "RepositoryRuleset") { name fields { name } } }'}).encode()
          gh_headers=dict(headers)
          gh_headers['Content-Type']='application/json'
          q=urllib.request.Request('https://api.github.com/graphql',
                                   data=payload,headers=gh_headers,method='POST')
          try:
              with urllib.request.urlopen(q,timeout=12) as stream:
                  doc=json.load(stream)
              ty=doc.get('data',{}).get('__type')
              print('GRAPHQL_RULESET_SCHEMA:',json.dumps({
                  'typename':ty.get('name') if type(ty) is dict else None,
                  'field_names':[x.get('name') for x in ty.get('fields',[])]
                    if type(ty) is dict else [],
                  'errors':[x.get('type') for x in doc.get('errors',[])
                            if type(x) is dict]
              },sort_keys=True))
          except (urllib.error.HTTPError,urllib.error.URLError) as exc:
              print('GRAPHQL_SCHEMA_UNAVAILABLE:',type(exc).__name__)
          PY
