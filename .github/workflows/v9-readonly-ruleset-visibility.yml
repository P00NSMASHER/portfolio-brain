name: v9 restricted token ruleset schema probe (read only)

on:
  push:
    branches: [review/v9-ruleset-visibility-20261020]

permissions:
  contents: read

jobs:
  original-token-ruleset-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Read only exact original restricted-token ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'v9-ruleset-visibility-readonly',
          }

          url='https://api.github.com/repos/P00NSMASHER/portfolio-brain/rulesets/24182301'
          req=urllib.request.Request(url, headers=headers, method='GET')
          with urllib.request.urlopen(req, timeout=12) as stream:
              rule=json.load(stream)

          types=[x.get('type') for x in rule.get('rules',[]) if type(x) is dict]
          bypass=rule.get('bypass_actors')
          cond=rule.get('conditions')
          ref=(cond or {}).get('ref_name') if type(cond) is dict else None
          print('REST_RULESET_VISIBILITY:',json.dumps({
              'http_success':True,
              'id_exact':rule.get('id')==24182301,
              'enforcement_active':rule.get('enforcement')=='active',
              'bypass_present':'bypass_actors' in rule,
              'bypass_type':type(bypass).__name__,
              'bypass_len':len(bypass) if type(bypass) is list else None,
              'conditions_present':type(cond) is dict,
              'ref_includes':ref.get('include') if type(ref) is dict else None,
              'ref_excludes':ref.get('exclude') if type(ref) is dict else None,
              'rule_types':types
          },sort_keys=True))
          # GraphQL schema introspection is a read-only request; report only
          # public type/field names, never response tokens/private records.
          payload=json.dumps({'query':'query { __type(name: "RepositoryRuleset") { name fields { name } } }'}).encode()
          gh_headers=dict(headers)
          gh_headers['Content-Type']='application/json'
          q=urllib.request.Request('https://api.github.com/graphql',
                                   data=payload,headers=gh_headers,method='POST')
          try:
              with urllib.request.urlopen(q,timeout=12) as stream:
                  doc=json.load(stream)
              ty=doc.get('data',{}).get('__type')
              print('GRAPHQL_RULESET_SCHEMA:',json.dumps({
                  'typename':ty.get('name') if type(ty) is dict else None,
                  'field_names':[x.get('name') for x in ty.get('fields',[])]
                    if type(ty) is dict else [],
                  'errors':[x.get('type') for x in doc.get('errors',[])
                            if type(x) is dict]
              },sort_keys=True))
          except (urllib.error.HTTPError,urllib.error.URLError) as exc:
              print('GRAPHQL_SCHEMA_UNAVAILABLE:',type(exc).__name__)
          # Inspect GraphQL bypassActors return shape, without relying on
          # undocumented REST fields. No admin grant or mutations involved.
          schema_body=json.dumps({'query':'query { __type(name: "RepositoryRuleset") { fields { name type { kind name ofType { kind name ofType { kind name } } } } } } __type2: __type(name: "Repository") { fields { name type { kind name ofType { kind name } } } } }'}).encode()
          def graphql(doc):
              req=urllib.request.Request('https://api.github.com/graphql',
                              data=json.dumps(doc).encode(),
                              headers={**headers,'Content-Type':'application/json'},
                              method='POST')
              with urllib.request.urlopen(req,timeout=12) as resp:
                  return json.load(resp)
          try:
              resp=graphql({'query':'query { rulesetType: __type(name: "RepositoryRuleset") { fields { name type { kind name ofType { kind name ofType { kind name } } } } } repositoryType: __type(name: "Repository") { fields { name type { kind name ofType { kind name } } } } }'})
              fields=resp.get('data',{}).get('rulesetType',{}).get('fields',[])
              repos=resp.get('data',{}).get('repositoryType',{}).get('fields',[])
              print('GRAPHQL_BYPASS_SCHEMA:',json.dumps({
                  'ruleset_bypass':[x.get('type') for x in fields if x.get('name')=='bypassActors'],
                  'repository_rulesets':[x.get('type') for x in repos if x.get('name')=='rulesets'],
                  'error_types':[x.get('type') for x in resp.get('errors',[]) if type(x) is dict]
              },sort_keys=True))
          except Exception as exc:
              print('GRAPHQL_BYPASS_SCHEMA_UNAVAILABLE:',type(exc).__name__)

          # Sample exact ruleset node with namespaced identity + bypass census;
          # if the return type rejects this shape, do not invent a result.
          try:
              doc=graphql({'query':'query { repository(owner:"P00NSMASHER",name:"portfolio-brain") { databaseId nameWithOwner isArchived rulesets(first:100) { pageInfo { hasNextPage } nodes { databaseId name enforcement bypassActors(first:100) { totalCount pageInfo { hasNextPage } } } } } }'})
              repo=doc.get('data',{}).get('repository')
              rows=(repo or {}).get('rulesets',{}).get('nodes',[]) if type(repo) is dict else []
              print('GRAPHQL_BYPASS_SAMPLE:',json.dumps({
                  'repo_id':repo.get('databaseId') if type(repo) is dict else None,
                  'repo_name':repo.get('nameWithOwner') if type(repo) is dict else None,
                  'repo_archived':repo.get('isArchived') if type(repo) is dict else None,
                  'rulesets_have_more':repo.get('rulesets',{}).get('pageInfo',{}).get('hasNextPage') if type(repo) is dict else None,
                  'rulesets':[{'id':z.get('databaseId'),'name':z.get('name'),
                               'enforcement':z.get('enforcement'),
                               'bypass_count':(z.get('bypassActors') or {}).get('totalCount'),
                               'bypass_has_more':(z.get('bypassActors') or {}).get('pageInfo',{}).get('hasNextPage')}
                              for z in rows if type(z) is dict and z.get('databaseId')==24182301],
                  'error_types':[x.get('type') for x in doc.get('errors',[]) if type(x) is dict]
              },sort_keys=True))
          except Exception as exc:
              print('GRAPHQL_BYPASS_SAMPLE_UNAVAILABLE:',type(exc).__name__)
          PY

  isolated-candidate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout exact staged source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 24ae3d2ffae4175b200e364035dc85facea170da
          path: staged-candidate
          persist-credentials: false
      - name: Confirm immutable candidate and exact reviewed diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C staged-candidate rev-parse HEAD)" = "24ae3d2ffae4175b200e364035dc85facea170da"
          git -C staged-candidate cat-file -p HEAD | grep -Fx "parent 4393488059c8f7f02ce665a514a10198feae270c"
          echo "EXACT_UNMERGED_CANDIDATE_CHECKOUT_VERIFIED; REVIEW_ONLY"
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-candidate guarded native merger negative and positive tests
        working-directory: staged-candidate
        run: python -m unittest discover -s tests -p test_brain_v9_guarded_merge.py -v
      - name: Exact-candidate mandatory policy and source preflight
        working-directory: staged-candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m brain validate
          python -m brain preflight --output "$RUNNER_TEMP/staged-native-ruleset-preflight" --expected-sha "24ae3d2ffae4175b200e364035dc85facea170da"
          echo "STAGED_CANDIDATE_PASSES_REVIEW_ONLY; NO_MERGE_NO_RELEASE"
