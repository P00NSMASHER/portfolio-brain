name: step2-isolated-proof

on:
  push:
    branches: ["step2-immutable-events-reducer-20260929"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step2-isolated-proof
  cancel-in-progress: false
  queue: max

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retain exact development source
        run: |
          mkdir -p /tmp/step2-proof
          git archive HEAD > /tmp/step2-proof/source.tar
          git rev-parse HEAD > /tmp/step2-proof/source-sha.txt
          git rev-parse 'HEAD^{tree}' > /tmp/step2-proof/source-tree.txt
      - name: Run Step 2 regressions when present
        run: |
          if [ -f tests/test_state_journal.py ]; then
            python -m unittest discover -s tests -p 'test_state_journal*.py' -v > /tmp/step2-proof/step2-tests.log 2>&1
            cat /tmp/step2-proof/step2-tests.log
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: step2-isolated-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/step2-proof/
          if-no-files-found: error
          retention-days: 7
