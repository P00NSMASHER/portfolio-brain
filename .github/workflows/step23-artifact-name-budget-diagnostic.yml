name: step23-artifact-name-budget-diagnostic

on:
  push:
    branches: ["acceptance/step23-soak-b48e-20261002"]
    paths:
      - ".github/workflows/step23-artifact-name-budget-diagnostic.yml"

permissions:
  actions: read
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Measure exact-name artifact listing budget
        shell: bash
        run: |
          mkdir -p acceptance/out
          python - <<'PY'
          import json, math, os, urllib.parse, urllib.request\n          from datetime import datetime
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          policy = json.load(open("state_journal/POLICY.json", encoding="utf-8"))
          max_reads = int(policy["limits"]["max_read_requests"])
          boundary = policy["artifact_scan_start"]
          names_doc = json.load(open("state_journal/UPLOAD_ARTIFACTS.json", encoding="utf-8"))
          names = sorted({name for mapping in names_doc.values() for name in mapping.values()})

          reads = 0
          rows = []
          all_fit = True

          def get(path):
              global reads
              if reads >= max_reads:
                  raise RuntimeError("READ_BUDGET_EXHAUSTED")
              reads += 1
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "portfolio-step23-name-budget/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          for name in names:
              q = urllib.parse.quote(name, safe="")
              first = get(f"/actions/artifacts?name={q}&per_page=100&page=1")
              total = int(first.get("total_count", 0))
              pages = math.ceil(total / 100) if total else 1
              projected_total_reads = reads + max(0, pages - 1)
              if projected_total_reads > max_reads:
                  all_fit = False
                  rows.append({
                      "name": name,
                      "total_count": total,
                      "pages_required": pages,
                      "pages_read": 1,
                      "unique_ids": len({a["id"] for a in first.get("artifacts", [])}),
                      "fits_remaining_budget": False,
                  })
                  break

              seen = {a["id"] for a in first.get("artifacts", [])}
              for page in range(2, pages + 1):
                  doc = get(f"/actions/artifacts?name={q}&per_page=100&page={page}")
                  seen.update(a["id"] for a in doc.get("artifacts", []))

              complete = len(seen) == total
              if not complete:
                  all_fit = False
              rows.append({
                  "name": name,
                  "total_count": total,
                  "pages_required": pages,
                  "pages_read": pages,
                  "unique_ids": len(seen),
                  "fits_remaining_budget": True,
                  "complete_at_measurement": complete,
              })

          receipt = {
              "diagnostic_only": True,
              "counts_for_step23": False,
              "exact_main_sha": "b48e2962be3fc3ac1a96637b1682137ffead7d2c",
              "artifact_scan_start": boundary,
              "max_read_requests": max_reads,
              "unique_exact_names": len(names),
              "reads_used": reads,
              "all_exact_name_listings_fit": all_fit and len(rows) == len(names),
              "measurements": rows,
          }
          Path("acceptance/out/step23_artifact_name_budget.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: step23-artifact-name-budget-${{ github.run_id }}
          path: acceptance/out/step23_artifact_name_budget.json
          if-no-files-found: error
          retention-days: 7
