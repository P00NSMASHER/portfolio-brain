name: hunter-autonomous-cycle

on:
  schedule:
    - cron: "47 */6 * * *"
    # Temporary Step 23 native-delivery qualification cadence; remove after acceptance closes.
    - cron: "5 0 6 10 *"
    - cron: "21 0 6 10 *"
    - cron: "36 0 6 10 *"
    - cron: "51 0 6 10 *"
    - cron: "5 1 6 10 *"
    - cron: "21 1 6 10 *"
    - cron: "36 1 6 10 *"
    - cron: "51 1 6 10 *"
    - cron: "5 2 6 10 *"
    - cron: "21 2 6 10 *"
    - cron: "36 2 6 10 *"
    - cron: "51 2 6 10 *"
    - cron: "5 3 6 10 *"
    - cron: "21 3 6 10 *"
    - cron: "36 3 6 10 *"
    - cron: "51 3 6 10 *"
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/hunter-autonomous-now.txt"
  repository_dispatch:
    types: ["portfolio_hunt"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-hunter-cycle
  cancel-in-progress: false
  queue: max

jobs:
  hunt:
    # Serialize the complete restore -> mutate -> upload transaction.
    concurrency:
      group: portfolio-state-writer-v1
      cancel-in-progress: false
      queue: max
    if: ${{ vars.PORTFOLIO_HUNTER_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_HUNTER_DISABLED: ${{ vars.PORTFOLIO_HUNTER_DISABLED }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check independent workload controls
        id: workload
        run: >-
          python -m workload_control.workload_gate preflight
          --workflow-id hunter-autonomous-cycle
          --job-id hunt
          --estimated-minutes 5
      - name: Restore canonical Hunter state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain hunter --output hunting/live/hunter_state.json
      - name: Restore canonical Hunter proposal backlog
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain proposals --output hunting/live/hunter_proposal_state.json
      - name: Restore REPO-001 scout intake dedupe state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m hunting.repo_scout_artifact_state
          --output hunting/live/repo_scout_intake_state.json
          --metadata-output hunting/out/repo_scout_restore.json
      - name: Restore canonical agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain heartbeat --output agents/live/agent_heartbeat_state.json
      - name: Verify Hunter calibration corpus
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m hunting.calibration --output hunting/out/calibration_report.json
      - name: Intake bounded REPO-001 scout candidates
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m hunting.repo_scout_intake --state hunting/live/repo_scout_intake_state.json --output-dir hunting/out
      - name: Run autonomous bounded Hunter cycle
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m hunting.autonomous_hunter
          --state hunting/live/hunter_state.json
          --output-dir hunting/out
          --repo-scout-intake hunting/out/repo_scout_intake.json
      - name: Heartbeat Hunter
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m agents.heartbeat_state
          --state agents/live/agent_heartbeat_state.json
          --output agents/out/agent_heartbeat_state.json
          --agent-id AGT-HUNTER
          --activity-kind HUNTER_CYCLE
          --source-workflow hunter-autonomous-cycle
          --source-run-id "${GITHUB_RUN_ID}"
      - name: Validate state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -c "import json; from hunting.autonomous_hunter import validate_state; validate_state(json.load(open('hunting/out/hunter_state.json')))"
      - name: Upload REPO-001 scout intake dedupe state
        if: ${{ steps.workload.outputs.allowed == 'true' && hashFiles('hunting/out/repo_scout_intake_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-repo-scout-intake-state
          path: hunting/out/repo_scout_intake_state.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized Hunter continuation state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        id: journal_upload_hunter
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hunter-state
          path: hunting/out/
          if-no-files-found: error
          retention-days: 30
      - name: Upload quality-gated Hunter proposal inbox
        if: ${{ steps.workload.outputs.allowed == 'true' && hashFiles('hunting/out/hunter_proposal_state.json') != '' }}
        id: journal_upload_proposals
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hunter-proposal-state
          path: hunting/out/hunter_proposal_state.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        id: journal_upload_heartbeat
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agent-heartbeat-state
          path: agents/out/agent_heartbeat_state.json
          if-no-files-found: error
          retention-days: 30
      - name: Report governed no-work outcome
        if: ${{ always() && steps.workload.outputs.allowed != 'true' }}
        run: |
          echo "::error title=Portfolio Hunter skipped::Workload status: ${{ steps.workload.outputs.decision_status }}"
          exit 1
      - name: Capture immutable state transition event
        id: journal_event
        if: ${{ always() }}
        env:
          JOURNAL_PUBLISHED_DOMAINS: >-
            {"heartbeat": ${{ steps.journal_upload_heartbeat.outcome == 'success' }}, "hunter": ${{ steps.journal_upload_hunter.outcome == 'success' }}, "proposals": ${{ steps.journal_upload_proposals.outcome == 'success' }}}
        run: python -m state_journal.emitter --producer hunter-autonomous-cycle
      - name: Upload immutable state transition event
        if: ${{ always() && steps.journal_event.outputs.emitted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-event-v2-${{ github.run_id }}-hunter-autonomous-cycle-${{ github.sha }}-${{ github.run_attempt }}
          path: state_journal/out/event/event.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
