name: hunter-autonomous-cycle

on:
  schedule:
    - cron: "47 */6 * * *"
  repository_dispatch:
    types: ["portfolio_hunt"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-cost-governed-autonomy
  cancel-in-progress: false

jobs:
  hunt:
    if: ${{ vars.PORTFOLIO_HUNTER_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_HUNTER_DISABLED: ${{ vars.PORTFOLIO_HUNTER_DISABLED }}
      PORTFOLIO_SPEND_DISABLED: ${{ vars.PORTFOLIO_SPEND_DISABLED }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest cost-governor state
        run: python -m cost_governor.artifact_state --output cost_governor/live/cost_state.json
      - name: Reserve bounded Hunter compute
        id: cost
        run: >-
          python -m cost_governor.workflow_gate preflight
          --state cost_governor/live/cost_state.json
          --output-dir cost_governor/out
          --workflow-id hunter-autonomous-cycle
          --job-id hunt
          --project-id PRJ-000
          --estimated-minutes 5
          --authority OBSERVE
      - name: Restore latest Hunter state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -m hunting.artifact_state --output hunting/live/hunter_state.json
      - name: Run autonomous bounded Hunter cycle
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -m hunting.autonomous_hunter --state hunting/live/hunter_state.json --output-dir hunting/out
      - name: Validate state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -c "import json; from hunting.autonomous_hunter import validate_state; validate_state(json.load(open('hunting/out/hunter_state.json')))"
      - name: Commit conservative Hunter compute usage
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m cost_governor.workflow_gate finalize
          --state cost_governor/out/cost_state.json
          --decision cost_governor/out/cost_decision.json
          --output cost_governor/out/cost_state.json
      - name: Upload sanitized Hunter continuation state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hunter-state
          path: hunting/out/
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized cost-governor continuation state
        if: ${{ always() && hashFiles('cost_governor/out/cost_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cost-governor-state
          path: cost_governor/out/
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when cost gate blocks
        if: ${{ always() && steps.cost.outputs.allowed != 'true' }}
        run: exit 3
