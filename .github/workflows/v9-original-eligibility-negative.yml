name: V9 eligibility guard real-token negative control (read only)

on:
  push:
    branches: [review/v9-eligibility-original-negative-20261020]

permissions:
  contents: read
  pull-requests: write

jobs:
  original-clean-pr-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact unmerged safety candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7ad50146267e4ed573230537b1450ded5c245d96
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Immutable source and focused negative regression tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7ad50146267e4ed573230537b1450ded5c245d96"
          python -m unittest discover -s tests -p test_brain_v9_guarded_merge.py -v
      - name: Verify original restricted GitHub token refuses native enrollment pre-write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from brain.v9 import guarded_merge as gm

          class ReadOnly(gm.GitHub):
              def __init__(self,token):
                  super().__init__(token)
                  self.writes=0
              def _request(self,method,path,body=None):
                  if method=="GET" and path=="repos/P00NSMASHER/portfolio-brain/pulls/723" and body is None:
                      return super()._request(method,path,body)
                  if (method=="POST" and path=="graphql" and type(body) is dict
                      and body.get("query")==gm.THREADS_QUERY
                      and body.get("variables",{}).keys()=={"id"}):
                      return super()._request(method,path,body)
                  raise gm.Denied("READ_ONLY_ORIGINAL_NEGATIVE_CONTROL_FORBIDS_WRITE")

          api=ReadOnly(os.environ["GH_TOKEN"])
          pr=api.get("repos/P00NSMASHER/portfolio-brain/pulls/723")
          if (pr.get("state")!="open" or pr.get("merged") is not False
              or pr.get("head",{}).get("sha")!="19aff3921b85690eae44ce9be239d5c917b57030"
              or pr.get("base",{}).get("sha")!="35ad71868f74e6d4f749a35630a1b86802b91ed0"):
              raise SystemExit("ORIGINAL_PR_DRIFT_HOLD")
          node=pr.get("node_id")
          result=api.graphql(gm.THREADS_QUERY,{"id":node})
          item=result.get("data",{}).get("node") or {}
          if (item.get("id")!=node or item.get("viewerCanEnableAutoMerge") is not False
              or item.get("mergeStateStatus")!="CLEAN"):
              raise SystemExit("NEGATIVE_ORIGINAL_VIEWER_NOT_STILL_DENIED")
          try:
              gm.checked_threads(result,node)
              raise SystemExit("ELIGIBILITY_GUARD_FAILED_TO_BLOCK")
          except gm.Denied as err:
              if str(err)!="NATIVE_AUTOMERGE_UNAVAILABLE_ON_CURRENT_PR":
                  raise
          print("ORIGINAL_RESTRICTED_TOKEN_CLEAN_PR_PREWRITE_HOLD_VERIFIED")
          print(json.dumps({"reviewed_candidate":"7ad50146267e4ed573230537b1450ded5c245d96",
                            "pr":723,"status":"NATIVE_AUTOMERGE_UNAVAILABLE_ON_CURRENT_PR",
                            "merge_state":"CLEAN","viewer_can_enable":False,
                            "native_mutations":api.writes,
                            "merge_authorized":False},sort_keys=True))
          PY
