name: portfolio-cost-watchdog

on:
  schedule:
    - cron: "53 * * * *"
    # One-shot scheduler re-registration canary; remove after proof.
    - cron: "35 15 6 10 *"
  workflow_run:
    workflows:
      - "portfolio-autonomous-scheduler"
      - "runtime-hourly-sync"
      - "agent-heartbeat-sweep"
      - "hunter-autonomous-cycle"
      - "portfolio-notification-cycle"
    types: [completed]
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - "operations/TRIGGER_WORKFLOW_LIVENESS"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: portfolio-cost-watchdog
  # Finish verification/receipt publication; newer pending reads may coalesce.
  cancel-in-progress: false

jobs:
  schedule_canary:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '35 15 6 10 *' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Prove native schedule delivery only
        env:
          EXPECTED_WORKFLOW: portfolio-cost-watchdog
          EXPECTED_CRON: "35 15 6 10 *"
          ACTUAL_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "schedule"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$ACTUAL_CRON" = "$EXPECTED_CRON"
          test "$GITHUB_WORKFLOW" = "$EXPECTED_WORKFLOW"
          printf 'READ_ONLY_SCHEDULE_CANARY workflow=%s run=%s sha=%s cron=%s\n' "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$ACTUAL_CRON"

  enforce:
    if: ${{ github.event_name != 'schedule' || github.event.schedule != '35 15 6 10 *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PORTFOLIO_SPEND_DISABLED: ${{ vars.PORTFOLIO_SPEND_DISABLED }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect active checkpoint recovery incident
        id: persistence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE="$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("factory/checkpoint-archive-"))] | length')"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Recover non-paid core workflows without canonical cost state
        env:
          PERSISTENCE_INCIDENT_OPEN: ${{ steps.persistence.outputs.active }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$PERSISTENCE_INCIDENT_OPEN" = "true" ]; then
            EXTRA+=(--persistence-incident-open)
          fi
          python -m operations.workflow_liveness             --without-cost-state             "${EXTRA[@]}"             --output operations/out/workflow_liveness_pre_restore.json
      - name: Preserve pre-restore liveness recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-workflow-liveness-pre-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/out/workflow_liveness_pre_restore.json
          if-no-files-found: error
          retention-days: 30
      - name: Restore canonical cost-governor state
        run: python -m state_journal.production_reader --domain cost --output cost_governor/live/cost_state.json --metadata-output cost_governor/live/cost_restore.json
      - name: Cancel only managed autonomous runs on hard stop
        run: python -m cost_governor.cancel_managed_jobs --state cost_governor/live/cost_state.json
      - name: Recover overdue core workflows when safe
        env:
          PERSISTENCE_INCIDENT_OPEN: ${{ steps.persistence.outputs.active }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$PERSISTENCE_INCIDENT_OPEN" = "true" ]; then
            EXTRA+=(--persistence-incident-open)
          fi
          python -m operations.workflow_liveness             --state cost_governor/live/cost_state.json             --state-metadata cost_governor/live/cost_restore.json             "${EXTRA[@]}"             --output operations/out/workflow_liveness_receipt.json
      - name: Upload sanitized workflow liveness receipt
        if: ${{ always() && hashFiles('operations/out/workflow_liveness_receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-workflow-liveness
          path: operations/out/workflow_liveness_receipt.json
          if-no-files-found: error
          retention-days: 30
