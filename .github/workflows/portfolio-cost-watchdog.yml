name: portfolio-cost-watchdog

on:
  schedule:
    # Managed autonomous jobs are capped at five minutes, so sub-hour polling
    # cannot reliably interrupt them before completion. Hourly enforcement keeps
    # the independent kill-switch backstop while cutting control-plane starts 75%.
    - cron: "53 * * * *"
  # GitHub scheduled delivery can be delayed. A successful heartbeat sweep is
  # an independent, low-frequency opportunity to recheck core workflow liveness.
  workflow_run:
    workflows: ["agent-heartbeat-sweep"]
    types: [completed]
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - "operations/TRIGGER_WORKFLOW_LIVENESS"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: portfolio-cost-watchdog
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PORTFOLIO_SPEND_DISABLED: ${{ vars.PORTFOLIO_SPEND_DISABLED }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest cost-governor state
        run: python -m cost_governor.artifact_state --output cost_governor/live/cost_state.json
      - name: Cancel only managed autonomous runs on hard stop
        run: python -m cost_governor.cancel_managed_jobs --state cost_governor/live/cost_state.json
      - name: Recover overdue core workflows when safe
        run: >-
          python -m operations.workflow_liveness
          --state cost_governor/live/cost_state.json
          --output operations/out/workflow_liveness_receipt.json
      - name: Upload sanitized workflow liveness receipt
        if: ${{ always() && hashFiles('operations/out/workflow_liveness_receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-workflow-liveness
          path: operations/out/workflow_liveness_receipt.json
          if-no-files-found: error
          retention-days: 30
