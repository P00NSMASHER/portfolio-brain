name: portfolio-cost-watchdog

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: portfolio-cost-watchdog
  cancel-in-progress: true

jobs:
  enforce:
    if: ${{ vars.PORTFOLIO_COST_WATCHDOG_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PORTFOLIO_SPEND_DISABLED: ${{ vars.PORTFOLIO_SPEND_DISABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest sanitized cost state
        run: python -m cost_governor.artifact_state --output cost_governor/live/cost_state.json
      - name: Cancel managed autonomous jobs on hard stop
        run: python -m cost_governor.cancel_managed_jobs --state cost_governor/live/cost_state.json
