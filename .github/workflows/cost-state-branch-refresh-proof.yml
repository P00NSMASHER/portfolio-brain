name: cost-state-branch-refresh-proof

on:
  push:
    branches:
      - step-runtime-state-writer-serialization
    paths:
      - ".github/workflows/cost-state-branch-refresh-proof.yml"
      - ".github/workflows/portfolio-cost-watchdog.yml"
      - "cost_governor/artifact_state.py"

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore validated main cost state
        run: >-
          python -m cost_governor.artifact_state
          --source-branch main
          --output proof/cost_state.json
          --metadata-output proof/cost_restore.json
      - name: Validate restored cost state
        run: >-
          python -c "import json; from cost_governor.cost_governor import validate_state;
          validate_state(json.load(open('proof/cost_state.json')))"
      - name: Upload refreshed sanitized cost observation
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cost-governor-state
          path: proof/cost_state.json
          if-no-files-found: error
          retention-days: 7
