name: V9 original-provider evidence digest laboratory (read only)

on:
  push:
    branches: [review/v9-evidence-report-lab-runner-20261020]

permissions:
  contents: read
  actions: read

jobs:
  authentic-review-artifact-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pinned digest-only proposal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 187c2f3671a5f1c8909bcfd2c92d1b31233bbda6
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify pinned source and isolated digest tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "187c2f3671a5f1c8909bcfd2c92d1b31233bbda6"
          python -m unittest discover -s tests -p test_v9_release_report.py -v
      - name: Fetch original immutable GitHub replay artifact without modifications
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retained"
          gh api repos/P00NSMASHER/portfolio-brain/actions/artifacts/12233874719/zip > "$RUNNER_TEMP/retained/original.zip"
          python - <<'PY'
          import hashlib,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"retained"
          p=root/"original.zip"
          blob=p.read_bytes()
          if not (0<len(blob)<=5000000 and
                  hashlib.sha256(blob).hexdigest()=="b8f24f9d95783c07460e3bccccc717c757aaaa38f4e1da81f543623175df9f57"):
              raise SystemExit("ORIGINAL_PROVIDER_ZIP_SHA_MISMATCH")
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              if (len(names)!=2 or set(names)!={"proof-census.json","proof-provisional.json"}
                      or z.testzip() is not None):
                  raise SystemExit("ORIGINAL_PROVIDER_ZIP_CONTENT_MISMATCH")
              for name in names:
                  data=z.read(name)
                  if not (0<len(data)<1048576):
                      raise SystemExit("ORIGINAL_PROVIDER_JSON_NOT_BOUNDED")
                  (root/name).write_bytes(data)
          print("ORIGINAL_GITHUB_ZIP_DIGEST_AND_CRC_VERIFIED")
          PY
      - name: Produce bounded evidence report with release unconditionally false
        shell: bash
        run: |
          set -euo pipefail
          python -m verification.v9_release_report \
            --source 4393488059c8f7f02ce665a514a10198feae270c \
            --census "$RUNNER_TEMP/retained/proof-census.json" \
            --replay "$RUNNER_TEMP/retained/proof-provisional.json" \
            --output "$RUNNER_TEMP/retained/report.json"
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"retained"/"report.json").read_text())
          if (r.get("technical_window")!="WINDOW_RUNNING_NOT_ACCEPTED"
                  or r.get("original_automatic_core_count")!=3
                  or r.get("completed_span_seconds")!=3766
                  or r.get("last_sequence")!=3425
                  or r.get("source_sha")!="4393488059c8f7f02ce665a514a10198feae270c"
                  or r.get("merge_authorized") is not False
                  or r.get("production_accepted") is not False
                  or r.get("external_provider_authenticated_by_this_module") is not False):
              raise SystemExit("REPORT_UNSAFE_OR_MISBOUND")
          print("ORIGINAL_EVIDENCE_REPORT_PASS_NOT_ACCEPTANCE")
          PY
      - name: Preserve audit-safe evidence report without self-attested approval
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v9-readonly-original-evidence-report
          path: ${{ runner.temp }}/retained/report.json
          if-no-files-found: warn
          retention-days: 30
