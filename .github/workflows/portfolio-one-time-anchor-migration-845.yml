name: portfolio-one-time-anchor-migration-845

# Protected-main-only workflow. No candidate-controlled privileged code,
# autonomous merge, force push, branch-protection changes or timed admission.
on:
  workflow_run:
    workflows: ["foundation-ci"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: portfolio-one-time-anchor-845-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify-one-reviewed-migration:
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'security/fail-closed-rename-trust-anchor-20261104' &&
        github.event.workflow_run.head_repository.full_name == 'P00NSMASHER/portfolio-brain'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      TRUSTED_MAIN_SHA: ${{ github.sha }}
    steps:
      - name: Checkout protected-main migration policy without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source-bound PR and original exact-head Foundation on GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python policy/verification/one_time_anchor_migration_845.py
          --mode preflight --head "$CANDIDATE_SHA"
          --trusted-main "$TRUSTED_MAIN_SHA"

      - name: Checkout candidate only as untrusted data without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Pull isolated standard-library Python image before any App token
        run: docker pull python:3.12-bookworm

      - name: Independently execute full original-source regressions offline
        run: |
          docker run --rm --network none --read-only \
            --user 65534:65534 --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=128 --memory=1536m \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /work:rw,nosuid,nodev,size=512m,mode=1777 \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/candidate:/src:ro" python:3.12-bookworm \
            sh -lc 'cp -R --no-preserve=ownership /src/. /work/ && cd /work && python -I -c '"'"'import sys,unittest;sys.path.insert(0,"/work");suite=unittest.defaultTestLoader.discover("/work/tests",pattern="test_*.py");n=suite.countTestCases();print("MIGRATION_INDEPENDENT_FULL_TEST_COUNT="+str(n),flush=True);sys.exit(3) if n<1000 else None;result=unittest.TextTestRunner(verbosity=1).run(suite);raise SystemExit(not result.wasSuccessful())'"'"''

      - name: Independently execute focused Phase 1 regressions offline
        run: |
          docker run --rm --network none --read-only \
            --user 65534:65534 --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=128 --memory=1536m \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /work:rw,nosuid,nodev,size=512m,mode=1777 \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/candidate:/src:ro" python:3.12-bookworm \
            sh -lc 'cp -R --no-preserve=ownership /src/. /work/ && cd /work && python -I -c '"'"'import sys,unittest;sys.path.insert(0,"/work");suite=unittest.defaultTestLoader.discover("/work/tests",pattern="test_phase1_*.py");n=suite.countTestCases();print("MIGRATION_INDEPENDENT_PHASE1_TEST_COUNT="+str(n),flush=True);sys.exit(3) if n<1 else None;result=unittest.TextTestRunner(verbosity=1).run(suite);raise SystemExit(not result.wasSuccessful())'"'"''

      - name: Independently verify operating-mode invariants offline
        run: |
          docker run --rm --network none --read-only \
            --user 65534:65534 --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=128 --memory=1536m \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /work:rw,nosuid,nodev,size=512m,mode=1777 \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/candidate:/src:ro" python:3.12-bookworm \
            sh -lc 'cp -R --no-preserve=ownership /src/. /work/ && cd /work && python -I -c '"'"'import sys;sys.path.insert(0,"/work");from operations.validate_operating_mode import validate_operating_mode;print(validate_operating_mode())'"'"''

      - name: Create existing independent App5121826 token after tests pass
        id: independent-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: "5121826"
          private-key: ${{ secrets.PORTFOLIO_VERIFIER_PRIVATE_KEY }}
          owner: P00NSMASHER
          repositories: portfolio-brain

      - name: Recheck original gate and publish authenticated one-time check
        env:
          PORTFOLIO_VERIFIER_TOKEN: ${{ steps.independent-token.outputs.token }}
        run: >-
          python policy/verification/one_time_anchor_migration_845.py
          --mode publish --head "$CANDIDATE_SHA"
          --trusted-main "$TRUSTED_MAIN_SHA"
