name: step2-shadow-smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/step2-shadow-smoke.txt"

permissions:
  contents: read
  actions: write

concurrency:
  group: step2-shadow-smoke
  cancel-in-progress: false
  queue: max

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dispatch bounded live-shadow proof chain
        run: python -m state_journal.smoke_dispatch
      - name: Preserve smoke proof receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: step2-shadow-smoke-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: state_journal/out/smoke/receipt.json
          if-no-files-found: error
          retention-days: 30
