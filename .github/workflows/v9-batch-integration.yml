name: v9-batch-integration

# Candidate-only read verification: no cron, write token, protected merge or deploy.
on:
  pull_request:
    paths:
      - 'brain/v9/**'
      - 'tests/test_brain_v9*'
      - '.github/workflows/brain-cycle.yml'
      - '.github/workflows/v9-batch-integration.yml'
permissions:
  contents: read
concurrency:
  group: v9-batch-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  original-publication-proof:
    if: github.event.pull_request.number == 741 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exercise durable execution bridge and hostile evidence regressions
        run: |
          python -m unittest discover -s tests -p 'test_brain_v9_cycle_wiring.py' -v
          python -m unittest discover -s tests -p 'test_brain_v9_publication_reader.py' -v
      - name: Verify original downstream deployment and durable restart replay
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          install -d -m 0700 /tmp/v9-proof
          python -m brain.v9.batch_cycle proof --db /tmp/v9-proof/work.sqlite \
            --spec brain/v9/repair-proof.json --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output /tmp/v9-proof/receipt.json
      - name: Preserve original proof and restart checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-original-publication-${{ github.event.pull_request.head.sha }}
          path: /tmp/v9-proof/receipt.json
          if-no-files-found: warn
          retention-days: 30
