name: command-center-pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "commercial_evidence/**"
      - "workload_control/**"
      - "cost_governor/**"
      - "operations/**"
      - "runtime/**"
      - "scheduler/**"
      - "hunting/**"
      - "notifications/**"
      - "agents/**"
      - "model_router/**"
      - "learning/**"
      - "action_engine/**"
      - ".github/workflows/command-center-pages.yml"
  schedule:
    - cron: "37 * * * *"
    # One-shot scheduler re-registration canary; remove after proof.
    - cron: "52 13 6 10 *"
  workflow_run:
    workflows:
      - "portfolio-cost-watchdog"
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-reporting-pages
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    # Serialize the complete restore -> mutate -> upload transaction.
    concurrency:
      group: portfolio-state-writer-v1
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check independent workload controls
        id: workload
        run: >-
          python -m workload_control.workload_gate preflight
          --workflow-id command-center-pages
          --job-id publish
          --estimated-minutes 10
      - name: Stamp publication provenance
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        shell: bash
        run: |
          {
            echo "PORTFOLIO_PUBLICATION_GENERATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "PORTFOLIO_PUBLICATION_SOURCE_COMMIT=${GITHUB_SHA}"
            echo "PORTFOLIO_PUBLICATION_SOURCE_REF=${GITHUB_REF_NAME}"
            echo "PORTFOLIO_PUBLICATION_RUN_ID=${GITHUB_RUN_ID}"
            echo "PORTFOLIO_PUBLICATION_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "PORTFOLIO_PUBLICATION_EVENT=${GITHUB_EVENT_NAME}"
          } >> "$GITHUB_ENV"
      - name: Restore latest durable command-center state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m dashboard.live_state_bridge
          --output-dir dashboard/live
          --receipt dashboard/live/state_sources.json
      - name: Restore canonical command-center history
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m state_journal.production_reader
          --domain history
          --output dashboard/live/history_state.json
          --metadata-output dashboard/live/history_restore.json
      - name: Append sanitized telemetry history
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m dashboard.history_state
          --state dashboard/live/history_state.json
          --output dashboard/out/history_state.json
          --public-output dashboard/out/history.json
          --source-commit "${GITHUB_SHA}"
      - name: Validate public command center
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m dashboard.validate_publication
      - name: Build static command center
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: |
          mkdir -p public
          python -m dashboard.command_center \
            --write-html public/index.html \
            --write-json public/snapshot.json
          cp dashboard/live/state_sources.json public/state-sources.json
          cp dashboard/out/history.json public/history.json
          touch public/.nojekyll
          printf '%s\n' "${GITHUB_SHA}" > public/source-commit.txt
      - name: Upload sanitized command-center history
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        id: journal_upload_history
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-command-center-history
          path: dashboard/out/history_state.json
          if-no-files-found: error
          retention-days: 90
      - name: Detect material command-center change
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        id: publication_gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "publication_reason=relevant_main_source_change" >> "$GITHUB_OUTPUT"
            echo "Publication required: relevant main source changed."
            exit 0
          fi
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          curl -fsSL --max-time 10 "https://${owner}.github.io/${repo}/snapshot.json" -o /tmp/previous-snapshot.json || true
          should_publish="$(python -m dashboard.publication_gate --current public/snapshot.json --previous /tmp/previous-snapshot.json)"
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"
          echo "publication_reason=scheduled_material_or_freshness_check" >> "$GITHUB_OUTPUT"
          echo "Material publication required: ${should_publish}"
      - name: Upload validated preview artifact
        if: ${{ steps.workload.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-command-center-preview-${{ github.sha }}
          path: public
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        if: ${{ steps.workload.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' }}
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ steps.workload.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' && steps.pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: public
      - name: Deploy command center
        if: ${{ steps.workload.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' && steps.pages.outcome == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify deployed source commit
        if: ${{ steps.workload.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' && steps.deployment.outcome == 'success' }}
        shell: bash
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          expected="$GITHUB_SHA"
          for attempt in 1 2 3 4 5 6; do
            actual="$(curl -fsSL --max-time 10 "${base%/}/source-commit.txt?run=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null | tr -d '\r\n' || true)"
            if [[ "$actual" == "$expected" ]]; then
              echo "Verified deployed source commit: $actual"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Command center deployment verification failed::Expected deployed source commit $expected but the published page did not prove it."
          exit 1
      - name: Explain disabled Pages
        if: ${{ steps.workload.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' && steps.pages.outcome != 'success' }}
        run: |
          echo "::notice title=Portfolio Brain Command Center::Static command center validated and uploaded as an artifact. GitHub Pages is not yet enabled for Actions in repository Settings > Pages."
      - name: Report governed no-publication outcome
        if: ${{ always() && steps.workload.outputs.allowed != 'true' }}
        run: |
          echo "::error title=Command center publication skipped::Workload status: ${{ steps.workload.outputs.decision_status }}"
          exit 1
      - name: Capture immutable state transition event
        id: journal_event
        if: ${{ always() }}
        env:
          JOURNAL_PUBLISHED_DOMAINS: >-
            {"history": ${{ steps.journal_upload_history.outcome == 'success' }}}
        run: python -m state_journal.emitter --producer command-center-pages
      - name: Upload immutable state transition event
        if: ${{ always() && steps.journal_event.outputs.emitted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-event-v2-${{ github.run_id }}-command-center-pages-${{ github.sha }}-${{ github.run_attempt }}
          path: state_journal/out/event/event.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
