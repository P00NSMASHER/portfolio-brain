name: command-center-pages

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "registry/**"
      - "agents/**"
      - "hunting/**"
      - "scheduler/**"
      - "cost_governor/**"
      - "notifications/**"
      - "action_engine/**"
      - "model_router/**"
      - "operations/**"
      - "PORTFOLIO_BUILD_STATE.json"
      - ".github/workflows/command-center-pages.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-brain-command-center-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages_configured: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public command center
        run: python -m dashboard.validate_publication
      - name: Build static command center
        run: |
          mkdir -p public
          python -m dashboard.command_center \
            --write-html public/index.html \
            --write-json public/snapshot.json
          touch public/.nojekyll
          printf '%s\n' "${GITHUB_SHA}" > public/source-commit.txt
      - name: Upload validated preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-command-center-preview-${{ github.sha }}
          path: public
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Explain disabled Pages
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=Portfolio Brain Command Center::Static command center validated and uploaded as an artifact. GitHub Pages is not yet enabled for Actions in repository Settings > Pages."

  deploy:
    if: needs.build.outputs.pages_configured == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy command center
        id: deployment
        uses: actions/deploy-pages@v4
