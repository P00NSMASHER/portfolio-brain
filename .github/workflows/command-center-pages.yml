name: command-center-pages

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-command-center-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check command-center workload controls
        id: cost
        run: >-
          python -m cost_governor.workflow_gate preflight
          --state cost_governor/COST_STATE_SEED.json
          --output-dir cost_governor/out
          --workflow-id command-center-pages
          --job-id publish
          --project-id PRJ-000
          --estimated-minutes 5
          --authority OBSERVE
      - name: Restore latest durable command-center state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m dashboard.live_state_bridge
          --output-dir dashboard/live
          --receipt dashboard/live/state_sources.json
      - name: Restore command-center history
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m dashboard.history_artifact_state
          --output dashboard/live/history_state.json
          --metadata-output dashboard/live/history_restore.json
      - name: Append sanitized telemetry history
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m dashboard.history_state
          --state dashboard/live/history_state.json
          --output dashboard/out/history_state.json
          --public-output dashboard/out/history.json
          --source-commit "${GITHUB_SHA}"
      - name: Validate public command center
        id: validation
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -m dashboard.validate_publication
      - name: Build static command center
        id: build
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: |
          mkdir -p public
          python -m dashboard.command_center \
            --write-html public/index.html \
            --write-json public/snapshot.json
          cp dashboard/live/state_sources.json public/state-sources.json
          cp dashboard/out/history.json public/history.json
          touch public/.nojekyll
          printf '%s\n' "${GITHUB_SHA}" > public/source-commit.txt
      - name: Upload sanitized command-center history
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-command-center-history
          path: dashboard/out/history_state.json
          if-no-files-found: error
          retention-days: 90
      - name: Detect material command-center change
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        id: publication_gate
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          curl -fsSL --max-time 10 "https://${owner}.github.io/${repo}/snapshot.json" -o /tmp/previous-snapshot.json || true
          should_publish="$(python -m dashboard.publication_gate --current public/snapshot.json --previous /tmp/previous-snapshot.json)"
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"
          echo "Material publication required: ${should_publish}"
      - name: Upload validated preview artifact
        if: ${{ steps.cost.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-command-center-preview-${{ github.sha }}
          path: public
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        if: ${{ steps.cost.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' }}
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ steps.cost.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' && steps.pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: public
      - name: Deploy command center
        if: ${{ steps.cost.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' && steps.pages.outcome == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Explain disabled Pages
        if: ${{ steps.cost.outputs.allowed == 'true' && steps.publication_gate.outputs.should_publish == 'true' && steps.pages.outcome != 'success' }}
        run: |
          echo "::notice title=Portfolio Brain Command Center::Static command center validated and uploaded as an artifact. GitHub Pages is not yet enabled for Actions in repository Settings > Pages."
      - name: Summarize command-center execution status
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Command center execution status"
            echo "- Attempted: yes"
            echo "- Workload control: ${{ steps.cost.outputs.decision_status }}"
            echo "- Blocked: ${{ steps.cost.outputs.allowed != 'true' }}"
            echo "- Block reason: ${{ steps.cost.outputs.reason_codes }}"
            echo "- Executed build: ${{ steps.build.outcome }}"
            echo "- Verified publication input: ${{ steps.validation.outcome }}"
            echo "- Material publish required: ${{ steps.publication_gate.outputs.should_publish }}"
            echo "- Deployment: ${{ steps.deployment.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report governed no-publication outcome
        if: ${{ always() && steps.cost.outputs.allowed != 'true' }}
        run: |
          echo "::notice title=Command center publication skipped::Workload control status: ${{ steps.cost.outputs.decision_status }}"
