name: command-center-pages

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "registry/**"
      - "agents/**"
      - "hunting/**"
      - "scheduler/**"
      - "cost_governor/**"
      - "notifications/**"
      - "action_engine/**"
      - "model_router/**"
      - "operations/**"
      - "PORTFOLIO_BUILD_STATE.json"
      - ".github/workflows/command-center-pages.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-brain-command-center-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public command center
        run: python -m dashboard.validate_publication
      - name: Build static command center
        run: |
          mkdir -p public
          python -m dashboard.command_center \
            --write-html public/index.html \
            --write-json public/snapshot.json
          touch public/.nojekyll
          printf '%s\n' "${GITHUB_SHA}" > public/source-commit.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy command center
        id: deployment
        uses: actions/deploy-pages@v4
