name: portfolio-action-worker

on:
  workflow_call:
    secrets:
      action_request_json:
        required: true
      smtp_host:
        required: true
      smtp_port:
        required: false
      smtp_user:
        required: true
      smtp_password:
        required: true
      smtp_from:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-cost-governed-autonomy
  cancel-in-progress: false

jobs:
  execute:
    if: ${{ vars.PORTFOLIO_ACTIONS_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_ACTIONS_DISABLED: ${{ vars.PORTFOLIO_ACTIONS_DISABLED }}
      PORTFOLIO_SPEND_DISABLED: ${{ vars.PORTFOLIO_SPEND_DISABLED }}
      GITHUB_TOKEN: ${{ github.token }}
      PORTFOLIO_EMAIL_SMTP_HOST: ${{ secrets.smtp_host }}
      PORTFOLIO_EMAIL_SMTP_PORT: ${{ secrets.smtp_port }}
      PORTFOLIO_EMAIL_SMTP_USER: ${{ secrets.smtp_user }}
      PORTFOLIO_EMAIL_SMTP_PASSWORD: ${{ secrets.smtp_password }}
      PORTFOLIO_EMAIL_FROM: ${{ secrets.smtp_from }}
      PRIVATE_ACTION_REQUEST_JSON: ${{ secrets.action_request_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest cost-governor state
        run: python -m cost_governor.artifact_state --output cost_governor/live/cost_state.json
      - name: Reserve bounded action-worker compute
        id: cost
        run: >-
          python -m cost_governor.workflow_gate preflight
          --state cost_governor/live/cost_state.json
          --output-dir cost_governor/out
          --workflow-id portfolio-action-worker
          --job-id execute
          --project-id PRJ-000
          --estimated-minutes 5
          --authority EXPERIMENT
      - name: Restore latest action state
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -m action_engine.artifact_state --output action_engine/live/action_state.json
      - name: Materialize private request outside artifact paths
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -c "import os,pathlib; pathlib.Path('/tmp/action_request.json').write_text(os.environ['PRIVATE_ACTION_REQUEST_JSON'])"
      - name: Execute bounded channel action
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: python -m action_engine.action_executor --state action_engine/live/action_state.json --request /tmp/action_request.json --output-dir action_engine/out
      - name: Remove private request
        if: ${{ always() }}
        run: rm -f /tmp/action_request.json
      - name: Commit conservative action-worker compute usage
        if: ${{ steps.cost.outputs.allowed == 'true' }}
        run: >-
          python -m cost_governor.workflow_gate finalize
          --state cost_governor/out/cost_state.json
          --decision cost_governor/out/cost_decision.json
          --output cost_governor/out/cost_state.json
      - name: Upload sanitized action continuation state
        if: ${{ always() && hashFiles('action_engine/out/action_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-action-engine-state
          path: action_engine/out/
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized cost-governor continuation state
        if: ${{ always() && hashFiles('cost_governor/out/cost_state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cost-governor-state
          path: cost_governor/out/
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when cost gate blocks
        if: ${{ always() && steps.cost.outputs.allowed != 'true' }}
        run: exit 3
