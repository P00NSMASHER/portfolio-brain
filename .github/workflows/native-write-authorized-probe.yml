name: Owner-authorized native write canary

on:
  push:
    branches: [review/native-write-authorized-20261020]

permissions:
  contents: read

concurrency:
  group: native-write-authorized-canary
  cancel-in-progress: false

jobs:
  guarded-enrollment:
    if: >-
      ${{ github.repository == 'P00NSMASHER/portfolio-brain' &&
          github.ref_name == 'review/native-write-authorized-20261020' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact-source offline guard regressions
        run: python tools/test_authorized_probe.py
      - name: Validate fixed canary and prepare intent without native writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/native_write_authorized_probe.py prepare
      - name: Persist intent before the single native request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-write-authorized-intent-${{ github.run_id }}
          path: proof/intent.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: One owner-authorized exact-head enrollment request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/native_write_authorized_probe.py attempt
      - name: Preserve sanitized result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-write-authorized-result-${{ github.run_id }}
          path: proof/
          if-no-files-found: warn
          retention-days: 30
          overwrite: false
