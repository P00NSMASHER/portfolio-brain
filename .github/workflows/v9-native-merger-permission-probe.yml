name: v9-native-merger-permission-probe-review-only

on:
  push:
    branches: [review/v9-native-merger-api-permissions-20261019]

permissions:
  contents: read

jobs:
  bounded-provider-reads:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Read-only original GitHub API scope test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          base="https://api.github.com/repos/P00NSMASHER/portfolio-brain"
          token=os.environ["GH_TOKEN"]
          endpoints=[
            ("repository",base),
            ("ruleset",base+"/rulesets/24182301"),
            ("protected_main",base+"/branches/main"),
            ("candidate_check_runs",base+"/commits/893b60a4d5c3299a3821894df490057840a7cefb/check-runs?per_page=100"),
            ("candidate_pr",base+"/pulls/723"),
            ("candidate_files",base+"/pulls/723/files?per_page=100"),
            ("acceptance_matching_refs",base+"/git/matching-refs/heads/brain-acceptance-3ea4dc4d-"),
          ]
          all_ok=True
          for label,url in endpoints:
            req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+token,
              "Accept":"application/vnd.github+json",
              "User-Agent":"v9-guarded-review-readonly-probe"})
            try:
              with urllib.request.urlopen(req,timeout=12) as f:
                status=f.status;body=f.read(1048576)
              result=json.loads(body)
              if label=="repository":
                print("repository_meta:",json.dumps({
                    "id":result.get("id"),"name":result.get("full_name"),
                    "auto_merge":result.get("allow_auto_merge","FIELD_ABSENT"),
                    "permissions":result.get("permissions","FIELD_ABSENT")},
                    sort_keys=True))
              if label=="candidate_check_runs":
                ok=type(result)==dict and result.get("total_count",0)>=1
              elif label=="acceptance_matching_refs":
                ok=status in (200,404)
              else:
                ok=status==200
            except urllib.error.HTTPError as e:
              status=e.code;ok=(label=="acceptance_matching_refs" and status==404)
            except Exception:
              status="unavailable";ok=False
            print(label+": STATUS="+str(status)+" ACCEPTED="+str(ok))
            all_ok &= ok
          query='{ repository(owner: "P00NSMASHER", name: "portfolio-brain") { databaseId nameWithOwner autoMergeAllowed isArchived } }'
          request=urllib.request.Request("https://api.github.com/graphql",
            data=json.dumps({"query":query}).encode("utf-8"),
            headers={"Authorization":"Bearer "+token,"Content-Type":"application/json",
              "Accept":"application/vnd.github+json","User-Agent":"v9-native-merge-probe"},
            method="POST")
          try:
            with urllib.request.urlopen(request,timeout=12) as f:
              graphql=json.loads(f.read(40960))
            payload=graphql.get("data",{}).get("repository")
            graphql_ok=(type(payload)==dict and payload.get("databaseId")==1387747549
              and payload.get("nameWithOwner")=="P00NSMASHER/portfolio-brain"
              and payload.get("autoMergeAllowed") is True
              and payload.get("isArchived") is False
              and not graphql.get("errors"))
            print("graphql_native_auto_merge:",json.dumps({"verified":graphql_ok,"data":payload,"errors":graphql.get("errors")},sort_keys=True))
          except Exception as exc:
            graphql_ok=False
            print("graphql_native_auto_merge:",type(exc).__name__)
          raise SystemExit(0 if all_ok and graphql_ok else 1)
          PY
