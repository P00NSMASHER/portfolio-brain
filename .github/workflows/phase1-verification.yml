name: phase1-verification

on:
  push:
    branches: ["phase1/trust-boundary-20260928"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase1-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record exact source and regression evidence
        shell: bash
        run: |
          mkdir -p /tmp/phase1-proof
          git archive --format=zip HEAD -o /tmp/phase1-proof/source.zip
          git rev-parse HEAD > /tmp/phase1-proof/source-sha.txt
          python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/phase1-proof/regressions.txt 2>&1
      - name: Run focused Phase 1 hostile regressions
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_phase1_*.py' -v > /tmp/phase1-proof/phase1-tests.txt 2>&1
      - name: Record regression scope without granting release authority
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, pathlib, re, subprocess
          out = pathlib.Path('/tmp/phase1-proof')
          counts = {}
          for name in ('regressions', 'phase1-tests'):
              text = (out / (name + '.txt')).read_text()
              count = re.search(r'Ran (\d+) tests? in ', text)
              if not count or not re.search(r'^OK$', text, re.M):
                  raise SystemExit('test result is missing or failed: ' + name)
              counts[name] = int(count.group(1))
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          hashes = {f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() for f in files if f}
          receipt = {'schema_version': '1.0.0', 'kind': 'DETERMINISTIC_REGRESSION_PROOF',
                     'source_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'test_counts': counts,
                     'independent_review': False, 'production_accepted': False,
                     'merge_performed': False, 'deployment_performed': False,
                     'source_sha256': hashes}
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE
      - name: Preserve sanitized evidence even on test failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-proof-${{ github.sha }}
          path: /tmp/phase1-proof/
          if-no-files-found: error
          retention-days: 30
