name: runtime-weekly-synthesis

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-cost-governed-autonomy
  cancel-in-progress: false

jobs:
  weekly:
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: weekly
    secrets:
      portfolio_model_api_key: ${{ secrets.PORTFOLIO_MODEL_API_KEY }}
