name: agent-heartbeat-sweep
run-name: ${{ inputs.prearm_id || github.workflow }}

on:
  schedule:
    - cron: "29 */2 * * *"
  workflow_dispatch:
    inputs:
      prearm_id:
        description: "Pre-arm correlation token; does not grant acceptance credit"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-heartbeat
  cancel-in-progress: false
  queue: max

jobs:
  heartbeat:
    # Serialize the complete restore -> mutate -> upload transaction.
    concurrency:
      group: portfolio-state-writer-v1
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    # Five-minute canonical catch-up + two-minute work + one-minute finalization.
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check independent workload controls
        id: workload
        run: >-
          python -m workload_control.workload_gate preflight
          --workflow-id agent-heartbeat-sweep
          --job-id heartbeat
          --estimated-minutes 8
      - name: Wait for pre-arm reducer barrier after writer-lane acquisition
        if: ${{ inputs.prearm_id != '' && steps.workload.outputs.allowed == 'true' }}
        env:
          STEP23_PREARM_ID: ${{ inputs.prearm_id }}
        run: >-
          python -m acceptance.step23_wait_reducer_barrier
          --target agent-heartbeat-sweep
          --exact-sha "$GITHUB_SHA"
          --output acceptance/out/step23-barrier-wait-${GITHUB_RUN_ID}.json
      - name: Preserve pre-arm reducer barrier wait evidence
        if: ${{ inputs.prearm_id != '' && steps.workload.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-step23-barrier-wait-${{ github.run_id }}
          path: acceptance/out/step23-barrier-wait-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Restore canonical agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: python -m state_journal.production_reader --domain heartbeat --output agents/live/agent_heartbeat_state.json

      - name: Run deterministic subsystem probes
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: |
          python -m agents.validate_agents
          python -m scheduler.validate_scheduler
          python -m hunting.validate_hunter
          python -m runtime.validate_runtime

      - name: Heartbeat every registered agent
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        run: >-
          python -m agents.heartbeat_state
          --state agents/live/agent_heartbeat_state.json
          --output agents/out/agent_heartbeat_state.json
          --all-registered
          --activity-kind HEALTH_CHECK
          --source-workflow agent-heartbeat-sweep
          --source-run-id "${GITHUB_RUN_ID}"

      - name: Upload sanitized agent heartbeat state
        if: ${{ steps.workload.outputs.allowed == 'true' }}
        id: journal_upload_heartbeat
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agent-heartbeat-state
          path: agents/out/agent_heartbeat_state.json
          if-no-files-found: error
          retention-days: 30

      - name: Report governed no-work outcome
        if: ${{ always() && steps.workload.outputs.allowed != 'true' }}
        run: |
          echo "::error title=Agent heartbeat sweep skipped::Workload status: ${{ steps.workload.outputs.decision_status }}"
          exit 1
      - name: Capture immutable state transition event
        id: journal_event
        if: ${{ always() }}
        env:
          JOURNAL_PUBLISHED_DOMAINS: >-
            {"heartbeat": ${{ steps.journal_upload_heartbeat.outcome == 'success' }}}
        run: python -m state_journal.emitter --producer agent-heartbeat-sweep
      - name: Upload immutable state transition event
        if: ${{ always() && steps.journal_event.outputs.emitted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state-event-v2-${{ github.run_id }}-agent-heartbeat-sweep-${{ github.sha }}-${{ github.run_attempt }}
          path: state_journal/out/event/event.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
