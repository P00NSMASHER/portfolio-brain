name: runtime-hourly-sync

on:
  schedule:
    - cron: "17 * * * *"
    # Dense date-bounded Step-23 recovery cadence for the one-hour 2026-10-05 UTC soak; normal cadence is unchanged.
    - cron: "10 20 5 10 *"
    - cron: "22 20 5 10 *"
    - cron: "34 20 5 10 *"
    - cron: "46 20 5 10 *"
  # Do not wait for best-effort cron after runtime/adapter repairs land on main.
  # This remains the same governed OBSERVE-only sync job and does not widen authority.
  push:
    branches: ["main"]
    paths:
      - "adapters/**"
      - "runtime/**"
      - ".github/workflows/runtime-hourly-sync.yml"
      - ".github/workflows/runtime-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sync:
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: sync
