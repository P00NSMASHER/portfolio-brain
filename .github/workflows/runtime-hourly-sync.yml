name: runtime-hourly-sync

on:
  schedule:
    - cron: "17 * * * *"
    # One-shot scheduler re-registration canary; remove after proof.
    - cron: "31 15 6 10 *"
  push:
    branches: ["main"]
    paths:
      - "adapters/**"
      - "runtime/**"
      - ".github/workflows/runtime-hourly-sync.yml"
      - ".github/workflows/runtime-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  schedule_canary:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '31 15 6 10 *' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Prove native schedule delivery only
        env:
          EXPECTED_WORKFLOW: runtime-hourly-sync
          EXPECTED_CRON: "31 15 6 10 *"
          ACTUAL_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "schedule"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$ACTUAL_CRON" = "$EXPECTED_CRON"
          test "$GITHUB_WORKFLOW" = "$EXPECTED_WORKFLOW"
          printf 'READ_ONLY_SCHEDULE_CANARY workflow=%s run=%s sha=%s cron=%s\n' "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$ACTUAL_CRON"

  sync:
    if: ${{ github.event_name != 'schedule' || github.event.schedule != '31 15 6 10 *' }}
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: sync
