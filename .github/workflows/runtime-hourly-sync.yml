name: runtime-hourly-sync
run-name: ${{ inputs.prearm_id || github.workflow }}

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["main"]
    paths:
      - "adapters/**"
      - "runtime/**"
      - ".github/workflows/runtime-hourly-sync.yml"
      - ".github/workflows/runtime-worker.yml"
  workflow_dispatch:
    inputs:
      prearm_id:
        description: "Pre-arm correlation token; does not grant acceptance credit"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  scheduler_canary:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '31 16 6 10 *' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Prove native scheduled delivery without portfolio work
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "schedule"
          test "$GITHUB_REF" = "refs/heads/main"
          printf 'scheduler_canary workflow=runtime-hourly-sync event=%s sha=%s schedule=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_SHA" '31 16 6 10 *'

  sync:
    if: ${{ (github.event_name != 'schedule' || github.event.schedule != '31 16 6 10 *') }}
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: sync
