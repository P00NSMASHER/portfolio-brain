name: runtime-hourly-sync

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["step8-runtime-sync-large-compare"]
    paths:
      - ".github/workflows/runtime-hourly-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sync:
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: sync
