name: runtime-hourly-sync

on:
  schedule:
    - cron: "17 * * * *"
    # Step 23 2x8 two-hour acceptance window.
    - cron: "32 7 6 10 *"
    - cron: "2 8 6 10 *"
    - cron: "32 8 6 10 *"
    - cron: "2 9 6 10 *"
    - cron: "22 9 6 10 *"
  push:
    branches: ["main"]
    paths:
      - "adapters/**"
      - "runtime/**"
      - ".github/workflows/runtime-hourly-sync.yml"
      - ".github/workflows/runtime-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sync:
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: sync
