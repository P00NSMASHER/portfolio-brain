name: runtime-hourly-sync

on:
  schedule:
    - cron: "17 * * * *"
    # Temporary Step 23 native-delivery qualification cadence; remove after acceptance closes.
    - cron: "2 0 6 10 *"
    - cron: "18 0 6 10 *"
    - cron: "33 0 6 10 *"
    - cron: "48 0 6 10 *"
    - cron: "2 1 6 10 *"
    - cron: "18 1 6 10 *"
    - cron: "33 1 6 10 *"
    - cron: "48 1 6 10 *"
    - cron: "2 2 6 10 *"
    - cron: "18 2 6 10 *"
    - cron: "33 2 6 10 *"
    - cron: "48 2 6 10 *"
    - cron: "2 3 6 10 *"
    - cron: "18 3 6 10 *"
    - cron: "33 3 6 10 *"
    - cron: "48 3 6 10 *"
    - cron: "2 4 6 10 *"
    - cron: "11 4 6 10 *"
    - cron: "20 4 6 10 *"
    - cron: "29 4 6 10 *"
    - cron: "38 4 6 10 *"
  # Do not wait for best-effort cron after runtime/adapter repairs land on main.
  # This remains the same governed OBSERVE-only sync job and does not widen authority.
  push:
    branches: ["main"]
    paths:
      - "adapters/**"
      - "runtime/**"
      - ".github/workflows/runtime-hourly-sync.yml"
      - ".github/workflows/runtime-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sync:
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: sync
