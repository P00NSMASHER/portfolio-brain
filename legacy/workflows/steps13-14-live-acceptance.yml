name: steps13-14-live-acceptance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/steps13-14-live-acceptance.yml"
      - "runtime/project_forwarding.py"
      - "runtime/forwarding_artifact_state.py"
      - "runtime/PROJECT_FORWARDING_STATE_SEED.json"
      - "runtime/continuous_runtime.py"
      - ".github/workflows/runtime-worker.yml"
      - "governance/boundaries.json"
      - "verification/project_forwarding_live_proof.py"
      - "hunting/repo_scout_intake.py"
      - "hunting/repo_scout_artifact_state.py"
      - "hunting/REPO_SCOUT_INTAKE_STATE_SEED.json"
      - "hunting/autonomous_hunter.py"
      - ".github/workflows/hunter-autonomous-cycle.yml"
      - "tests/test_project_forwarding.py"
      - "tests/test_repo_scout_intake.py"
      - "tests/test_repo_scout_hunter_handoff.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-steps13-14-live-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require exact protected main at start
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("STEPS13_14_ACCEPTANCE_REQUIRES_MAIN")
          req=urllib.request.Request(
              "https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/branches/main",
              headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                       "X-GitHub-Api-Version":"2022-11-28","User-Agent":"portfolio-steps13-14-acceptance/1.0"})
          with urllib.request.urlopen(req,timeout=30) as response:
              current=json.load(response)["commit"]["sha"]
          if current != os.environ["GITHUB_SHA"]:
              raise SystemExit("STALE_STEPS13_14_ACCEPTANCE_START:"+current)
          print("exact current main:",current)
          PY

      - name: Run focused Steps 13-14 regressions
        run: |
          python -m unittest discover -s tests -p "test_project_forwarding.py" -v
          python -m unittest discover -s tests -p "test_repo_scout_intake.py" -v
          python -m unittest discover -s tests -p "test_repo_scout_hunter_handoff.py" -v

      - name: Prove live exact-once project forwarding
        run: python -m verification.project_forwarding_live_proof --output verification/out/project_forwarding_live_proof.json

      - name: Prove live bounded REPO-001 intake
        run: >-
          python -m hunting.repo_scout_intake
          --state hunting/REPO_SCOUT_INTAKE_STATE_SEED.json
          --output-dir hunting/out

      - name: Build combined Steps 13-14 receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def canon(v): return json.dumps(v,sort_keys=True,separators=(",",":"),ensure_ascii=False)
          step13=json.load(open("verification/out/project_forwarding_live_proof.json",encoding="utf-8"))
          step14=json.load(open("hunting/out/repo_scout_intake.json",encoding="utf-8"))
          assert step13["status"]=="PASS"
          assert step13["first_cycle_delivery_count"]==1 and step13["same_cycle_duplicate_count"]==1
          assert step13["replay_delivery_count"]==0 and step13["replay_duplicate_count"]==1
          assert step13["evidence_scope"]==["REPOSITORY_OBSERVATION"]
          assert all(step13[k] is False for k in ("authority_granted","mutation_performed","deploy_authority","external_action_authority","child_facing_mutation_authority","school_content_publication_authority"))
          assert step14["status"]=="PASS" and step14["source_repository"]=="P00NSMASHER/github-value-hunt-ledger"
          assert 0 <= step14["selected_candidates"] <= step14["max_intake"] == 2
          assert step14["authority_granted"] is False and step14["rights_granted"] is False and step14["value_verified"] is False
          assert all(x["authority_class"]=="OBSERVE" and x["rights_granted"] is False and x["value_verified"] is False and x["reuse_authority_granted"] is False for x in step14["hints"])
          body={
            "schema_version":"1.0.0","status":"PASS","source_sha":os.environ["GITHUB_SHA"],
            "source_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "step13":{"source_revision":step13["source_revision"],"delivery_id":step13["delivery_id"],
                      "first_cycle_delivery_count":step13["first_cycle_delivery_count"],
                      "replay_delivery_count":step13["replay_delivery_count"]},
            "step14":{"source_revision":step14["source_revision"],"selected_candidates":step14["selected_candidates"],
                      "max_intake":step14["max_intake"],"intake_receipt_hash":step14["receipt_hash"]},
            "authority_granted":False,"mutation_performed":False,"market_verified":False,"revenue_verified":False
          }
          body["receipt_hash"]="sha256:"+hashlib.sha256(canon(body).encode()).hexdigest()
          p=Path("verification/out/steps13_14_live_acceptance.json");p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(body,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(body,sort_keys=True))
          PY

      - name: Require exact protected main at completion
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          receipt=json.load(open("verification/out/steps13_14_live_acceptance.json",encoding="utf-8"))
          req=urllib.request.Request(
              "https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/branches/main",
              headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                       "X-GitHub-Api-Version":"2022-11-28","User-Agent":"portfolio-steps13-14-acceptance/1.0"})
          with urllib.request.urlopen(req,timeout=30) as response:
              current=json.load(response)["commit"]["sha"]
          if current != os.environ["GITHUB_SHA"] or receipt.get("source_sha") != os.environ["GITHUB_SHA"] or receipt.get("status")!="PASS":
              raise SystemExit("STALE_OR_INVALID_STEPS13_14_ACCEPTANCE_END:"+current)
          print("exact current main at completion:",current)
          PY

      - name: Upload exact-main Steps 13-14 acceptance bundle
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-steps13-14-live-acceptance-${{ github.run_id }}-${{ github.sha }}
          path: |
            verification/out/steps13_14_live_acceptance.json
            verification/out/project_forwarding_live_proof.json
            hunting/out/repo_scout_intake.json
            hunting/out/repo_scout_intake_state.json
          if-no-files-found: error
          retention-days: 30
