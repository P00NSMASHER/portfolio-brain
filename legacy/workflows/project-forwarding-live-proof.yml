name: project-forwarding-live-proof

on:
  pull_request:
    paths:
      - "adapters/ADAPTER_REGISTRY.json"
      - "adapters/github_readonly.py"
      - "runtime/project_forwarding.py"
      - "governance/boundaries.json"
      - "verification/project_forwarding_live_proof.py"
      - ".github/workflows/project-forwarding-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Observe live registered repository and prove exact-once forwarding
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m verification.project_forwarding_live_proof --output verification/out/project_forwarding_live_proof.json
      - name: Validate sanitized proof contract
        run: |
          python - <<'PY'
          import json,re
          p=json.load(open("verification/out/project_forwarding_live_proof.json"))
          assert p["status"]=="PASS"
          assert p["repository_id"]=="REPO-003" and p["project_id"]=="PRJ-006" and p["adapter_id"]=="ADP-003"
          assert re.fullmatch(r"[0-9a-f]{40}",p["source_revision"])
          assert p["first_cycle_delivery_count"]==1 and p["same_cycle_duplicate_count"]==1
          assert p["replay_delivery_count"]==0 and p["replay_duplicate_count"]==1
          assert p["forwarding_state_sequence"]==1
          assert p["evidence_scope"]==["REPOSITORY_OBSERVATION"]
          assert all(p[k] is False for k in (
            "authority_granted","mutation_performed","deploy_authority","external_action_authority",
            "child_facing_mutation_authority","school_content_publication_authority"))
          PY
      - name: Upload sanitized live forwarding proof
        uses: actions/upload-artifact@v4
        with:
          name: worker4-step13-live-forwarding-${{ github.run_id }}-${{ github.sha }}
          path: verification/out/project_forwarding_live_proof.json
          if-no-files-found: error
          retention-days: 30
