name: step21-live-acceptance

on:
  pull_request:
    paths:
      - "acceptance/step21_quiz_canary.py"
      - "acceptance/step21_live_canary.py"
      - ".github/workflows/step21-live-acceptance.yml"
      - "tests/test_step21_live_canary.py"
  push:
    branches: ["main"]
    paths:
      - "acceptance/step21_quiz_canary.py"
      - "acceptance/step21_live_canary.py"
      - ".github/workflows/step21-live-acceptance.yml"
      - "tests/test_step21_live_canary.py"

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read

concurrency:
  group: step21-live-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  premerge:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PORTFOLIO_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run live Hunter -> proposal -> scheduler review -> candidate binding
        run: >-
          python -m acceptance.step21_live_canary premerge
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --pr-number "${{ github.event.pull_request.number }}"
          --run-id "${{ github.run_id }}"
          --output acceptance/out/step21_premerge.json
      - name: Upload premerge evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-step21-premerge-${{ github.event.pull_request.head.sha }}
          path: acceptance/out/step21_premerge.json
          if-no-files-found: error
          retention-days: 30

  postmerge:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve exact promoted canary and premerge run
        id: meta
        run: |
          set -euo pipefail
          mkdir -p acceptance/out
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"];sha=os.environ["GITHUB_SHA"];token=os.environ["GITHUB_TOKEN"]
          def get(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"step21-live-acceptance/1.0"})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          main=get("https://api.github.com/repos/"+repo+"/branches/main")["commit"]["sha"]
          if main!=sha: raise SystemExit("STEP21_POSTMERGE_NOT_EXACT_MAIN")
          pulls=get("https://api.github.com/repos/"+repo+"/commits/"+sha+"/pulls")
          matches=[p for p in pulls if p.get("merged_at") and p.get("merge_commit_sha")==sha and p.get("head",{}).get("repo",{}).get("full_name")==repo]
          if len(matches)!=1: raise SystemExit("STEP21_PROMOTION_PR_MISSING_OR_AMBIGUOUS")
          pr=matches[0];head=pr["head"]["sha"]
          checks=get("https://api.github.com/repos/"+repo+"/commits/"+head+"/check-runs?per_page=100")["check_runs"]
          def trusted(name,app):
              rows=[x for x in checks if x.get("name")==name and x.get("conclusion")=="success" and x.get("app",{}).get("id")==app]
              if len(rows)!=1: raise SystemExit("STEP21_TRUSTED_CHECK_MISSING_OR_AMBIGUOUS:"+name)
              x=rows[0]
              return {"check_run_id":x["id"],"name":name,"app_id":app,"head_sha":head,"conclusion":"success","completed_at":x["completed_at"]}
          foundation=trusted("validate",15368);hosted=trusted("portfolio-phase1-gate",5121826)
          q=urllib.parse.urlencode({"event":"pull_request","head_sha":head,"per_page":100})
          runs=get("https://api.github.com/repos/"+repo+"/actions/workflows/step21-live-acceptance.yml/runs?"+q)["workflow_runs"]
          runs=[r for r in runs if r.get("conclusion")=="success" and r.get("head_sha")==head]
          if len(runs)<1: raise SystemExit("STEP21_PREMERGE_RUN_MISSING")
          runs.sort(key=lambda r:r["id"],reverse=True);pre=runs[0]
          meta={"current_main_sha":main,"merge_sha":sha,"pr_number":pr["number"],"candidate_head_sha":head,"merged_at":pr["merged_at"],"foundation_check":foundation,"hosted_verifier_check":hosted,"premerge_run_id":pre["id"]}
          open("acceptance/out/step21_meta.json","w").write(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("head_sha="+head+"\n");out.write("premerge_run_id="+str(pre["id"])+"\n")
          PY
      - name: Download exact premerge evidence
        uses: actions/download-artifact@v4
        with:
          name: portfolio-step21-premerge-${{ steps.meta.outputs.head_sha }}
          path: acceptance/out/premerge
          github-token: ${{ github.token }}
          run-id: ${{ steps.meta.outputs.premerge_run_id }}
      - name: Complete verified outcome -> learning -> next scheduler cycle
        run: >-
          python -m acceptance.step21_live_canary postmerge
          --premerge acceptance/out/premerge/step21_premerge.json
          --meta acceptance/out/step21_meta.json
          --run-id "${{ github.run_id }}"
          --output acceptance/out/step21_final_receipt.json
      - name: Upload final Step 21 receipt
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-step21-final-${{ github.run_id }}
          path: acceptance/out/step21_final_receipt.json
          if-no-files-found: error
          retention-days: 30
