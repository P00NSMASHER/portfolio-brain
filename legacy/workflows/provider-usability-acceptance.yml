name: provider-usability-acceptance

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "acceptance/STEP19_LIVE_CANARY_TRIGGER.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-provider-usability-acceptance
  cancel-in-progress: false
  queue: max

jobs:
  exact_main_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      protected_main_sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Require canary from protected main
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Step 19 acceptance must run from refs/heads/main"
            exit 1
          fi

      - name: Resolve protected main
        id: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/P00NSMASHER/portfolio-brain/branches/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "portfolio-provider-usability-acceptance/1.0",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              sha = json.load(response)["commit"]["sha"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"sha={sha}\n")
          if sha != os.environ["GITHUB_SHA"]:
              raise SystemExit(
                  "STALE_STEP19_CANARY_START: dispatch SHA "
                  + os.environ["GITHUB_SHA"]
                  + " is not current protected main "
                  + sha
              )
          PY

  governed_provider_canary:
    needs: exact_main_preflight
    uses: ./.github/workflows/runtime-worker.yml
    with:
      mode: daily
    secrets:
      portfolio_model_api_key: ${{ secrets.PORTFOLIO_MODEL_API_KEY }}

  verify_exact_main_usability:
    needs:
      - exact_main_preflight
      - governed_provider_canary
    if: ${{ always() && needs.exact_main_preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download sanitized runtime canary artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: portfolio-runtime-state
          path: step19/runtime

      - name: Locate current-run provider evidence
        id: evidence
        shell: bash
        run: |
          provider_path="$(find step19/runtime -type f -name provider_health.json -print -quit 2>/dev/null || true)"
          analysis_path="$(find step19/runtime -type f -name daily_model_analysis.json -print -quit 2>/dev/null || true)"
          if [[ -z "$provider_path" ]]; then
            provider_path="step19/runtime/provider_health.json"
          fi
          if [[ -z "$analysis_path" ]]; then
            analysis_path="step19/runtime/daily_model_analysis.json"
          fi
          echo "provider_path=$provider_path" >> "$GITHUB_OUTPUT"
          echo "analysis_path=$analysis_path" >> "$GITHUB_OUTPUT"

      - name: Resolve protected main after canary
        id: current_main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/P00NSMASHER/portfolio-brain/branches/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "portfolio-provider-usability-acceptance/1.0",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              sha = json.load(response)["commit"]["sha"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"sha={sha}\n")
          PY

      - name: Build fail-closed Step 19 acceptance receipt
        id: verify
        continue-on-error: true
        shell: bash
        run: >-
          python -m runtime.provider_usability_acceptance
          --provider-health "${{ steps.evidence.outputs.provider_path }}"
          --model-analysis "${{ steps.evidence.outputs.analysis_path }}"
          --source-run-id "${{ github.run_id }}"
          --source-head-sha "${{ github.sha }}"
          --observed-main-sha "${{ steps.current_main.outputs.sha }}"
          --output step19/out/provider_usability_acceptance.json
          --require-pass

      - name: Upload Step 19 acceptance receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-step19-provider-usability-${{ github.run_id }}
          path: step19/out/provider_usability_acceptance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce verified provider usability
        if: ${{ steps.verify.outcome != 'success' }}
        shell: bash
        run: |
          echo "::error::Step 19 provider usability canary did not prove an exact-main verified provider call."
          exit 1
