name: portfolio-schedule-clock-tick

on:
  workflow_dispatch:
    inputs:
      daemon_run_id:
        description: "Authenticated parent daemon run ID"
        required: true
        type: string
      daemon_run_attempt:
        description: "Authenticated parent daemon attempt"
        required: true
        type: string
      tick_epoch:
        description: "UTC ten-minute boundary epoch"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: portfolio-schedule-clock-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOCK_DAEMON_RUN_ID: ${{ inputs.daemon_run_id }}
      CLOCK_DAEMON_RUN_ATTEMPT: ${{ inputs.daemon_run_attempt }}
      CLOCK_TICK_EPOCH: ${{ inputs.tick_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run authenticated durable clock tick
        run: >-
          python -m operations.schedule_clock
          --daemon-run-id "$CLOCK_DAEMON_RUN_ID"
          --daemon-run-attempt "$CLOCK_DAEMON_RUN_ATTEMPT"
          --tick-epoch "$CLOCK_TICK_EPOCH"
          --output operations/out/schedule_clock_receipt.json
      - name: Preserve durable clock receipt
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-schedule-clock-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/out/schedule_clock_receipt.json
          if-no-files-found: error
          retention-days: 30
