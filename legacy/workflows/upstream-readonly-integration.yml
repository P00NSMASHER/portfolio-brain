name: upstream-readonly-integration

on:
  push:
    branches:
      - main
    paths:
      - "verification/UPSTREAM_READONLY_INTEGRATION_CONTRACT.json"
      - "verification/upstream_readonly_probe.py"
      - "truth/AI_BUSINESS_OS_TRUTH_ENGINE_PIN.json"
      - "memory/AI_BUSINESS_OS_VALUE_MEMORY_PIN.json"
      - "hunting/AI_BUSINESS_OS_HUNTER_PIN.json"
      - "learning/AI_BUSINESS_OS_LEARNING_ENGINE_PIN.json"
      - ".github/workflows/upstream-readonly-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run read-only upstream proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m verification.upstream_readonly_probe --output-dir verification/out

      - name: Upload separate proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-readonly-integration-${{ github.sha }}
          path: |
            verification/out/upstream_pin_identity_receipt.json
            verification/out/upstream_live_integration_receipt.json
          if-no-files-found: error
          retention-days: 30
